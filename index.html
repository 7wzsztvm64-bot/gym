  // Banners: demo data / backup reminder / recovered data
  if (BOOT.recovered) h += `<div class="banner info">${ic('info')}<div><b>Restored from yesterday’s snapshot</b><p>The latest saved data could not be read, so the daily safety copy was loaded. The unreadable copy is kept and can be downloaded in Settings.</p></div></div>`;
  if (hasDemo()) h += `<div class="banner info">${ic('info')}<div><b>You’re looking at demo data</b><p>Explore the statistics, then remove it before you start logging.</p><button class="btn sm mt8" data-act="clear-demo">Remove demo data</button></div></div>`;
  else if (needsBackupReminder()) h += `<div class="banner info">${ic('download')}<div><b>${S.meta.lastBackup ? `Last backup ${fmt.rel(S.meta.lastBackup)}` : 'No backup yet'}</b><p>Your data only lives on this device. Export a backup file now and then.</p><div class="banner-acts"><button class="btn sm" data-act="export-json">Export backup</button><button class="btn sm ghost" data-act="snooze-backup">Later</button></div></div></div>`;

  // Hero: next workout (or the one in progress)
  if (aw) {
    const a = D.wAgg.get(aw.id);
    const stale = Date.now() - aw.start > 12 * 3600e3;
    h += `<section class="hero" style="${ctxStyle(color)}">
      <div class="hero-k">${stale ? `Started ${esc(fmt.date(aw.start))}, still open` : 'In progress'}</div>
      <div class="hero-day">${esc(aw.type)}</div>
      <div class="hero-stats">
        <div><span class="num">${a.sets}</span><label>Sets</label></div>
        <div><span class="num">${fmt.int(a.vol)}</span><label>kg moved</label></div>
        <div><span class="num">${a.prs}</span><label>Records</label></div>
      </div>
      <button class="btn ctx lg block" data-act="resume">${ic('play')}Resume workout</button>
      ${stale ? `<div class="hero-alt"><button class="btn sm" data-act="finish" data-wid="${aw.id}">Finish it</button><button class="btn sm danger" data-act="discard" data-wid="${aw.id}">Discard</button></div>` : ''}
    </section>`;
  } else {
    const lastSame = lastWorkoutOfType(next);
    const preview = lastSame && S.settings.prefillFromLast ? lastSame.entries.filter((e) => e.sets.length).map((e) => exById(e.exId)).filter(Boolean) : [];
    const others = S.settings.dayTypes.filter((t) => t.name !== next);
    h += `<section class="hero" style="${ctxStyle(color)}">
      <div class="hero-k">Next up</div>
      <div class="hero-day">${esc(next)}</div>
      <p class="hero-meta">${lastSame ? `Last ${esc(next)} day was ${esc(fmt.rel(lastSame.start))}: ${D.wAgg.get(lastSame.id).ex} exercises, ${fmt.kg(D.wAgg.get(lastSame.id).vol)}.` : `Your first ${esc(next)} day here. Add exercises as you go.`}</p>
      ${preview.length ? `<p class="hero-ex">${preview.slice(0, 4).map((e) => esc(e.name)).join(', ')}${preview.length > 4 ? ` and ${preview.length - 4} more` : ''}</p>` : ''}
      <button class="btn ctx lg block" data-act="start" data-type="${esc(next)}">${ic('play')}Start ${esc(next)}</button>
      <div class="hero-alt"><span>Or</span>${others.slice(0, 4).map((t) => `<button class="chip" data-act="start" data-type="${esc(t.name)}"><i class="dot" style="background:${t.color}"></i>${esc(t.name)}</button>`).join('')}<button class="chip" data-act="start-other">${ic('plus')}Other</button></div>
    </section>`;
  }

  // This week
  const restSoFar = strip.filter((d) => !d.future && !d.types.length && !d.today).length;
  h += `<section class="sec"><div class="sec-h"><h2>This week</h2><span class="sec-a">${st.thisWeek} of ${pl(st.goal, 'workout')}</span></div>
    <div class="panel"><div class="week">${strip.map((d) => {
      const t = d.types[0];
      const c = t ? typeColor(t) : null;
      return `<div class="wd${d.future ? ' fut' : ''}"><span class="wd-l">${'MTWTFSS'[(new Date(d.ts).getDay() + 6) % 7]}</span><span class="wd-c${t ? ' done' : ''}${d.today ? ' today' : ''}" style="${c ? `--dc:${c}` : ''}">${new Date(d.ts).getDate()}${d.rec ? '<i class="wd-r" title="Recovery"></i>' : ''}</span><span class="wd-t">${t ? esc(t.length > 5 ? t.slice(0, 4) + '.' : t) : ''}</span></div>`;
    }).join('')}</div>
    <div class="kv3">
      <div><span class="num">${fmt.t(week.vol)}</span><label>moved</label></div>
      <div><span class="num">${week.sets}</span><label>sets</label></div>
      <div><span class="num">${restSoFar}</span><label>${restSoFar === 1 ? 'rest day' : 'rest days'}</label></div>
    </div></div></section>`;

  // Key figures
  h += `<div class="tiles t3 mt12">
    <div class="tile"><div class="tile-l">Week streak</div><div class="tile-v">${st.current}</div><div class="tile-d">${ic('flame')}goal ${st.goal}×/week</div></div>
    <div class="tile"><div class="tile-l">${esc(fmt.monthS(Date.now()))} volume</div><div class="tile-v">${fmt.t(month.vol).replace(' t', '')}<small>t</small></div><div class="tile-d">${pl(month.n, 'workout')}</div></div>
    <div class="tile"><div class="tile-l">Records</div><div class="tile-v">${prs.length ? D.trained.filter((w) => w.start >= startOfDay(Date.now()) - 13 * DAY).reduce((n, w) => n + D.wAgg.get(w.id).prs, 0) : 0}</div><div class="tile-d">last 14 days</div></div>
  </div>`;

  // Recent records
  if (prs.length) {
    h += `<section class="sec"><div class="sec-h"><h2>Recent records</h2></div><div class="group">${prs.map((p) => {
      const ex = exById(p.exId);
      return `<button class="row" data-act="go" data-to="ex/${p.exId}"><span class="row-ic gold">${ic('trophy')}</span><div class="row-main"><div class="row-title">${esc(ex ? ex.name : '')}</div><div class="row-sub">${esc(prName(p.flags))}, ${esc(fmt.rel(p.ws))}</div></div><div class="row-val num big">${wLabel(p.w, ex)}<small>${kgUnit(ex)} × ${p.r}</small></div></button>`;
    }).join('')}</div></section>`;
  }

  // Body + recovery
  const lw = D.lastWeight;
  const weekAgo = lw ? [...D.bodyW].reverse().find((b) => b.date <= lw.date - 6 * DAY) : null;
  const bodySpark = D.bodyW.slice(-20).map((b) => b.weight);
  const recWeekMin = sum(S.recovery.filter((r) => r.date >= weekStart(Date.now())).map((r) => r.min || 0));
  const wk = weekStrip().filter((d) => d.rec).length;
  h += `<section class="sec"><div class="sec-h"><h2>Body & recovery</h2></div>
    <div class="panel body-card">
      <button class="bc-main" data-act="tab" data-tab="body">
        <div class="tile-l">Body weight</div>
        <div class="bc-v num">${lw ? fmt.n(lw.weight, 1) : '–'}<small>kg</small></div>
        <div class="tile-d">${lw ? (weekAgo ? `${lw.weight - weekAgo.weight > 0 ? '+' : ''}${fmt.n(round(lw.weight - weekAgo.weight, 1))} kg vs a week before` : `logged ${esc(fmt.rel(lw.date))}`) : 'Not logged yet'}${lw && bmi(lw.weight) ? `, BMI ${fmt.n(round(bmi(lw.weight), 1))}` : ''}</div>
      </button>
      <div class="bc-side">${sparkline(bodySpark, CHALK, 92, 40)}<button class="btn sm" data-act="log-body">${ic('plus')}Log</button></div>
    </div>
    <div class="panel mt12">
      <div class="panel-h"><div class="panel-t">Recovery</div><div class="panel-s">${wk ? `${pl(wk, 'day')} this week, ${fmt.int(recWeekMin)} min` : 'Nothing logged this week'}</div></div>
      <div class="rec-btns">${S.settings.recoveryKinds.map((k) => `<button class="btn rec" data-act="quick-rec" data-kind="${esc(k)}">${ic(recIcon(k))}<span>${esc(k)}</span></button>`).join('')}</div>
    </div></section>`;

  // Last workout
  if (lastDone) h += `<section class="sec"><div class="sec-h"><h2>Last workout</h2><button class="link" data-act="tab" data-tab="history">History</button></div>${workoutCard(lastDone)}</section>`;

  // First-run helper
  if (!isRealData() && !hasDemo()) {
    h += `<section class="sec"><div class="panel intro">
      <div class="panel-t">How it works</div>
      <p>Start the day’s workout, add exercises and log each set with weight, reps and optional effort. Your exercise library grows from what you log, and every record, chart and recovery figure is calculated automatically.</p>
      <p>Want to see the statistics before your first workout? Load 12 weeks of sample training and remove it again with one tap.</p>
      <button class="btn sm mt8" data-act="load-demo">Load demo data</button>
    </div></section>`;
  }
  return h;
}

function recIcon(kind) {
  const k = String(kind).toLowerCase();
  if (k.includes('sauna') || k.includes('steam') || k.includes('heat')) return 'steam';
  if (k.includes('rehab') || k.includes('physio') || k.includes('reha')) return 'pulse';
  return 'leaf';
}

function needsBackupReminder() {
  const real = S.workouts.filter((w) => !w.demo).length;
  if (real < 3) return false;
  const now = Date.now();
  if (S.meta.backupSnooze && now < S.meta.backupSnooze) return false;
  return !S.meta.lastBackup || now - S.meta.lastBackup > 14 * DAY;
}

/* ==========================================================================
   WORKOUT (active or editing a past one)
   ========================================================================== */
function renderWorkout(wid) {
  const w = wById(wid);
  if (!w) return redirect('home');
  const live = w.end == null;
  const color = typeColor(w.type);
  const a = D.wAgg.get(w.id) || { sets: 0, vol: 0, prs: 0, lastT: w.start };
  const lastSetT = Math.max(0, ...w.entries.flatMap((e) => e.sets.map((s) => s.t || 0)));

  let h = `<div class="ctx-wrap" style="${ctxStyle(color)}">`;
  h += `<header class="nb">
    <div class="nb-l">${live
      ? `<button class="nb-back" data-act="minimize" aria-label="Back to Today">${ic('minimize')}<span>Today</span></button>`
      : `<button class="nb-back" data-act="back" data-fallback="w/${w.id}">${ic('left')}<span>Back</span></button>`}</div>
    <div class="nb-title"><button class="type-btn" data-act="change-type" data-wid="${w.id}"><i class="dot" style="background:${color}"></i>${esc(w.type)}${ic('down')}</button></div>
    <div class="nb-r">${live
      ? `<button class="btn sm ctx" data-act="finish" data-wid="${w.id}">Finish</button>`
      : `<button class="btn sm primary" data-act="back" data-fallback="w/${w.id}">Done</button>`}</div>
  </header>`;

  if (live) {
    h += `<section class="wk-top">
      <div class="wk-stats">
        <div><span class="num">${a.sets}</span><label>sets</label></div>
        <div><span class="num">${fmt.int(a.vol)}</span><label>kg moved</label></div>
        <div><span class="num">${a.prs}</span><label>records</label></div>
      </div>
    </section>`;
  } else {
    const durMin = w.end ? Math.round((w.end - w.start) / 60000) : 60;
    h += `<section class="panel mt8">
      <div class="panel-t">Edit workout</div>
      <div class="form-grid2">
        <label class="span2"><span class="label">Date</span><input class="field" type="date" value="${toDateInput(w.start)}" max="${toDateInput(Date.now())}" data-in="w-date" data-wid="${w.id}"></label>
        <label><span class="label">Start</span><input class="field" type="time" value="${toTimeInput(w.start)}" data-in="w-time" data-wid="${w.id}"></label>
        <label><span class="label">Duration (min)</span><input class="field" type="text" inputmode="numeric" value="${durMin}" data-in="w-dur" data-wid="${w.id}"></label>
      </div>
      <div class="kv3 mt12"><div><span class="num">${a.sets}</span><label>sets</label></div><div><span class="num">${fmt.int(a.vol)}</span><label>kg moved</label></div><div><span class="num">${a.prs}</span><label>records</label></div></div>
    </section>`;
  }

  if (!w.entries.length) {
    h += `<div class="empty small">${ic('library')}<h3>No exercises yet</h3><p>Add the exercises you’re doing today. Anything you add but don’t log is dropped when you finish.</p></div>`;
  }
  h += w.entries.map((e) => exCard(w, e)).join('');

  h += `<button class="add-ex" data-act="add-ex" data-wid="${w.id}">${ic('plus')}Add exercise</button>`;
  h += `<button class="btn block mt12" data-act="add-rec" data-wid="${w.id}">${ic('steam')}Log recovery (sauna, rehab …)</button>`;
  h += `<label class="label" for="w-note">Workout note</label><textarea id="w-note" class="field" rows="2" placeholder="How did it feel? Anything to remember next time?" data-in="w-note" data-wid="${w.id}">${esc(w.note || '')}</textarea>`;

  if (live) {
    h += `<button class="btn ctx lg block mt24" data-act="finish" data-wid="${w.id}">${ic('check')}Finish workout</button>`;
    h += `<button class="btn block plain danger mt8" data-act="discard" data-wid="${w.id}">Discard workout</button>`;
  } else {
    h += `<button class="btn block plain danger mt24" data-act="delete-w" data-wid="${w.id}">${ic('trash')}Delete workout</button>`;
  }
  return h + '</div>';
}

function exCard(w, e) {
  const ex = exById(e.exId);
  if (!ex) return '';
  const last = lastSession(e.exId, w);
  const chips = e.sets.map((s, i) => {
    const f = D.pr.get(`${w.id}|${e.id}|${i}`) || 0;
    return `<span class="sp${f ? ' pr' : ''}">${f ? ic('trophy') : ''}${wLabel(s.w, ex)}<small>×</small>${s.r}</span>`;
  }).join('');
  return `<div class="ex-card${e.sets.length ? ' has' : ''}">
    <button class="ex-main" data-act="open-log" data-wid="${w.id}" data-eid="${e.id}">
      <div class="ex-top"><div class="ex-titles"><div class="ex-name">${esc(ex.name)}</div><div class="ex-mus">${esc(ex.muscles.join(', ') || 'No muscle group')}</div></div>
      ${e.sets.length ? `<span class="ex-count">${ic('check')}${e.sets.length}</span>` : ''}</div>
      ${chips ? `<div class="ex-sets">${chips}</div>` : ''}
      <div class="ex-last">${last ? `Last time: ${esc(setSummary(last.recs, ex))}` : 'First time, this session sets your baseline'}</div>
    </button>
    <button class="ib plain ex-more" data-act="entry-menu" data-wid="${w.id}" data-eid="${e.id}" aria-label="Options for ${esc(ex.name)}">${ic('more')}</button>
  </div>`;
}

/* ==========================================================================
   SET LOGGER
   The editor sits at a fixed spot under the "last time" reference so the
   Log button is always in the same place for your thumb.
   ========================================================================== */
function makeDraft(w, e, last, key) {
  const ex = exById(e.exId);
  let pw = null, pr = null;
  if (e.sets.length) { const p = e.sets[e.sets.length - 1]; pw = p.w; pr = p.r; }        // same as previous set today
  else if (last && last.recs.length) { pw = last.recs[0].w; pr = last.recs[0].r; }       // first set of last session
  return { key, bw: !!(ex && ex.bw), w: pw == null ? '' : fmt.n(pw), r: pr == null ? '' : String(pr), rpe: null };
}

function renderLogger(wid, eid) {
  const w = wById(wid);
  if (!w) return redirect('home');
  const e = w.entries.find((x) => x.id === eid);
  if (!e) return redirect('workout/' + wid);
  const ex = exById(e.exId);
  if (!ex) return redirect('workout/' + wid);
  const color = typeColor(w.type);
  const last = lastSession(e.exId, w);
  const key = `${wid}|${eid}|${e.sets.length}`;
  if (!UI.draft || UI.draft.key !== key) UI.draft = makeDraft(w, e, last, key);
  const d = UI.draft;
  const n = e.sets.length + 1;
  const ref = last && last.recs[n - 1];
  const idx = w.entries.findIndex((x) => x.id === eid);
  const next = w.entries[idx + 1];
  const nextEx = next && exById(next.exId);
  const lastSetT = e.sets.length ? e.sets[e.sets.length - 1].t : Math.max(0, ...w.entries.flatMap((x) => x.sets.map((s) => s.t || 0)));
  const sessVol = sum(e.sets.map((s) => Math.max(0, s.w + (ex.bw ? D.bwAt(s.t) : 0)) * s.r));

  let h = `<div class="ctx-wrap" style="${ctxStyle(color)}">`;
  h += `<header class="nb"><div class="nb-l"><button class="nb-back" data-act="back" data-fallback="workout/${wid}">${ic('left')}<span>Workout</span></button></div>
    <div class="nb-title">${w.end == null ? '' : esc(fmt.date(w.start))}</div>
    <div class="nb-r"><button class="ib plain" data-act="log-more" data-wid="${wid}" data-eid="${eid}" aria-label="Exercise options">${ic('more')}</button></div></header>`;
  h += `<div class="lg-head"><div><h1 class="lg-title">${esc(ex.name)}</h1><div class="lg-sub">${esc(ex.muscles.join(', ') || 'No muscle group')}</div></div>
</div>`;
  if (ex.notes) h += `<button class="ex-note" data-act="edit-ex" data-id="${ex.id}">${ic('note')}<span>${esc(ex.notes)}</span></button>`;

  // Last time — tap a set to copy it into the editor
  if (last) {
    const remaining = last.recs.length - e.sets.length;
    h += `<section class="last">
      <div class="last-h"><span>Last time, ${esc(fmt.date(last.date))}</span>${remaining > 0 ? `<button class="link" data-act="repeat-last" data-wid="${wid}" data-eid="${eid}">${ic('copy')}${e.sets.length ? `Log remaining ${remaining}` : `Log all ${last.recs.length}`}</button>` : ''}</div>
      <div class="last-chips">${last.recs.map((r, i) => `<button class="lchip${i === n - 1 ? ' next' : ''}" data-act="copy-set" data-i="${i}" aria-label="Copy ${wLabel(r.w, ex)} by ${r.r}"><b class="num">${wLabel(r.w, ex)}<small>×</small>${r.r}</b>${r.rpe != null ? `<small>${esc(effortLabel(r.rpe))}</small>` : ''}</button>`).join('')}</div>
    </section>`;
  }

  // Editor
  h += `<section class="editor" aria-label="Set ${n}">
    <div class="ed-h"><div class="ed-set num">Set ${n}</div><div class="ed-hint">${ref ? `Last time: ${wLabel(ref.w, ex)}${kgUnit(ex)} × ${ref.r}` : last ? 'More sets than last time' : ''}</div></div>
    <div class="ed-lbl"><span>${ex.bw ? 'Added weight (kg)' : 'Weight (kg)'}</span><span>${ex.bw ? 'negative = assisted' : `step ${fmt.n(S.settings.weightStep)}`}</span></div>
    ${stepperHTML('draft.w', d.w, { label: 'weight', id: 'ed-w' })}
    ${ex.barbell && S.settings.showPlates ? '<div class="plates" id="ed-plates"></div>' : ''}
    <div class="ed-lbl"><span>Reps</span><span id="ed-e1"></span></div>
    ${stepperHTML('draft.r', d.r, { label: 'reps', id: 'ed-r', inputmode: 'numeric' })}
    ${S.settings.effort !== 'off' ? `<div class="ed-lbl"><span>${S.settings.effort === 'rir' ? 'Reps in reserve' : 'RPE'} (optional)</span></div>${effortChips(d.rpe, 'effort')}` : ''}
    <div class="ed-pr" id="ed-pr" aria-live="polite"></div>
    <button class="btn ctx xl block" data-act="log-set" data-wid="${wid}" data-eid="${eid}">${ic('check')}Log set ${n}</button>
  </section>`;

  // Logged today
  if (e.sets.length) {
    h += `<section class="sec"><div class="sec-h"><h2>Logged</h2><span class="sec-a">${e.sets.length} ${e.sets.length === 1 ? 'set' : 'sets'}, ${fmt.kg(sessVol)}</span></div><div class="group">${e.sets.map((s, i) => {
      const f = D.pr.get(`${wid}|${eid}|${i}`) || 0;
      return `<button class="set-row" data-act="edit-set" data-i="${i}" data-set-i="${i}"><span class="set-n num">${i + 1}</span><span class="set-v num">${wLabel(s.w, ex)}<small>${kgUnit(ex)} ×</small> ${s.r}</span><span class="set-e">${esc(effortLabel(s.rpe))}</span>${f ? `<span class="badge-pr">${ic('trophy')}${esc(prName(f))}</span>` : `<span class="set-edit">${ic('edit')}</span>`}</button>`;
    }).join('')}</div></section>`;
  }

  h += nextEx
    ? `<button class="btn block mt24 next-btn" data-act="next-ex" data-wid="${wid}" data-eid="${next.id}"><span>Next: ${esc(nextEx.name)}</span>${ic('right')}</button>`
    : `<button class="btn block mt24 next-btn" data-act="back" data-fallback="workout/${wid}"><span>Back to workout</span>${ic('right')}</button>`;
  return h + '</div>';
}

/** Plates, e1RM and record preview under the editor (no full re-render while typing). */
function updateEditorExtras() {
  const d = UI.draft;
  const r = route();
  if (!d || r.name !== 'log') return;
  const w = wById(r.params[0]);
  const e = w && w.entries.find((x) => x.id === r.params[1]);
  if (!e) return;
  const ex = exById(e.exId);
  const wv = parseNum(d.w), rv = parseNum(d.r);
  const pl = $('#ed-plates');
  if (pl) {
    const bar = S.settings.barWeight;
    if (wv == null) pl.innerHTML = '';
    else {
      const p = platesFor(wv);
      pl.innerHTML = !p ? `<span>Lighter than the ${fmt.n(bar)} kg bar</span>`
        : !p.side.length ? `<span>Empty ${fmt.n(bar)} kg bar</span>`
        : `${plateSVG(p.side)}<span>${p.side.map((x) => fmt.n(x)).join(' + ')} kg per side${p.rest ? `, ${fmt.n(p.rest)} kg can’t be loaded` : ''}</span>`;
    }
  }
  const e1el = $('#ed-e1');
  if (e1el) {
    const load = (wv || 0) + (ex.bw ? D.bwAt(Date.now()) : 0);
    const est = wv != null && rv > 0 ? e1rm(load, rv, d.rpe) : 0;
    e1el.textContent = est > 0 ? `e1RM ≈ ${fmt.n(round(est, 1))} kg` : '';
  }
  const prel = $('#ed-pr');
  if (prel) {
    const f = wouldBePR(e.exId, wv, rv, d.rpe, w);
    prel.innerHTML = f ? `${ic('trophy')}<span>${esc(prNames(f).join(' + '))} if you log this</span>` : '';
    prel.classList.toggle('on', !!f);
  }
}

/* ---------- logging actions ---------- */
function logSet(wid, eid) {
  const d = UI.draft;
  const w = wById(wid);
  const e = w && w.entries.find((x) => x.id === eid);
  if (!d || !e) return;
  const ex = exById(e.exId);
  const wv = parseNum(d.w), rv = parseNum(d.r);
  if (wv == null || !(rv > 0)) {
    toast(wv == null ? 'Enter a weight first (0 for body weight).' : 'Enter the reps first.');
    const f = $(wv == null ? '#ed-w' : '#ed-r');
    if (f) f.focus();
    return;
  }
  if (Math.abs(wv) > 1500 || rv > 500) { toast('That number looks off. Check weight and reps.'); return; }
  const idx = e.sets.length;
  const t = w.end == null ? Date.now() : Math.min(Date.now(), w.end);
  commit((s) => {
    const ee = s.workouts.find((x) => x.id === wid).entries.find((x) => x.id === eid);
    ee.sets.push({ w: wv, r: Math.round(rv), rpe: d.rpe, t });
  });
  const flags = D.pr.get(`${wid}|${eid}|${idx}`);
  const row = document.querySelector(`[data-set-i="${idx}"]`);
  if (flags) {
    buzz([14, 70, 14]);
    toast(`${prNames(flags).join(' + ')}: ${wLabel(wv, ex)}${kgUnit(ex)} × ${Math.round(rv)}`, { kind: 'pr', icon: 'trophy', ms: 4500 });
    if (row) row.classList.add('prglow');
  } else {
    buzz(12);
    if (row) row.classList.add('flash');
  }
}

function copySetToDraft(i) {

  const w = wById(r.params[0]);

  const s = last && last.recs[i];
  if (!s || !UI.draft) return;
  UI.draft.w = fmt.n(s.w);
  UI.draft.r = String(s.r);
  const wi = $('#ed-w'), ri = $('#ed-r');
  if (wi) wi.value = UI.draft.w;
  if (ri) ri.value = UI.draft.r;
  updateEditorExtras();
  $$('.lchip').forEach((b, bi) => b.classList.toggle('copied', bi === i));
  buzz(8);
}

function repeatLast(wid, eid) {
  const w = wById(wid);
  const e = w && w.entries.find((x) => x.id === eid);
  const last = e && lastSession(e.exId, w);
  if (!last) return;
  const add = last.recs.slice(e.sets.length);
  if (!add.length) return;
  const t0 = w.end == null ? Date.now() : Math.min(Date.now(), w.end);
  commit((s) => {
    const ee = s.workouts.find((x) => x.id === wid).entries.find((x) => x.id === eid);
    add.forEach((r, i) => ee.sets.push({ w: r.w, r: r.r, rpe: null, t: t0 + i }));
  }, { undo: `Logged ${add.length} ${add.length === 1 ? 'set' : 'sets'} from last time` });
  buzz(12);
}

/** Guess a muscle group from an exercise name (only a starting suggestion). */
function guessMuscle(name) {
  const n = name.toLowerCase();
  const rules = [
    [/leg curl|hamstring|nordic|romanian|rdl|good ?morning/, 'Hamstrings'],
    [/calf|calves/, 'Calves'],
    [/hip thrust|glute|bridge|kickback/, 'Glutes'],
    [/squat|leg press|leg extension|lunge|split|hack/, 'Quads'],
    [/tricep|pushdown|skull|kickback|close.?grip/, 'Triceps'],
    [/curl/, 'Biceps'],
    [/lateral|overhead|ohp|military|shoulder|delt|face ?pull|rear|arnold|upright/, 'Shoulders'],
    [/bench|chest|fly|flye|pec|push.?up|dip|incline|decline/, 'Chest'],
    [/row|pull|lat|chin|deadlift|shrug|back/, 'Back'],
    [/crunch|plank|ab |abs|core|leg raise|sit.?up|wheel/, 'Core'],
    [/wrist|forearm|grip|farmer/, 'Forearms'],
  ];
  for (const [re, m] of rules) if (re.test(n)) return m;
  return null;
}

/* ==========================================================================
   FINISH SUMMARY (+ weigh-in prompt)
   ========================================================================== */
function renderSummary(wid) {
  const w = wById(wid);
  if (!w) return redirect('home');
  const a = D.wAgg.get(w.id);
  const color = typeColor(w.type);
  let prev = null;
  for (let i = D.trained.length - 1; i >= 0; i--) { const x = D.trained[i]; if (x.type === w.type && x.start < w.start && x.end) { prev = x; break; } }
  const pa = prev && D.wAgg.get(prev.id);
  const volDelta = pa && pa.vol ? ((a.vol - pa.vol) / pa.vol) * 100 : null;
  const prRows = [];
  const seen = new Map();
  for (const rec of a.prList) { const cur = seen.get(rec.exId); if (!cur || rec.e1 > cur.e1) seen.set(rec.exId, rec); }
  for (const rec of seen.values()) { const ex = exById(rec.exId); prRows.push(`<div class="row"><span class="row-ic gold">${ic('trophy')}</span><div class="row-main"><div class="row-title">${esc(ex.name)}</div><div class="row-sub">${esc(prNames(rec.flags).join(', '))}</div></div><div class="row-val num big">${wLabel(rec.w, ex)}<small>${kgUnit(ex)} × ${rec.r}</small></div></div>`); }
  for (const sess of a.volPRs) { if (seen.has(sess.exId)) continue; const ex = exById(sess.exId); prRows.push(`<div class="row"><span class="row-ic gold">${ic('trophy')}</span><div class="row-main"><div class="row-title">${esc(ex.name)}</div><div class="row-sub">Session volume record</div></div><div class="row-val num big">${fmt.int(sess.vol)}<small> kg</small></div></div>`); }

  const today = S.body.find((b) => isToday(b.date) && b.weight != null);
  const needBF = !D.lastBF || Date.now() - D.lastBF.date > 7 * DAY;
  if (!UI.weighIn || UI.weighIn.wid !== wid) UI.weighIn = { wid, w: D.lastWeight ? fmt.n(D.lastWeight.weight, 1) : '', bf: '', saved: false };

  let h = `<div class="ctx-wrap" style="${ctxStyle(color)}">`;
  h += `<section class="sum-hero"><div class="sum-ic">${ic('check')}</div><h1>Workout complete</h1><p>${esc(w.type)}, ${esc(fmt.dur(a.dur))}, finished ${esc(fmt.time(w.end || Date.now()))}</p></section>`;
  h += `<div class="tiles t3">
    <div class="tile"><div class="tile-l">Volume</div><div class="tile-v">${fmt.int(a.vol)}<small>kg</small></div><div class="tile-d">${volDelta != null ? `${deltaHTML(volDelta)}<span>vs last ${esc(w.type)}</span>` : 'first of its kind'}</div></div>
    <div class="tile"><div class="tile-l">Sets</div><div class="tile-v">${a.sets}</div><div class="tile-d">${a.reps} reps</div></div>
    <div class="tile"><div class="tile-l">Records</div><div class="tile-v">${a.prs + a.volPRs.filter((s) => !seen.has(s.exId)).length}</div><div class="tile-d">${a.avgRpe ? `avg ${esc(effortLabel(round(a.avgRpe * 2, 0) / 2))}` : '&nbsp;'}</div></div>
  </div>`;

  // Weigh-in
  if (S.settings.weighInPrompt && !UI.weighIn.skipped && (!today || UI.weighIn.saved)) {
    const wi = UI.weighIn;
    h += wi.saved
      ? `<section class="panel weigh mt16"><div class="panel-t">${ic('check')} Weigh-in saved</div><p class="muted">${esc(wi.savedText || '')}</p></section>`
      : `<section class="panel weigh mt16"><div class="panel-h"><div class="panel-t">Step on the scale?</div><div class="panel-s">${D.lastWeight ? `last ${fmt.n(D.lastWeight.weight, 1)} kg, ${esc(fmt.rel(D.lastWeight.date))}` : 'first weigh-in'}</div></div>
        ${stepperHTML('wi.w', wi.w, { label: 'body weight', id: 'wi-w' })}
        ${needBF ? `<label class="label" for="wi-bf">Estimated body fat % <span class="muted">(optional${D.lastBF ? `, last ${fmt.n(D.lastBF.bf, 1)}%` : ''})</span></label><input id="wi-bf" class="field" inputmode="decimal" placeholder="e.g. 15" value="${esc(wi.bf)}" data-in="wi-bf">` : ''}
        <div class="row-btns mt12"><button class="btn" data-act="wi-skip">Not now</button><button class="btn ctx grow" data-act="wi-save">Save weigh-in</button></div></section>`;
  }
  if (prRows.length) h += `<section class="sec"><div class="sec-h"><h2>New records</h2></div><div class="group">${prRows.join('')}</div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Exercises</h2></div><div class="group">${w.entries.filter((e) => e.sets.length).map((e) => {
    const ex = exById(e.exId);
    const best = (D.sessions.get(e.exId) || []).find((s) => s.wid === w.id);
    return `<div class="row"><div class="row-main"><div class="row-title">${esc(ex.name)}</div><div class="row-sub">${esc(setSummary(e.sets, ex))}</div></div><div class="row-val"><span class="muted small">e1RM</span> <b class="num">${best ? fmt.n(round(best.e1, 1)) : '–'}</b></div></div>`;
  }).join('')}</div></section>`;
  h += `<button class="btn primary lg block mt24" data-act="done-summary">Done</button>`;
  return h + '</div>';
}

    ${f.showM ? `<div class="m-grid">${MEASURES.map(([k, l]) => `<label><span class="label">${l}</span><input class="field" inputmode="decimal" value="${esc(f.m[k] ?? '')}" placeholder="${lastM[k] != null ? fmt.n(lastM[k], 1) : ''}" data-in="bf-m" data-k="${k}"></label>`).join('')}</div>
      <p class="muted small mt8">Waist and neck${S.settings.sex === 'f' ? ' and hips' : ''} plus your height give a tape-measure body-fat estimate.</p>` : ''}
    <label class="label" for="bf-note">Note</label><input id="bf-note" class="field" value="${esc(f.note)}" placeholder="Optional" data-in="bf-note">`;
}

/* ---------- start / finish / discard ---------- */
async function startWorkout(type, opts = {}) {
  const aw = activeWorkout();
  if (aw) {
    const res = await choose({
      title: `${aw.type} workout still running`,
      text: 'Resume it, or close it before starting a new one.',
      options: [
        { label: 'Resume current workout', value: 'resume', cls: 'primary' },
        { label: 'Finish it, then start new', value: 'finish' },
        { label: 'Discard it, then start new', value: 'discard', cls: 'danger' },
        { label: 'Cancel', value: null, cls: 'plain' },
      ],
    });
    if (!res) return;
    if (res === 'resume') { go('workout/' + aw.id); return; }
    if (res === 'finish') {
      if (sum(aw.entries.map((e) => e.sets.length))) commit((s) => finalizeInState(s, aw.id), { render: false });
      else commit((s) => { s.workouts = s.workouts.filter((x) => x.id !== aw.id); s.activeId = null; }, { render: false });
    }
    if (res === 'discard') commit((s) => { s.workouts = s.workouts.filter((x) => x.id !== aw.id); s.activeId = null; }, { render: false });
  }
  const w = { id: uid(), type, start: Date.now(), end: null, note: '', entries: [] };
  const src = opts.fromWid ? wById(opts.fromWid) : S.settings.prefillFromLast ? lastWorkoutOfType(type) : null;
  if (src) {
    const seen = new Set();
    w.entries = src.entries.filter((e) => e.sets.length && exById(e.exId) && !seen.has(e.exId) && seen.add(e.exId)).map((e) => ({ id: uid(), exId: e.exId, sets: [] }));
  }
  UI.draft = null;
  commit((s) => { s.workouts.push(w); s.activeId = w.id; }, { render: false });
  go('workout/' + w.id);
}

function finalizeInState(s, wid) {
  const w = s.workouts.find((x) => x.id === wid);
  if (!w) return;
  w.entries = w.entries.filter((e) => e.sets.length);
  const lastT = Math.max(w.start, ...w.entries.flatMap((e) => e.sets.map((x) => x.t || 0)));
  let end = Date.now();
  if (end - lastT > 2 * 3600e3) end = lastT + 5 * 60e3;     // forgot to press Finish → end after the last set
  w.end = end;
  if (s.activeId === wid) s.activeId = null;
}

async function finishWorkout(wid) {
  const w = wById(wid);
  if (!w) return;
  if (!sum(w.entries.map((e) => e.sets.length))) {
    const ok = await ask({ title: 'No sets logged yet', text: 'Discard this workout?', ok: 'Discard', danger: true });
    if (ok) discardWorkout(wid);
    return;
  }
  commit((s) => finalizeInState(s, wid), { render: false });
  UI.weighIn = null;
  go('summary/' + wid, { replace: true });
}

async function discardWorkout(wid) {
  const w = wById(wid);
  if (!w) return;
  const n = sum(w.entries.map((e) => e.sets.length));
  if (n && !(await ask({ title: 'Discard workout?', text: `${n} logged ${n === 1 ? 'set' : 'sets'} will be deleted.`, ok: 'Discard', danger: true }))) return;
  commit((s) => { s.workouts = s.workouts.filter((x) => x.id !== wid); if (s.activeId === wid) s.activeId = null; }, { render: false, undo: 'Workout discarded' });
  go('home', { replace: true });
}

/* ==========================================================================

const RANGE_OPTS = [[null, 'All time'], [7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 3 months'], [365, 'Last 12 months']];

function historyItems() {
  const f = UI.hist;
  const from = f.range ? startOfDay(Date.now()) - (f.range - 1) * DAY : -Infinity;
  const items = [];
  const wFilters = f.type || f.exId || f.muscle;
  if (f.kind !== 'recovery') {
    for (const w of D.workouts) {
      const a = D.wAgg.get(w.id);
      if (!a.sets && w.id !== S.activeId) continue;
      if (w.start < from) continue;
      if (f.type && w.type !== f.type) continue;
      if (f.exId && !w.entries.some((e) => e.exId === f.exId && e.sets.length)) continue;
      if (f.muscle && !a.primary.has(f.muscle)) continue;
      items.push({ t: w.start, w });
    }
  }
  if (f.kind === 'recovery' || (f.kind === 'all' && !wFilters)) {
    for (const r of S.recovery) if (r.date >= from) items.push({ t: r.date, r });
  }
  return items.sort((a, b) => b.t - a.t);
}

function renderHistory() {
  const f = UI.hist;
  const items = historyItems();
  const ws = items.filter((i) => i.w).map((i) => i.w);
  const tot = { sets: sum(ws.map((w) => D.wAgg.get(w.id).sets)), vol: sum(ws.map((w) => D.wAgg.get(w.id).vol)) };
  const ex = f.exId ? exById(f.exId) : null;
  let h = largeTitle('History', '', `<button class="ib" data-act="history-add" aria-label="Add past workout or recovery">${ic('plus')}</button>`);
  h += seg('hist.kind', [['all', 'All'], ['workouts', 'Workouts'], ['recovery', 'Recovery']], f.kind);
  h += `<div class="chips mt12 filters">
    <button class="chip${f.range ? ' on' : ''}" data-act="hf-range">${ic('calendar')}${esc((RANGE_OPTS.find((o) => o[0] === f.range) || RANGE_OPTS[0])[1])}${ic('down')}</button>
    ${f.kind !== 'recovery' ? `<button class="chip${f.type ? ' on' : ''}" data-act="hf-type">${esc(f.type || 'Day type')}${ic('down')}</button>
    <button class="chip${f.exId ? ' on' : ''}" data-act="hf-ex">${esc(ex ? ex.name : 'Exercise')}${ic('down')}</button>
    <button class="chip${f.muscle ? ' on' : ''}" data-act="hf-muscle">${esc(f.muscle || 'Muscle group')}${ic('down')}</button>` : ''}
    ${f.range || f.type || f.exId || f.muscle ? `<button class="chip ghost" data-act="hf-clear">${ic('x')}Clear</button>` : ''}
  </div>`;
  if (ws.length && ex) {
    // exercise filter: totals for that exercise only
    const sess = (D.sessions.get(ex.id) || []).filter((s) => ws.some((w) => w.id === s.wid));
    h += `<p class="hist-sum">${esc(ex.name)}: ${pl(sess.length, 'session')}, ${pl(sum(sess.map((s) => s.recs.length)), 'set')}, ${fmt.t(sum(sess.map((s) => s.vol)))} moved</p>`;
  } else if (ws.length) h += `<p class="hist-sum">${pl(ws.length, 'workout')}, ${pl(tot.sets, 'set')}, ${fmt.t(tot.vol)} moved</p>`;

  if (!items.length) {
    const anyData = D.workouts.length || S.recovery.length;
    return h + (anyData ? emptyState('search', 'Nothing matches these filters', 'Try a longer time range or clear the filters.', `<button class="btn mt16" data-act="hf-clear">Clear filters</button>`)
      : emptyState('history', 'No workouts yet', 'Finished workouts and recovery sessions show up here.', `<button class="btn primary mt16" data-act="tab" data-tab="home">Go to Today</button>`));
  }
  let lastMonth = '';
  for (const it of items.slice(0, f.limit)) {
    const mk = monthKey(it.t);
    if (mk !== lastMonth) { h += `<h3 class="month-h">${esc(fmt.month(it.t))}</h3>`; lastMonth = mk; }
    h += it.w ? workoutCard(it.w, { exFilter: f.exId }) : recoveryCard(it.r);
  }
  if (items.length > f.limit) h += `<button class="btn block mt16" data-act="hist-more">Show more (${items.length - f.limit})</button>`;
  return h;
}

function workoutCard(w, { exFilter } = {}) {
  const a = D.wAgg.get(w.id);
  const live = w.end == null;
  const entries = w.entries.filter((e) => e.sets.length && (!exFilter || e.exId === exFilter));
  const lines = entries.slice(0, exFilter ? 3 : 4).map((e) => {
    const ex = exById(e.exId);
    const prs = e.sets.filter((_, i) => D.pr.get(`${w.id}|${e.id}|${i}`)).length;
    return `<div class="hc-line"><b>${esc(ex ? ex.name : '?')}</b><span>${esc(setSummary(e.sets, ex))}</span>${prs ? `<i class="gold-i">${ic('trophy')}</i>` : ''}</div>`;
  }).join('');
  const more = exFilter ? 0 : w.entries.filter((e) => e.sets.length).length - 4;
  return `<button class="hcard" data-act="${live ? 'resume' : 'open-w'}" data-id="${w.id}">
    <div class="hc-top">${typePill(w.type)}<span class="hc-date">${esc(fmt.date(w.start))}</span>${live ? '<span class="live">Live</span>' : ''}<span class="hc-time">${esc(fmt.time(w.start))}</span></div>
    <div class="hc-meta">
      ${live ? '' : `<div><span class="num">${esc(fmt.dur(a.dur))}</span><label>time</label></div>`}
      <div><span class="num">${fmt.int(a.vol)}</span><label>kg</label></div>
      <div><span class="num">${a.sets}</span><label>sets</label></div>
      ${a.prs ? `<div class="gold"><span class="num">${a.prs}</span><label>${a.prs === 1 ? 'record' : 'records'}</label></div>` : ''}
    </div>
    ${lines ? `<div class="hc-ex">${lines}${more > 0 ? `<div class="hc-more">and ${more} more</div>` : ''}</div>` : ''}
  </button>`;
}

function recoveryCard(r) {
  return `<button class="hcard rec" data-act="edit-rec" data-id="${r.id}">
    <div class="hc-top"><span class="pill rec">${ic(recIcon(r.kind))}${esc(r.kind)}</span><span class="hc-date">${esc(fmt.date(r.date))}</span><span class="hc-time">${esc(fmt.time(r.date))}</span></div>

/** Generic single-choice sheet. options: [{ v, label, sub?, color? }] */

function renderProgress() {
  let h = largeTitle('Progress');
  h += seg('prog', [['overview', 'Overview'], ['exercise', 'Exercise'], ['recovery', 'Recovery'], ['calendar', 'Calendar']], UI.prog);
  if (!D.trained.length && UI.prog !== 'recovery') {

  }
  if (UI.prog === 'exercise') return h + progExercise();
  if (UI.prog === 'recovery') return h + progRecovery();
  if (UI.prog === 'calendar') return h + progCalendar();
  return h + progOverview();
}

const tonnes = (v) => `${fmt.n(round(v / 1000, v >= 100000 ? 0 : 1))}t`;
function typeStacks(dataArr, key = 'byType') {
  const present = new Set();
  for (const d of dataArr) for (const t of Object.keys(d[key])) if (d[key][t] > 0) present.add(t);
  const order = S.settings.dayTypes.map((t) => t.name).filter((t) => present.has(t));
  for (const t of present) if (!order.includes(t)) order.push(t);
  const main = order.slice(0, 6), other = order.slice(6);
  const stacks = main.map((t) => ({ name: t, color: typeColor(t), vals: dataArr.map((d) => d[key][t] || 0) }));
  if (other.length) stacks.push({ name: 'Other', color: '#8E8E93', vals: dataArr.map((d) => sum(other.map((t) => d[key][t] || 0))) });
  return stacks;
}

function progOverview() {
  const ws = weeklySeries(12), ms = monthlySeries(12), years = yearlyTotals();
  const thisW = ws.data[11], lastW = ws.data[10], thisM = ms.data[11], lastM = ms.data[10];
  const yearNow = years.find(([y]) => y === new Date().getFullYear());
  let h = strengthPanel() + `<div class="tiles mt16">
    <div class="tile"><div class="tile-l">This week</div><div class="tile-v">${fmt.t(thisW.vol).replace(' t', '')}<small>t</small></div><div class="tile-d">last week ${fmt.t(lastW.vol)}</div></div>
    <div class="tile"><div class="tile-l">This month</div><div class="tile-v">${fmt.t(thisM.vol).replace(' t', '')}<small>t</small></div><div class="tile-d">last month ${fmt.t(lastM.vol)}</div></div>
    <div class="tile"><div class="tile-l">${new Date().getFullYear()} so far</div><div class="tile-v">${yearNow ? fmt.t(yearNow[1].vol).replace(' t', '') : 0}<small>t</small></div><div class="tile-d">${pl(yearNow ? yearNow[1].n : 0, 'workout')}</div></div>
    <div class="tile"><div class="tile-l">Workouts this month</div><div class="tile-v">${thisM.n}</div><div class="tile-d">${pl(thisM.days.size, 'training day')}</div></div>
  </div>`;

  const stacks = typeStacks(ws.data);
  h += `<section class="panel mt16"><div class="panel-h"><div class="panel-t">Weekly volume</div><div class="panel-s">kg moved, last 12 weeks</div></div>
    ${chart({ type: 'bar', height: 170, label: 'Weekly volume by training day', labels: ws.weeks.map((w) => fmt.dayMonth(w)), stacks, yFmt: tonnes, totalFmt: (v) => fmt.kg(v), tipTitle: (i) => `Week of ${fmt.dayMonth(ws.weeks[i])}`, markLast: true })}
    ${stacks.length > 1 ? legend(stacks) : ''}</section>`;

  h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">Monthly volume</div><div class="panel-s">last 12 months</div></div>
    ${chart({ type: 'bar', height: 150, label: 'Monthly volume', labels: ms.months.map((m) => fmt.monthS(m)), stacks: [{ name: 'Volume', color: '#E5E5EA', vals: ms.data.map((d) => d.vol) }], yFmt: tonnes, totalFmt: (v) => fmt.t(v), tipTitle: (i) => fmt.month(ms.months[i]), markLast: true })}
    <div class="year-rows">${years.map(([y, v]) => `<div class="yr"><span class="yr-y">${y}</span><span class="num">${fmt.t(v.vol)}</span><span class="muted">${pl(v.n, 'workout')}, ${pl(v.days.size, 'day')}</span></div>`).join('')}</div></section>`;

  // Average session per training day
  const bt = byDayType(UI.typeRange === 'all' || UI.typeRange == null ? null : +UI.typeRange);
  const maxVol = Math.max(1, ...bt.map((b) => b.avgVol));
  h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">Average session by day</div></div>
    ${seg('typeRange', [[90, 'Last 90 days'], [365, '12 months'], ['all', 'All time']], UI.typeRange ?? 'all')}
    <div class="bt mt12">${bt.length ? bt.map((b) => `<div class="bt-row">
      <div class="bt-top">${typePill(b.type)}<span class="num bt-v">${fmt.int(b.avgVol)}<small> kg</small></span></div>
      <div class="hb-track"><div class="hb-fill" style="width:${(b.avgVol / maxVol) * 100}%;background:${typeColor(b.type)}"></div></div>
      <div class="bt-meta"><span><b>${b.n}</b> ${b.n === 1 ? 'session' : 'sessions'}</span><span><b>${fmt.n(round(b.avgSets, 1))}</b> sets</span><span><b>${fmt.n(round(b.avgEx, 1))}</b> exercises</span><span><b>${b.avgDur ? fmt.dur(b.avgDur) : '–'}</b></span>${b.avgRpe ? `<span><b>${esc(effortLabel(round(b.avgRpe * 2, 0) / 2))}</b></span>` : ''}</div>
    </div>`).join('') : '<p class="muted">No workouts in this range.</p>'}</div></section>`;

  // Sets per muscle group
  const spm = setsPerMuscle();
  const maxS = Math.max(1, ...spm.map((x) => x.perWeek));
  h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">Weekly sets per muscle</div><div class="panel-s">avg of last 4 weeks</div></div>
    ${spm.length ? spm.map((x) => `<div class="hb"><span class="hb-l">${esc(x.m)}</span><div class="hb-track"><div class="hb-fill" style="width:${(x.perWeek / maxS) * 100}%"></div></div><span class="hb-v num">${fmt.n(round(x.perWeek, 1))}</span></div>`).join('') : '<p class="muted">No sets in the last 4 weeks.</p>'}
    <p class="muted small mt8">Primary muscle counts as one set, secondary muscles as half a set.</p></section>`;

  // Strength
  const tops = topLifts(6), b3 = big3();
  if (tops.length) {

    <div class="tile"><div class="tile-l">Time trained</div><div class="tile-v">${fmt.n(round(at.time / 3600000, 0))}<small>h</small></div><div class="tile-d">avg ${at.avgDur ? esc(fmt.dur(at.avgDur)) : '–'} per session</div></div>
    <div class="tile"><div class="tile-l">Sets per workout</div><div class="tile-v">${at.avgSets ? fmt.n(round(at.avgSets, 1)) : '–'}</div><div class="tile-d">${at.avgRpe ? `avg ${esc(effortLabel(round(at.avgRpe * 2, 0) / 2))}` : 'effort not logged'}</div></div>
    <div class="tile"><div class="tile-l">Most trained</div><div class="tile-v sm">${at.favEx ? esc(at.favEx.ex.name) : '–'}</div><div class="tile-d">${at.favEx ? pl(at.favEx.n, 'session') : ''}</div></div>
    <div class="tile"><div class="tile-l">Favourite day</div><div class="tile-v sm">${at.favDay || '–'}</div><div class="tile-d">most workouts</div></div>
  </div></section>`;
  return h;
}

/** First chart on Progress: strength change per training day, one line each. */

/** Shared by Progress → Exercise and the exercise detail screen. */
function exerciseBody(exId) {
  const ex = exById(exId);
  const st = D.best.get(exId);
  const sess = D.sessions.get(exId) || [];
  if (!sess.length || !st) return emptyState('progress', 'Not logged yet', `Log ${esc(ex.name)} in a workout to see its progress here.`);
  const trend = e1Trend(exId);
  const last = sess[sess.length - 1];
  const bestSet = st.bestSet;
  let h = `<div class="tiles mt16">
    <div class="tile"><div class="tile-l">Best e1RM</div><div class="tile-v">${fmt.n(round(st.maxE1, 1))}<small>kg</small></div><div class="tile-d">${bestSet ? `${wLabel(bestSet.w, ex)}${kgUnit(ex)} × ${bestSet.r}` : ''}</div></div>
    <div class="tile"><div class="tile-l">Heaviest</div><div class="tile-v">${wLabel(st.maxW, ex)}<small>${ex.bw ? '' : 'kg'}</small></div><div class="tile-d">${esc(fmt.dateY(st.maxWDate))}</div></div>
    <div class="tile"><div class="tile-l">8-week trend</div><div class="tile-v sm">${trend == null ? '–' : deltaHTML(trend)}</div><div class="tile-d">${trend == null ? 'needs 3+ sessions' : 'e1RM, fitted line'}</div></div>

    <div class="chips mt8">${[[90, '3M'], [180, '6M'], [365, '1Y'], ['all', 'All']].map(([v, l]) => `<button class="chip sm${String(UI.exRange ?? 'all') === String(v) ? ' on' : ''}" data-act="seg" data-seg="exRange" data-v="${v}">${l}</button>`).join('')}</div>`;

  } else {
    const isE1 = UI.exMetric !== 'top';
    const series = [{ name: isE1 ? 'Est. 1RM' : 'Top weight', color: CHALK, glow: true, area: true, dots: pts.length < 30 ? 'all' : 'last', pts: pts.map((p) => ({ x: p.x, y: isE1 ? p.e1 : p.top, mark: p.s.recs.some((r) => r.flags), note: setSummary(p.s.recs, ex) })) }];
    h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">${isE1 ? 'Estimated 1RM' : 'Top set weight'}</div><div class="panel-s">${isE1 ? 'best set per session' : 'heaviest set per session'}, kg</div></div>
      ${chart({ type: 'line', height: 190, label: `${ex.name} ${isE1 ? 'e1RM' : 'top weight'} over time`, series, yFmt: (v) => fmt.n(round(v, 1)), empty: 'No sessions in this range' })}

  }

  // Rep records
  const rr = repRecords(exId, 8);
  h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">Best reps by weight</div><div class="panel-s">rep records</div></div>
    <div class="rr">${rr.map((r) => `<div class="rr-row"><span class="num rr-w">${wLabel(r.w, ex)}<small>${kgUnit(ex)}</small></span><span class="num rr-r">${r.r}<small> reps</small></span><span class="muted small">${esc(fmt.dateY(r.date))}</span></div>`).join('')}</div></section>`;

  // Sessions
  h += `<section class="sec"><div class="sec-h"><h2>Sessions</h2></div><div class="group">${sess.slice(-12).reverse().map((s) => {
    const prs = s.recs.filter((r) => r.flags).length;

  }).join('')}</div></section>`;
  return h;
}

function progCalendar() {
  const st = streakInfo();
  let h = `<div class="tiles mt16">
    <div class="tile"><div class="tile-l">Week streak</div><div class="tile-v">${st.current}</div><div class="tile-d">${ic('flame')}weeks with ${st.goal}+ workouts</div></div>
    <div class="tile"><div class="tile-l">Longest streak</div><div class="tile-v">${st.longest}</div><div class="tile-d">weeks</div></div>
    <div class="tile"><div class="tile-l">This week</div><div class="tile-v">${st.thisWeek}<small>/${st.goal}</small></div><div class="tile-d">workouts</div></div>
    <div class="tile"><div class="tile-l">Goal hit</div><div class="tile-v">${st.hitRate == null ? '–' : Math.round(st.hitRate * 100)}<small>${st.hitRate == null ? '' : '%'}</small></div><div class="tile-d">of the last 12 weeks</div></div>
  </div>`;

  // Heatmap: last 53 weeks, volume per day (gold = more)
  const cur = weekStart(Date.now());
  const start = addDays(cur, -52 * 7);
  const today = dayKey(Date.now());
  const vols = [];
  for (const [k, dd] of D.days) if (dd.sets && keyToTs(k) >= start) vols.push(dd.vol);
  vols.sort((a, b) => a - b);
  const q = (p) => vols.length ? vols[Math.min(vols.length - 1, Math.floor(p * vols.length))] : 0;
  const t1 = q(0.25), t2 = q(0.5), t3 = q(0.75);
  let cells = '', prevMonth = -1, trained = 0;
  for (let c = 0; c < 53; c++) {
    const ws = addDays(start, c * 7);
    const m = new Date(addDays(ws, 6)).getMonth();
    cells += `<span class="hm">${m !== prevMonth ? esc(fmt.monthS(addDays(ws, 6))) : ''}</span>`;
    prevMonth = m;
    for (let d = 0; d < 7; d++) {
      const ts = addDays(ws, d), k = dayKey(ts), dd = D.days.get(k);
      if (k > today) { cells += '<span class="hc future"></span>'; continue; }
      let lvl = 0;
      if (dd && dd.sets) { trained++; lvl = dd.vol <= t1 ? 1 : dd.vol <= t2 ? 2 : dd.vol <= t3 ? 3 : 4; }
      const rec = dd && dd.rec.length;
      const title = `${fmt.date(ts)}: ${dd && dd.sets ? `${dd.types.join(' + ')}, ${fmt.kg(dd.vol)}` : 'rest'}${rec ? `, ${dd.rec.map((r) => r.kind).join(' + ')}` : ''}`;
      cells += `<span class="hc l${lvl}${rec ? ' rec' : ''}${k === today ? ' today' : ''}" title="${esc(title)}" data-act="cal-day" data-k="${k}"></span>`;
    }
  }
  h += `<section class="panel mt16"><div class="panel-h"><div class="panel-t">Training heatmap</div><div class="panel-s">${trained} days in 12 months</div></div>
    <div class="heat-wrap" id="heat-wrap"><div class="heat">${cells}</div></div>
    <div class="heat-legend"><span>Less</span>${HEAT.map((c) => `<i style="background:${c}"></i>`).join('')}<span>More volume</span><i class="rec-key"></i><span>Recovery</span></div></section>`;

  // Month calendar with day types
  const ms = UI.calMonth;
  const first = new Date(ms), offset = (first.getDay() + 6) % 7;
  const daysIn = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let grid = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d) => `<span class="cal-h">${d}</span>`).join('');
  for (let i = 0; i < offset; i++) grid += '<span class="cal-d blank"></span>';
  let mTrain = 0, mVol = 0;
  for (let d = 1; d <= daysIn; d++) {
    const ts = new Date(first.getFullYear(), first.getMonth(), d).getTime(), k = dayKey(ts), dd = D.days.get(k);
    const t = dd && dd.sets ? dd.types[0] : null;
    if (t) { mTrain++; mVol += dd.vol; }
    grid += `<button class="cal-d${t ? ' done' : ''}${k === today ? ' today' : ''}${k > today ? ' fut' : ''}" style="${t ? `--dc:${typeColor(t)}` : ''}" data-act="cal-day" data-k="${k}" ${!dd ? 'disabled' : ''} aria-label="${esc(fmt.date(ts))}${t ? ', ' + esc(dd.types.join(' + ')) : ''}">
      <span>${d}</span>${t ? `<span class="ct">${esc(dd.types.length > 1 ? dd.types.length + '×' : t.slice(0, 4))}</span>` : ''}${dd && dd.rec.length ? '<i class="cal-r"></i>' : ''}</button>`;
  }
  h += `<section class="panel mt12"><div class="cal-nav"><button class="ib" data-act="cal-month" data-d="-1" aria-label="Previous month">${ic('left')}</button><div><div class="panel-t">${esc(fmt.month(ms))}</div><div class="panel-s">${pl(mTrain, 'training day')}, ${fmt.t(mVol)}</div></div><button class="ib" data-act="cal-month" data-d="1" aria-label="Next month" ${addMonths(ms, 1) > Date.now() ? 'disabled' : ''}>${ic('right')}</button></div>
    <div class="cal">${grid}</div>${legend(S.settings.dayTypes.filter((t) => D.trained.some((w) => w.type === t.name)).map((t) => ({ name: t.name, color: t.color })))}</section>`;

  // Best weeks / months
  const bp = bestPeriods();
  h += `<section class="sec"><div class="sec-h"><h2>Best weeks</h2></div><div class="group">${bp.weeks.map((w, i) => `<div class="row"><span class="rank num">${i + 1}</span><div class="row-main"><div class="row-title">Week of ${esc(fmt.dateY(w.ts))}</div><div class="row-sub">${pl(w.n, 'workout')}, ${pl(w.sets, 'set')}</div></div><div class="row-val num big">${fmt.t(w.vol)}</div></div>`).join('')}</div></section>
    <section class="sec"><div class="sec-h"><h2>Best months</h2></div><div class="group">${bp.months.map((m, i) => `<div class="row"><span class="rank num">${i + 1}</span><div class="row-main"><div class="row-title">${esc(fmt.month(m.ts))}</div><div class="row-sub">${pl(m.n, 'workout')} on ${pl(m.days.size, 'day')}</div></div><div class="row-val num big">${fmt.t(m.vol)}</div></div>`).join('')}</div></section>`;
  return h;
}

function movingAvg(points, days = 7) {
  return points.map((p) => {
    const win = points.filter((q) => q.x <= p.x && q.x > p.x - days * DAY);
    return { x: p.x, y: avg(win.map((q) => q.y)) };
  });
}

function renderBody() {
  let h = largeTitle('Body', '', `<button class="ib" data-act="log-body" aria-label="Log body weight">${ic('plus')}</button>`);
  const all = D.bodyAll;
  if (!all.length) {
    return h + emptyState('scale', 'Track weight & measurements', 'Log your body weight, an estimated body-fat percentage and tape measurements. BMI is calculated from your height.', `<button class="btn primary mt16" data-act="log-body">${ic('plus')}Log body weight</button>${!S.settings.heightCm ? '<button class="btn mt8" data-act="set-height">Set height for BMI</button>' : ''}`);
  }
  const lw = D.lastWeight, lb = D.lastBF;
  const days = UI.bodyRange === 'all' ? null : +UI.bodyRange;
  const from = days ? startOfDay(Date.now()) - (days - 1) * DAY : -Infinity;
  const wpts = D.bodyW.filter((b) => b.date >= from).map((b) => ({ x: b.date, y: b.weight }));
  const ref = lw ? [...D.bodyW].reverse().find((b) => b.date <= lw.date - 27 * DAY) : null;
  const curBmi = lw ? bmi(lw.weight) : null;
  const lean = lw && lb ? lw.weight * (1 - lb.bf / 100) : null;
  const ffmi = lean && S.settings.heightCm ? lean / (S.settings.heightCm / 100) ** 2 + 6.1 * (1.8 - S.settings.heightCm / 100) : null;

  h += `<div class="tiles">

    <div class="tile"><div class="tile-l">BMI</div><div class="tile-v">${curBmi ? fmt.n(round(curBmi, 1)) : '–'}</div><div class="tile-d">${S.settings.heightCm ? `height ${fmt.n(S.settings.heightCm)} cm` : '<button class="link" data-act="set-height">Set height</button>'}</div></div>

    { name: '7-day average', color: CHALK, pts: movingAvg(wpts), glow: true, dots: 'last' },

  // BMI next to it (own chart — one axis per chart)
  if (S.settings.heightCm) {
    const bpts = wpts.map((p) => ({ x: p.x, y: bmi(p.y) }));
    h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">BMI</div><div class="panel-s">from weight and ${fmt.n(S.settings.heightCm)} cm</div></div>
      ${chart({ type: 'line', height: 120, label: 'BMI over time', series: [{ name: 'BMI', color: '#64D2FF', pts: movingAvg(bpts), dots: 'last' }], yFmt: (v) => fmt.n(round(v, 1)), empty: 'No weigh-ins in this range' })}
      <p class="muted small mt8">BMI doesn’t distinguish muscle from fat, so read it next to body fat.</p></section>`;
  } else {
    h += `<section class="panel mt12"><div class="panel-t">BMI</div><p class="muted">Add your height to see BMI next to your weight.</p><button class="btn sm mt8" data-act="set-height">Set height</button></section>`;

    h += `<section class="panel mt12"><div class="panel-h"><div class="panel-t">Body fat (estimated)</div><div class="panel-s">%</div></div>${chart({ type: 'line', height: 130, label: 'Body fat over time', series: [{ name: 'Body fat', color: '#FF9F0A', pts: bfp, dots: 'all' }], yFmt: (v) => fmt.n(round(v, 1)) })}</section>`;

  // Measurements
  const mLatest = {}, mFirst = {};
  for (const b of all) for (const [k, v] of Object.entries(b.m || {})) { const n = parseNum(v); if (n == null) continue; if (!(k in mFirst)) mFirst[k] = { v: n, date: b.date }; mLatest[k] = { v: n, date: b.date }; }
  const keys = MEASURES.filter(([k]) => mLatest[k]);
  if (keys.length) {

    const mp = all.filter((b) => b.m && parseNum(b.m[UI.measure]) != null && b.date >= from).map((b) => ({ x: b.date, y: parseNum(b.m[UI.measure]) }));

function libraryList() {
  const q = UI.lib.q.trim().toLowerCase();
  const list = S.exercises.filter((e) => (!q || e.name.toLowerCase().includes(q)) && (!UI.lib.muscle || e.muscles.includes(UI.lib.muscle)));
  const active = list.filter((e) => !e.archived), archived = list.filter((e) => e.archived);
  if (!list.length) return `<div class="empty small">${ic('search')}<h3>No exercise found</h3><p>${q ? `Create “${esc(UI.lib.q.trim())}” as a new exercise.` : 'Nothing in this muscle group yet.'}</p>${q ? `<button class="btn primary mt12" data-act="new-ex" data-name="${esc(UI.lib.q.trim())}">${ic('plus')}Create exercise</button>` : ''}</div>`;
  const groups = new Map();
  for (const e of active.sort((a, b) => a.name.localeCompare(b.name))) {
    const m = primaryMuscle(e);
    if (!groups.has(m)) groups.set(m, []);
    groups.get(m).push(e);
  }
  const order = [...S.settings.muscles, 'Unassigned'];
  const row = (e) => {
    const sess = D.sessions.get(e.id) || [];
    const st = D.best.get(e.id);
    return `<button class="row" data-act="go" data-to="ex/${e.id}"><div class="row-main"><div class="row-title">${esc(e.name)}</div><div class="row-sub">${sess.length ? `${sess.length} ${sess.length === 1 ? 'session' : 'sessions'}, last ${esc(fmt.rel(sess[sess.length - 1].date))}` : 'Not logged yet'}</div></div>${st && st.maxE1 ? `<div class="row-val"><span class="muted small">e1RM </span><b class="num">${fmt.n(round(st.maxE1, 0))}</b></div>` : ''}<span class="chev">${ic('right')}</span></button>`;
  };
  let h = '';
  for (const m of [...groups.keys()].sort((a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)))) {
    h += `<div class="list-h">${esc(m)}</div><div class="group">${groups.get(m).map(row).join('')}</div>`;
  }
  if (archived.length) {
    h += `<button class="disclosure mt24" data-act="lib-archived" aria-expanded="${UI.lib.archived}">${ic(UI.lib.archived ? 'down' : 'right')}Archived (${archived.length})</button>`;
    if (UI.lib.archived) h += `<div class="group mt8">${archived.map(row).join('')}</div>`;
  }
  return h;
}

/* ==========================================================================
   08 · IMPORT / EXPORT / DEMO DATA
   JSON = complete backup (restore everything). CSV = one row per set (or per
   body entry / recovery session) for spreadsheets; "Excel (DE)" uses ; and
   decimal commas. CSV import is tolerant of other apps' column names.
   ========================================================================== */

function downloadText(name, text, mime) {
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (e) {
    console.error(e);
    toast('Download failed in this browser.', { kind: 'error' });
    return false;
  }
}
function canShareFiles() {
  try {
    return !!(navigator.canShare && window.matchMedia('(pointer: coarse)').matches && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] }));
  } catch (_) { return false; }
}
async function shareText(name, text, mime) {
  try {
    const file = new File([text], name, { type: mime });
    await navigator.share({ files: [file], title: name });
    return true;
  } catch (e) {
    if (e && e.name === 'AbortError') return null;
    return false;
  }
}

function backupText() {

          <button class="row" data-act="backup-download"><span class="row-ic">${ic('download')}</span><div class="row-main"><div class="row-title">Download</div><div class="row-sub">${esc(name)}</div></div></button>

/* ---------- CSV ---------- */
function csvCell(v, delim, decComma) {
  if (v == null || (typeof v === 'number' && !Number.isFinite(v))) return '';
  let s;
  if (typeof v === 'number') s = decComma ? String(v).replace('.', ',') : String(v);
  else {
    s = String(v);
    if (/^[=+\-@\t]/.test(s)) s = "'" + s;                  // keep spreadsheets from running formulas
  }
  if (s.includes('"') || s.includes(delim) || /[\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function toCSV(rows, excel) {
  const delim = excel ? ';' : ',';
  return (excel ? '\ufeff' : '') + rows.map((r) => r.map((c) => csvCell(c, delim, excel)).join(delim)).join('\r\n');
}
const isoDate = (ts) => dayKey(ts);
const isoTime = (ts) => toTimeInput(ts);

function setsRows() {
  const rows = [['date', 'time', 'workout_type', 'workout_id', 'duration_min', 'exercise', 'primary_muscle', 'muscles', 'set', 'weight_kg', 'reps', 'rpe', 'rir', 'e1rm_kg', 'volume_kg', 'record', 'workout_note']];
  for (const w of D.workouts) {
    const a = D.wAgg.get(w.id);
    for (const e of w.entries) {
      const ex = exById(e.exId);
      if (!ex) continue;
      const recs = (D.sets.get(e.exId) || []).filter((r) => r.wid === w.id && r.eid === e.id);
      e.sets.forEach((s, i) => {
        const rec = recs.find((r) => r.i === i);
        rows.push([isoDate(w.start), isoTime(w.start), w.type, w.id, w.end ? Math.round(a.dur / 60000) : null, ex.name, primaryMuscle(ex), ex.muscles.join(' | '), i + 1, s.w, s.r,
          s.rpe, s.rpe != null ? round(10 - s.rpe, 1) : null, rec ? round(rec.e1, 1) : null, rec ? round(rec.vol, 1) : null, rec && rec.flags ? prNames(rec.flags).join(' + ') : '', w.note || '']);
      });
    }
  }
  return rows;
