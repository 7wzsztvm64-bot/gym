/* ---------- import ---------- */
async function handleImport(text, filename = '') {
  const t = String(text || '').replace(/^\ufeff/, '').trim();
  if (!t) { toast('The file is empty.', { kind: 'error' }); return; }
  if (t[0] === '{' || t[0] === '[' || /\.json$/i.test(filename)) {
    let obj;
    try { obj = JSON.parse(t); } catch (e) { toast('This JSON file can’t be read.', { kind: 'error' }); return; }
    return importJSON(obj);
  }
  return importCSV(t);
}

async function importJSON(obj) {
  const data = obj && obj.data && typeof obj.data === 'object' ? obj.data : obj;
  if (!data || !(Array.isArray(data.workouts) || Array.isArray(data.exercises) || Array.isArray(data.body))) {
    toast('This file isn’t a Gym Tracker backup.', { kind: 'error' });
    return;
  }
  let inc;
  try { inc = migrate(JSON.parse(JSON.stringify(data))); } catch (e) { toast('The backup is damaged and can’t be imported.', { kind: 'error' }); return; }
  const summary = `${inc.workouts.length} workouts, ${inc.exercises.length} exercises, ${inc.body.length} body entries, ${inc.recovery.length} recovery sessions${obj.exportedAt ? `, exported ${fmt.dateY(Date.parse(obj.exportedAt))}` : ''}.`;
  const empty = !S.workouts.length && !S.body.length && !S.recovery.length;
  const res = await choose({
    title: 'Import backup',
    text: summary,
    options: empty
      ? [{ label: 'Restore this backup', value: 'replace', cls: 'primary' }, { label: 'Cancel', value: null, cls: 'plain' }]
      : [{ label: 'Merge with my data', value: 'merge', cls: 'primary' }, { label: 'Replace all my data', value: 'replace', cls: 'danger' }, { label: 'Cancel', value: null, cls: 'plain' }],
  });
  if (!res) return;
  await Sheets.closeAll();
  if (res === 'replace') {
    commit(() => { S = inc; }, { undo: 'Data replaced from backup' });
  } else {
    let r;
    commit((s) => { r = mergeInto(s, inc); }, { undo: 'Backup merged' });
    if (r) toast(`Added ${r.w} workouts, ${r.b} body entries, ${r.r} recovery sessions`);
  }
  goTab('home');
}

function mergeInto(s, inc) {
  const byName = new Map(s.exercises.map((e) => [e.name.toLowerCase(), e]));
  const ids = new Set(s.exercises.map((e) => e.id));
  const remap = new Map();
  for (const e of inc.exercises) {
    if (ids.has(e.id)) { remap.set(e.id, e.id); continue; }
    const same = byName.get(e.name.toLowerCase());
    if (same) { remap.set(e.id, same.id); continue; }
    s.exercises.push(e); ids.add(e.id); byName.set(e.name.toLowerCase(), e); remap.set(e.id, e.id);
  }
  const wIds = new Set(s.workouts.map((w) => w.id));
  const sig = new Set(s.workouts.map((w) => `${w.type}|${Math.round(w.start / 60000)}`));
  let w = 0, b = 0, r = 0;
  for (const x of inc.workouts) {
    if (wIds.has(x.id) || sig.has(`${x.type}|${Math.round(x.start / 60000)}`)) continue;
    if (x.end == null) x.end = Math.max(x.start + 45 * 60000, ...x.entries.flatMap((e) => e.sets.map((st) => (st.t || 0) + 5 * 60000)));
    x.entries.forEach((e) => { e.exId = remap.get(e.exId) || e.exId; });
    s.workouts.push(x); w++;
  }
  const bIds = new Set(s.body.map((x) => x.id)), rIds = new Set(s.recovery.map((x) => x.id));
  for (const x of inc.body) if (!bIds.has(x.id)) { s.body.push(x); b++; }
  for (const x of inc.recovery) if (!rIds.has(x.id)) { s.recovery.push(x); r++; }
  for (const t of inc.settings.dayTypes) if (!s.settings.dayTypes.some((y) => y.name === t.name)) s.settings.dayTypes.push(t);
  for (const m of inc.settings.muscles) if (!s.settings.muscles.includes(m)) s.settings.muscles.push(m);
  for (const k of inc.settings.recoveryKinds) if (!s.settings.recoveryKinds.includes(k)) s.settings.recoveryKinds.push(k);
  if (!s.settings.heightCm && inc.settings.heightCm) s.settings.heightCm = inc.settings.heightCm;
  return { w, b, r };
}

/** RFC-4180-ish parser; detects , ; or tab from the header line. */
function parseCSV(text) {
  const firstLine = text.split(/\r?\n/, 1)[0];
  const count = (ch) => firstLine.split(ch).length - 1;
  const delim = [',', ';', '\t'].sort((a, b) => count(b) - count(a))[0];
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim() !== ''));
}

const COLS = {
  date: ['date', 'datum', 'start_time', 'start', 'workout_date', 'day'],
  time: ['time', 'uhrzeit', 'start time'],
  type: ['workout_type', 'workout name', 'workout_name', 'title', 'day_type', 'split', 'type', 'training'],
  wid: ['workout_id', 'session_id', 'workout id'],
  dur: ['duration_min', 'duration', 'dauer'],
  ex: ['exercise', 'exercise_name', 'exercise name', 'exercise_title', 'übung', 'uebung'],
  muscle: ['primary_muscle', 'muscle', 'muscle_group', 'muskel', 'muskelgruppe'],
  set: ['set', 'set_order', 'set order', 'set_index', 'satz'],
  setType: ['set_type', 'set type'],
  w: ['weight_kg', 'weight', 'gewicht', 'kg', 'weight (kg)'],
  r: ['reps', 'repetitions', 'wdh', 'wiederholungen'],
  rpe: ['rpe'],
  rir: ['rir'],
  note: ['workout_note', 'workout notes', 'notes', 'note', 'description', 'notiz'],
  bf: ['body_fat_pct', 'body_fat', 'bodyfat', 'kfa'],
  kind: ['type', 'kind', 'art'],
};
function colIndex(header, names) {
  const h = header.map((x) => String(x).trim().toLowerCase());
  for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; }
  return -1;
}
/** Dates like 2026-10-03, 2026-10-03 18:30:00, 03.10.2026 18:30, "3 Oct 2026, 18:30". */
function parseDateLoose(d, t) {
  if (!d) return null;
  d = String(d).trim();
  let m, ts = null, hasTime = false;
  if ((m = d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/))) { ts = new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)).getTime(); hasTime = !!m[4]; }
  else if ((m = d.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})(?:,?\s+(\d{1,2}):(\d{2}))?/))) { let y = +m[3]; if (y < 100) y += 2000; ts = new Date(y, m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime(); hasTime = !!m[4]; }
  else { const p = Date.parse(d.replace(/,/g, '')); if (Number.isFinite(p)) { ts = p; hasTime = /\d:\d/.test(d); } }
  if (ts == null || !Number.isFinite(ts)) return null;
  if (!hasTime && t && (m = String(t).match(/(\d{1,2}):(\d{2})/))) ts += (+m[1] * 60 + +m[2]) * 60000;
  else if (!hasTime) ts += 18 * 3600e3;                          // unknown time → 18:00
  return ts;
}
function parseDurMin(v) {
  if (v == null || v === '') return null;
  const s = String(v);
  const h = s.match(/(\d+)\s*h/), mm = s.match(/(\d+)\s*m(?!s)/);
  if (h || mm) return (h ? +h[1] * 60 : 0) + (mm ? +mm[1] : 0);
  const n = parseNum(s);
  return n == null ? null : n > 600 ? Math.round(n / 60) : n;   // seconds → minutes
}

async function importCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('No rows found in this CSV.', { kind: 'error' }); return; }
  const H = rows[0];
  const c = Object.fromEntries(Object.entries(COLS).map(([k, names]) => [k, colIndex(H, names)]));
  const get = (row, k) => (c[k] >= 0 ? String(row[c[k]] ?? '').trim() : '');
  const body = rows.slice(1);

  // Workouts / sets
  if (c.ex >= 0 && c.r >= 0) {
    const groups = new Map();
    let skipped = 0;
    for (const row of body) {
      if (c.setType >= 0 && /warm|^w$/i.test(get(row, 'setType'))) { skipped++; continue; }   // warm-ups are not tracked
      const reps = parseNum(get(row, 'r'));
      const exName = get(row, 'ex');
      const start = parseDateLoose(get(row, 'date'), get(row, 'time'));
      if (!exName || !(reps > 0) || start == null) { skipped++; continue; }
      const type = get(row, 'type') || 'Workout';
      const key = get(row, 'wid') || `${Math.round(start / 60000)}|${type}`;
      if (!groups.has(key)) groups.set(key, { start, type, dur: parseDurMin(get(row, 'dur')), note: get(row, 'note'), ex: new Map() });
      const g = groups.get(key);
      if (!g.ex.has(exName.toLowerCase())) g.ex.set(exName.toLowerCase(), { name: exName, muscle: get(row, 'muscle'), sets: [] });
      const rpe = parseNum(get(row, 'rpe')), rir = parseNum(get(row, 'rir'));
      g.ex.get(exName.toLowerCase()).sets.push({ w: parseNum(get(row, 'w')) ?? 0, r: Math.round(reps), rpe: rpe != null ? clamp(rpe, 1, 10) : rir != null ? clamp(10 - rir, 1, 10) : null, order: parseNum(get(row, 'set')) });
    }
    if (!groups.size) { toast('No sets found. The CSV needs at least date, exercise and reps columns.', { kind: 'error' }); return; }
    const sigs = new Set(S.workouts.map((w) => `${w.type}|${Math.round(w.start / 60000)}`));
    const fresh = [...groups.values()].filter((g) => !sigs.has(`${g.type}|${Math.round(g.start / 60000)}`));
    const nSets = sum(fresh.map((g) => sum([...g.ex.values()].map((e) => e.sets.length))));
    if (!(await ask({ title: 'Import workouts', text: `${fresh.length} workouts with ${nSets} sets${groups.size - fresh.length ? ` (${groups.size - fresh.length} already exist and are skipped)` : ''}${skipped ? `, ${skipped} rows ignored (warm-ups or incomplete)` : ''}.`, ok: 'Import' }))) return;
    commit((s) => {
      const byName = new Map(s.exercises.map((e) => [e.name.toLowerCase(), e]));
      for (const g of fresh) {
        const entries = [];
        let t = g.start + 5 * 60000;
        for (const ex of g.ex.values()) {
          let e = byName.get(ex.name.toLowerCase());
          if (!e) {
            const m = ex.muscle || guessMuscle(ex.name);
            e = { id: uid(), name: ex.name, muscles: m ? [m] : [], tag: null, bw: false, barbell: false, notes: '', archived: false, created: Date.now() };
            s.exercises.push(e); byName.set(ex.name.toLowerCase(), e);
            if (m && !s.settings.muscles.includes(m)) s.settings.muscles.push(m);
          }
          const sets = ex.sets.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).map((x) => { t += 150000; return { w: x.w, r: x.r, rpe: x.rpe, t }; });
          entries.push({ id: uid(), exId: e.id, sets });
        }
        if (!s.settings.dayTypes.some((d) => d.name === g.type)) s.settings.dayTypes.push({ name: g.type, color: DAY_COLORS[s.settings.dayTypes.length % DAY_COLORS.length], rot: false });
        s.workouts.push({ id: uid(), type: g.type, start: g.start, end: g.start + (g.dur ? g.dur * 60000 : Math.max(45 * 60000, t - g.start + 5 * 60000)), note: g.note || '', entries });
      }
    }, { undo: `Imported ${fresh.length} workouts` });
    return;
  }

  // Body entries
  const wCol = colIndex(H, ['weight_kg', 'body_weight', 'bodyweight', 'weight', 'gewicht', 'körpergewicht']);
  if (wCol >= 0 || c.bf >= 0) {
    const entries = [];
    for (const row of body) {
      const date = parseDateLoose(get(row, 'date'));
      if (date == null) continue;
      const m = {};
      for (const [k] of MEASURES) { const i = colIndex(H, [`${k}_cm`, k]); if (i >= 0) { const v = parseNum(row[i]); if (v != null) m[k] = v; } }
      const weight = wCol >= 0 ? parseNum(row[wCol]) : null, bf = parseNum(get(row, 'bf'));
      if (weight == null && bf == null && !Object.keys(m).length) continue;
      entries.push({ id: uid(), date, weight, bf, m, note: get(row, 'note') });
    }
    const have = new Set(S.body.map((b) => `${dayKey(b.date)}|${b.weight}`));
    const fresh = entries.filter((e) => !have.has(`${dayKey(e.date)}|${e.weight}`));
    if (!fresh.length) { toast('No new body entries in this CSV.'); return; }
    if (!(await ask({ title: 'Import body entries', text: `${fresh.length} entries.`, ok: 'Import' }))) return;
    commit((s) => { s.body.push(...fresh); }, { undo: `Imported ${fresh.length} body entries` });
    return;
  }

  // Recovery sessions
  const kCol = c.kind, mCol = colIndex(H, ['duration_min', 'minutes', 'duration', 'dauer']);
  if (kCol >= 0 && mCol >= 0) {
    const fresh = [];
    const have = new Set(S.recovery.map((r) => `${r.kind}|${Math.round(r.date / 60000)}`));
    for (const row of body) {
      const date = parseDateLoose(get(row, 'date'), get(row, 'time'));
      const kind = String(row[kCol] || '').trim();
      if (date == null || !kind || have.has(`${kind}|${Math.round(date / 60000)}`)) continue;
      fresh.push({ id: uid(), kind, date, min: parseDurMin(row[mCol]), note: get(row, 'note') });
    }
    if (!fresh.length) { toast('No new recovery sessions in this CSV.'); return; }
    if (!(await ask({ title: 'Import recovery sessions', text: `${fresh.length} sessions.`, ok: 'Import' }))) return;
    commit((s) => { s.recovery.push(...fresh); for (const r of fresh) if (!s.settings.recoveryKinds.includes(r.kind)) s.settings.recoveryKinds.push(r.kind); }, { undo: `Imported ${fresh.length} recovery sessions` });
    return;
  }
  toast('Unknown CSV layout. Needed: date, exercise, weight, reps (or date + weight_kg for body data).', { kind: 'error', ms: 6000 });
}

/* ---------- merge two exercises (duplicates) ---------- */
function mergeExercise(s, fromId, toId) {
  for (const w of s.workouts) {
    let first = null;
    const keep = [];
    for (const e of w.entries) {
      if (e.exId === fromId) e.exId = toId;
      if (e.exId === toId) {
        if (first) { first.sets.push(...e.sets); continue; }
        first = e;
      }
      keep.push(e);
    }
    w.entries = keep;
  }
  s.exercises = s.exercises.filter((e) => e.id !== fromId);
}

/* ---------- demo data: 12 weeks of push/pull/legs with double progression ---------- */
function generateDemo() {
  const rnd = mulberry32(20261003);
  const rr = (a, b) => a + rnd() * (b - a);
  const ri = (a, b) => Math.floor(rr(a, b + 1));
  const plan = {
    Push: [['Bench Press', ['Chest', 'Triceps', 'Shoulders'], 80, [6, 8], 4, 2.5, { barbell: true }], ['Incline Dumbbell Press', ['Chest', 'Shoulders', 'Triceps'], 28, [8, 12], 3, 2], ['Overhead Press', ['Shoulders', 'Triceps'], 50, [6, 8], 3, 2.5, { barbell: true }], ['Lateral Raise', ['Shoulders'], 10, [12, 20], 3, 1], ['Triceps Pushdown', ['Triceps'], 25, [10, 15], 3, 2.5], ['Dips', ['Chest', 'Triceps'], 10, [8, 12], 2, 2.5, { bw: true }]],
    Pull: [['Deadlift', ['Back', 'Hamstrings', 'Glutes'], 140, [3, 5], 3, 5, { barbell: true }], ['Pull-Up', ['Back', 'Biceps'], 5, [6, 10], 4, 2.5, { bw: true }], ['Barbell Row', ['Back', 'Biceps'], 75, [6, 10], 3, 2.5, { barbell: true }], ['Lat Pulldown', ['Back', 'Biceps'], 60, [8, 12], 3, 2.5], ['Face Pull', ['Shoulders', 'Back'], 20, [12, 20], 3, 2.5], ['Barbell Curl', ['Biceps'], 32.5, [8, 12], 3, 2.5, { barbell: true }]],
    Legs: [['Squat', ['Quads', 'Glutes'], 110, [5, 8], 4, 2.5, { barbell: true }], ['Romanian Deadlift', ['Hamstrings', 'Glutes'], 90, [6, 10], 3, 2.5, { barbell: true }], ['Leg Press', ['Quads', 'Glutes'], 180, [8, 12], 3, 10], ['Leg Curl', ['Hamstrings'], 45, [10, 15], 3, 2.5], ['Calf Raise', ['Calves'], 80, [10, 15], 4, 5]],
  };
  const newEx = [];
  const ensure = (name, muscles, flags = {}) => {
    let e = S.exercises.find((x) => x.name.toLowerCase() === name.toLowerCase()) || newEx.find((x) => x.name === name);
    if (!e) { e = { id: uid(), name, muscles, tag: null, bw: !!flags.bw, barbell: !!flags.barbell, notes: '', archived: false, created: Date.now(), demo: true }; newEx.push(e); }
    return e;
  };
  const prog = new Map();
  const days = 84;
  const first = addDays(startOfDay(Date.now()), -days);
  const cycle = ['Push', 'Pull', 'Legs', 'Push', 'Pull', 'Legs', null];
  const workouts = [], recovery = [], body = [];
  for (let i = 0; i < days; i++) {
    const day = addDays(first, i);
    const type = cycle[i % 7];
    if (type && rnd() > 0.08) {
      const start = day + (17 * 60 + ri(0, 150)) * 60000;
      let t = start + ri(6, 10) * 60000;
      const entries = [];
      for (const [name, muscles, w0, [lo, hi], nSets, step, flags] of plan[type]) {
        if (name === 'Deadlift' && i % 7 === 4) continue;           // deadlift once a week
        if (rnd() < 0.05) continue;
        const ex = ensure(name, muscles, flags || {});
        let p = prog.get(name);
        if (!p) { p = { w: w0, reps: Array(nSets).fill(lo + 1), n: 0 }; prog.set(name, p); }
        if (p.n > 0 && p.reps.every((x) => x >= hi)) { p.w = round(p.w + step, 2); p.reps = p.reps.map(() => lo); }
        else if (p.n > 0) p.reps = p.reps.map((x, k) => Math.min(hi, x + (rnd() < 0.6 - k * 0.1 ? 1 : 0)));
        p.n++;
        const sets = [];
        for (let k = 0; k < nSets; k++) {
          const reps = Math.max(lo - 1, p.reps[k] - (rnd() < 0.12 ? 1 : 0));
          const rpe = clamp(Math.round((7 + k * 0.5 + (reps >= hi ? 0.7 : 0) + rr(-0.5, 0.6)) * 2) / 2, 6, 10);
          sets.push({ w: p.w, r: reps, rpe, t });
          t += ri(110, 200) * 1000;
        }
        entries.push({ id: uid(), exId: ex.id, sets });
        t += ri(60, 140) * 1000;
      }
      workouts.push({ id: uid(), type, start, end: t + ri(2, 6) * 60000, note: '', entries, demo: true });
      if (rnd() < 0.32) recovery.push({ id: uid(), kind: 'Sauna', date: t + ri(15, 30) * 60000, min: [15, 20, 20, 25][ri(0, 3)], note: '', demo: true });
    }
    if (i % 10 === 3) recovery.push({ id: uid(), kind: 'Rehab', date: day + 10 * 3600e3, min: 30, note: 'Shoulder mobility', demo: true });
    if (rnd() < 0.6 || i % 14 === 0) {
      const entry = { id: uid(), date: day + 7.5 * 3600e3, weight: round(80.6 + i * 0.012 + Math.sin(i / 3) * 0.25 + rr(-0.35, 0.35), 1), bf: null, m: {}, note: '', demo: true };
      if (i % 14 === 0) entry.bf = round(16.4 - i * 0.012 + rr(-0.3, 0.3), 1);
      if (i % 28 === 0) entry.m = { neck: 39, chest: round(104 + i * 0.012, 1), waist: round(84.5 - i * 0.012, 1), arm: round(38 + i * 0.008, 1), thigh: round(60 + i * 0.008, 1), calf: 38 };
      body.push(entry);
    }
  }
  commit((s) => {
    s.exercises.push(...newEx);
    s.workouts.push(...workouts);
    s.recovery.push(...recovery);
    s.body.push(...body);
    if (!s.settings.heightCm) { s.settings.heightCm = 181; s.meta.demoHeight = true; }
  });
}

function clearDemo() {
  commit((s) => {
    s.workouts = s.workouts.filter((w) => !w.demo);
    s.recovery = s.recovery.filter((r) => !r.demo);
    s.body = s.body.filter((b) => !b.demo);
    const used = new Set(s.workouts.flatMap((w) => w.entries.map((e) => e.exId)));
    s.exercises = s.exercises.filter((e) => !e.demo || used.has(e.id));
    if (s.activeId && !s.workouts.some((w) => w.id === s.activeId)) s.activeId = null;
    if (s.meta.demoHeight) { s.settings.heightCm = null; s.meta.demoHeight = false; }
  }, { undo: 'Demo data removed' });
}

/* ==========================================================================
   09 · EVENTS & STARTUP
   One delegated listener per event type. Elements declare intent with
   data-act="…" (clicks), data-in="…" (typing) and data-step="…" (+/−).
   ========================================================================== */

/** Values bound to steppers / inputs: key → { object, field, step, decimals, min, after } */
const BIND = {
  'draft.w': { obj: () => UI.draft, f: 'w', step: () => S.settings.weightStep, dec: 2, min: (o) => (o.bw ? -1000 : 0), after: () => updateEditorExtras() },
  'draft.r': { obj: () => UI.draft, f: 'r', step: () => 1, dec: 0, min: () => 0, after: () => updateEditorExtras() },
  'se.w': { obj: () => UI.setEdit, f: 'w', step: () => S.settings.weightStep, dec: 2, min: (o) => (o.bw ? -1000 : 0) },
  'se.r': { obj: () => UI.setEdit, f: 'r', step: () => 1, dec: 0, min: () => 0 },
  'wi.w': { obj: () => UI.weighIn, f: 'w', step: () => 0.1, dec: 1, min: () => 0 },
  'bf.weight': { obj: () => UI.bodyForm, f: 'weight', step: () => 0.1, dec: 1, min: () => 0 },
  'rf.min': { obj: () => UI.recForm, f: 'min', step: () => 5, dec: 0, min: () => 0 },
};
function stepBind(key, dir) {
  const b = BIND[key];
  const o = b && b.obj();
  if (!o) return;
  const cur = parseNum(o[b.f]);
  const nv = Math.max(b.min(o), round((cur == null ? 0 : cur) + dir * b.step(), b.dec));
  o[b.f] = b.dec ? fmt.n(nv, b.dec) : String(nv);
  const input = document.querySelector(`[data-bind="${key}"]`);
  if (input) input.value = o[b.f];
  if (b.after) b.after();
}

  'set-bar': async () => {
    const v = await promptText({ title: 'Bar weight (kg)', value: fmt.n(S.settings.barWeight), numeric: true });
    if (v == null) return;
    const n = parseNum(v);
    if (n == null || n < 0 || n > 60) { toast('Enter a weight between 0 and 60 kg.'); return; }
    commit((s) => { s.settings.barWeight = n; });
  },
  'toggle-plate': (el) => commit((s) => { const p = +el.dataset.v, a = s.settings.plates, i = a.indexOf(p); if (i >= 0) a.splice(i, 1); else a.push(p); a.sort((x, y) => y - x); }),
  'add-reckind': async () => {
    const n = ((await promptText({ title: 'New recovery type', placeholder: 'e.g. Massage', ok: 'Add' })) || '').trim();
    if (n && !S.settings.recoveryKinds.includes(n)) commit((s) => { s.settings.recoveryKinds.push(n); });
  },
  'del-reckind': (el) => {
    const k = el.dataset.k, used = S.recovery.filter((r) => r.kind === k).length;
    if (used) { toast(`“${k}” is used by ${used} logged ${used === 1 ? 'session' : 'sessions'} and stays.`); return; }
    if (S.settings.recoveryKinds.length <= 1) { toast('Keep at least one recovery type.'); return; }
    commit((s) => { s.settings.recoveryKinds = s.settings.recoveryKinds.filter((x) => x !== k); }, { undo: `Removed “${k}”` });
  },
  'add-muscle': async () => {
    const n = ((await promptText({ title: 'New muscle group', placeholder: 'e.g. Rear delts', ok: 'Add' })) || '').trim();
    if (n && !S.settings.muscles.includes(n)) commit((s) => { s.settings.muscles.push(n); });
  },
  'del-muscle': (el) => {
    const m = el.dataset.m, used = S.exercises.filter((e) => e.muscles.includes(m)).length;
    if (used) { toast(`“${m}” is used by ${used} ${used === 1 ? 'exercise' : 'exercises'}. Change those first.`); return; }
    commit((s) => { s.settings.muscles = s.settings.muscles.filter((x) => x !== m); }, { undo: `Removed “${m}”` });
  },
  'edit-daytype': (el) => openDayTypeSheet(+el.dataset.i),
  'add-daytype': async () => {
    const n = ((await promptText({ title: 'New day type', placeholder: 'e.g. Upper', ok: 'Add' })) || '').trim();
    if (!n) return;
    if (S.settings.dayTypes.some((t) => t.name.toLowerCase() === n.toLowerCase())) { toast('That day type exists already.'); return; }
    commit((s) => { s.settings.dayTypes.push({ name: n, color: DAY_COLORS[s.settings.dayTypes.length % DAY_COLORS.length], rot: true }); });
  },
  'dt-rename': async (el) => {
    const i = +el.dataset.i, t = S.settings.dayTypes[i];
    const n = ((await promptText({ title: 'Rename day type', value: t.name })) || '').trim();
    if (!n || n === t.name) return;
    if (S.settings.dayTypes.some((x, j) => j !== i && x.name.toLowerCase() === n.toLowerCase())) { toast('That name is taken.'); return; }
    const old = t.name;
    commit((s) => {
      s.settings.dayTypes[i].name = n;
      for (const w of s.workouts) if (w.type === old) w.type = n;
      for (const e of s.exercises) if (e.tag === old) e.tag = n;
    });
    if (Sheets.top()) { Sheets.top().title = n; repaintSheet(); }
  },
  'dt-rot': (el) => { commit((s) => { const t = s.settings.dayTypes[+el.dataset.i]; t.rot = !t.rot; }); repaintSheet(); },
  'dt-move': async (el) => {
    const i = +el.dataset.i, j = i + +el.dataset.d;
    await closeSheet();
    commit((s) => { const a = s.settings.dayTypes; if (j >= 0 && j < a.length) [a[i], a[j]] = [a[j], a[i]]; });
  },
  'dt-color': (el) => { commit((s) => { s.settings.dayTypes[+el.dataset.i].color = el.dataset.c; }); repaintSheet(); },
  'dt-delete': async (el) => {
    if (S.settings.dayTypes.length <= 1) { toast('Keep at least one day type.'); return; }
    const i = +el.dataset.i;
    await closeSheet();
    commit((s) => { s.settings.dayTypes.splice(i, 1); }, { undo: 'Day type deleted' });
  },

  // data
  'export-json': () => exportBackup(),
  'backup-share': async () => {
    const name = `gym-tracker-backup-${dayKey(Date.now())}.json`;
    const ok = await shareText(name, backupText(), 'application/json');
    if (ok === null) return;
    await closeSheet();
    if (ok) { markBackedUp(); render(); toast('Backup saved'); }
    else if (downloadText(name, backupText(), 'application/json')) { markBackedUp(); render(); toast('Backup downloaded'); }
  },
  'backup-download': async () => {
    await closeSheet();
    if (downloadText(`gym-tracker-backup-${dayKey(Date.now())}.json`, backupText(), 'application/json')) { markBackedUp(); render(); toast('Backup downloaded'); }
  },
  'export-csv': () => openCsvSheet(),
  'csv-dl': (el) => exportCSV(el.dataset.kind),
  import: () => { const f = $('#file-in'); if (!f) return; f.value = ''; f.click(); },
  'download-corrupt': () => downloadText('gym-tracker-unreadable-data.txt', Store.readCorruptCopy(), 'text/plain'),
  'snooze-backup': () => commit((s) => { s.meta.backupSnooze = Date.now() + 3 * DAY; }),
  'load-demo': async () => {
    if (isRealData() && !(await ask({ title: 'Load demo data?', text: 'It mixes with your own entries but can be removed again with one tap.', ok: 'Load demo data' }))) return;
    generateDemo();
    toast('Demo data loaded: 12 weeks of push/pull/legs');
  },
  'clear-demo': () => clearDemo(),
  'erase-all': async () => {
    if (!(await ask({ title: 'Erase all data?', text: 'All workouts, body entries, recovery sessions, exercises and settings on this device are deleted.', ok: 'Erase everything', danger: true }))) return;
    commit(() => { S = defaultState(); }, { undo: 'All data erased', render: false });
    goTab('home');
  },
};

/* ---------- typing (input) and committed changes (change) ---------- */
let noteTimer = null;
function saveSoon() { clearTimeout(noteTimer); noteTimer = setTimeout(() => { noteTimer = null; if (!save()) storageWarning(); }, 400); }
function flushSave() { if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; save(); } }

const IN = {
  bind: (el) => { const b = BIND[el.dataset.bind], o = b && b.obj(); if (!o) return; o[b.f] = el.value; if (b.after) b.after(); },
  'picker-q': (el) => { UI.picker.q = el.value; const l = $('#pk-list'); if (l) l.innerHTML = pickerList(); },
  'choice-q': (el) => { UI.choice.q = el.value; const l = $('#choice-list'); if (l) l.innerHTML = choiceList(); },
  'lib-q': (el) => { UI.lib.q = el.value; const l = $('#lib-list'); if (l) l.innerHTML = libraryList(); },
  'exf-name': (el) => { UI.exForm.name = el.value; },
  'exf-notes': (el) => { UI.exForm.notes = el.value; },
  'w-note': (el) => { const w = wById(el.dataset.wid); if (w) { w.note = el.value; saveSoon(); } },
  'wi-bf': (el) => { UI.weighIn.bf = el.value; },
  'rf-note': (el) => { UI.recForm.note = el.value; },
  'bf-bf': (el) => { UI.bodyForm.bf = el.value; },
  'bf-note': (el) => { UI.bodyForm.note = el.value; },
  'bf-m': (el) => {
    UI.bodyForm.m[el.dataset.k] = el.value;
    const navy = navyBF(Object.fromEntries(Object.entries(UI.bodyForm.m).map(([k, v]) => [k, parseNum(v)])));
    let hint = $('.sheet .hint-btn');
    if (navy && !hint) { repaintSheet(); const f = $(`.sheet [data-in="bf-m"][data-k="${el.dataset.k}"]`); if (f) { f.focus(); const L = f.value.length; f.setSelectionRange && f.setSelectionRange(L, L); } }
    else if (hint && navy) { hint.dataset.v = round(navy, 1); const b = hint.querySelector('b'); if (b) b.textContent = `${fmt.n(round(navy, 1))}%`; }
    else if (hint && !navy) hint.remove();
  },
};
const CH = {
  'rf-date': (el) => { UI.recForm.date = el.value; },
  'rf-time': (el) => { UI.recForm.time = el.value; },
  'bf-date': (el) => { UI.bodyForm.date = el.value; },
  'w-date': (el) => shiftWorkout(el.dataset.wid, { date: el.value }),
  'w-time': (el) => shiftWorkout(el.dataset.wid, { time: el.value }),
  'w-dur': (el) => {
    const n = parseNum(el.value);
    if (n == null || n <= 0 || n > 600) { toast('Duration in minutes, e.g. 70.'); render(); return; }
    commit((s) => { const w = s.workouts.find((x) => x.id === el.dataset.wid); w.end = w.start + Math.round(n) * 60000; });
  },
};
/** Move a past workout to another date/time; set timestamps move with it. */
function shiftWorkout(wid, { date, time }) {
  const w = wById(wid);
  if (!w) return;
  const ns = fromDateTimeInputs(date || toDateInput(w.start), time || toTimeInput(w.start), w.start);
  const delta = ns - w.start;
  if (!delta) return;
  if (ns > Date.now()) { toast('A finished workout can’t be in the future.'); render(); return; }
  commit((s) => {
    const x = s.workouts.find((y) => y.id === wid);
    x.start += delta;
    if (x.end) x.end += delta;
    for (const e of x.entries) for (const st of e.sets) if (st.t) st.t += delta;
  });
}

/* ---------- hold +/− to repeat ---------- */
let hold = null, suppressStepClick = false;
function endHold() {
  if (!hold) return;
  clearTimeout(hold.timer); clearInterval(hold.iv);
  if (hold.fired) { suppressStepClick = true; setTimeout(() => { suppressStepClick = false; }, 350); }
  hold = null;
}

/* ---------- PWA bits (only when served from a web address) ---------- */
function appIcon(size = 192) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, size, size);
    const u = size / 16;
    const bar = (x, h, col) => { g.fillStyle = col; const y = (size - h) / 2; g.beginPath(); if (g.roundRect) g.roundRect(x, y, 2.2 * u, h, u * 0.7); else g.rect(x, y, 2.2 * u, h); g.fill(); };
    g.fillStyle = '#6B6B70'; g.fillRect(2 * u, size / 2 - 0.5 * u, 12 * u, u);
    bar(3.4 * u, 9.5 * u, DAY_COLORS[0]); bar(6.9 * u, 11 * u, DAY_COLORS[1]); bar(10.4 * u, 9.5 * u, DAY_COLORS[2]);
    return c.toDataURL('image/png');
  } catch (_) { return null; }
}
function pwaSetup() {
  const icon = appIcon(192);
  if (icon && !document.querySelector('link[rel=icon]')) { const l = document.createElement('link'); l.rel = 'icon'; l.href = icon; document.head.appendChild(l); }
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const big = appIcon(512) || icon;
    const base = location.href.split('#')[0];
    const manifest = { name: 'Gym Tracker', short_name: 'Gym', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#000000', theme_color: '#000000', icons: [{ src: big, sizes: '512x512', type: 'image/png' }] };
    const m = document.createElement('link');
    m.rel = 'manifest';
    m.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(m);
    if (!document.querySelector('link[rel=apple-touch-icon]')) { const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = big; document.head.appendChild(a); }
    // Optional offline cache: if a sw.js sits next to this file it is used, otherwise nothing happens.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => (window.caches ? caches.open('gym-tracker-v1').then((c) => c.add(base)) : null))
        .catch(() => {});
    }
  } catch (_) { /* optional */ }
}

/* ---------- startup ---------- */
function init() {
  loadState();
  derive();
  if (!history.state) histOp('replaceState', location.hash || '#/home', { depth: 0 });

  document.addEventListener('click', (e) => {
    const st = e.target.closest('[data-step]');
    if (st) {
      e.preventDefault();
      if (suppressStepClick) { suppressStepClick = false; return; }
      stepBind(st.dataset.step, +st.dataset.d);
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    try {
      const r = fn(el, e);
      if (r && typeof r.catch === 'function') r.catch((err) => { console.error(err); toast('Something went wrong. Your data is safe.', { kind: 'error' }); });
    } catch (err) {
      console.error(err);
      toast('Something went wrong. Your data is safe.', { kind: 'error' });
    }
  });
  document.addEventListener('input', (e) => { const el = e.target.closest && e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
  document.addEventListener('change', (e) => { const el = e.target.closest && e.target.closest('[data-in]'); if (el && CH[el.dataset.in]) CH[el.dataset.in](el, e); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('input[data-bind], #pk-q')) { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Escape') { if (UI.dialog) closeDialog(null); else if (Sheets.stack.length) closeSheet(); }
  });
  // hold a +/− button to repeat
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    const key = b.dataset.step, dir = +b.dataset.d;
    hold = { fired: false, x: e.clientX, y: e.clientY, timer: setTimeout(() => { if (!hold) return; hold.fired = true; stepBind(key, dir); hold.iv = setInterval(() => stepBind(key, dir), 90); }, 420) };
  });
  document.addEventListener('pointermove', (e) => { if (hold && !hold.fired && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 12) { clearTimeout(hold.timer); hold = null; } });
  document.addEventListener('pointerup', endHold);
  document.addEventListener('pointercancel', endHold);

  $('#file-in').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    let text;
    try { text = await file.text(); } catch (_) { toast('Couldn’t read that file.', { kind: 'error' }); return; }
    try { await handleImport(text, file.name); } catch (err) { console.error(err); toast('Import failed. Nothing was changed.', { kind: 'error' }); }
  });

  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => mountCharts($('#view')), 150); });
  window.addEventListener('storage', (e) => { if (e.key === KEY) { loadState(); derive(); render(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
    else { tick(); Wake.sync(route().name); }
  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('error', (e) => console.error('Unhandled', e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => console.error('Unhandled promise', e.reason));

  setInterval(tick, 1000);
  pwaSetup();
  render();
  if (BOOT.corrupt) toast('Saved data couldn’t be read. It was kept and can be downloaded in Settings.', { kind: 'error', ms: 8000 });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
