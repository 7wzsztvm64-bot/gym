<!--
  Gym Tracker — single-file, offline-first strength log.
  Everything (HTML, CSS, JavaScript, fonts) is in this one file. No build tools,
  no libraries, no backend. Data is stored in this browser's localStorage.

  Code map (inside <script>):
    01 CORE         constants, utilities, formatting, icons
    02 STORAGE      load/save with error handling, migrations, commit()/undo
    03 ANALYTICS    derived data: records (PRs), e1RM, volumes, streaks, recovery
    04 CHARTS       dependency-free SVG charts with tap read-outs
    05 UI           router, render loop, sheets, dialogs, toasts, wake lock
    06 WORKOUT      Today, active workout, set logger, picker, finish summary
    07 SCREENS      History, Progress, Body, Exercises, Settings
    08 IO           JSON backup, CSV export/import, demo data
    09 EVENTS       delegated event handling and startup
-->

:root {
  color-scheme: dark;
  --bg: #000000;
  --s1: #1C1C1E;            /* grouped surface */
  --s2: #2C2C2E;            /* controls on a surface */
  --s3: #3A3A3C;            /* pressed / stronger fill */
  --line: #38383A;          /* separators */
  --line-2: #48484A;
  --hair: rgba(255, 255, 255, 0.06);
  --t1: #FFFFFF;
  --t2: #A1A1A8;
  --t3: #8E8E93;
  --chalk: #F5F5F2;
  --push: #F15F12;
  --pull: #3889FC;
  --legs: #EA1596;
  --gold: #FFC53D;
  --teal: #2BD4C1;
  --up: #30D158;
  --down: #FF453A;
  --ctx: var(--chalk);      /* contextual accent, set per screen to the day colour */
  --ctx-a: rgba(245, 245, 242, 0.25);
  --ctx-b: rgba(245, 245, 242, 0.1);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "Barlow Condensed", "SF Pro Display", -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--t1);
  font: 400 17px/1.35 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}
body.sheet-open { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button:disabled, button[disabled] { cursor: default; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-weight: 700; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.xs { width: 14px; height: 14px; margin-left: 2px; opacity: 0.6; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-weight: 600; letter-spacing: 0.005em; }
.muted { color: var(--t2); }
.small { font-size: 13px; }
.center { text-align: center; }
.grow { flex: 1; }
.mt8 { margin-top: 8px !important; } .mt12 { margin-top: 12px !important; } .mt16 { margin-top: 16px !important; } .mt24 { margin-top: 24px !important; }

/* ---------- app shell ---------- */
#app { position: relative; z-index: 0; isolation: isolate; min-height: 100vh; min-height: 100dvh; }
.view { max-width: 640px; margin: 0 auto; padding: 0 16px calc(104px + var(--safe-b)); }
body.has-resume .view { padding-bottom: calc(172px + var(--safe-b)); }
.view.full { padding-bottom: calc(40px + var(--safe-b)); }
.view > .banner:first-child { margin-top: calc(var(--safe-t) + 10px); }

.lt { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(var(--safe-t) + 18px) 4px 16px; }
.lt h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.022em; }
.lt-sub { margin: 4px 0 0; color: var(--t2); font-size: 15px; }
.lt-actions { display: flex; gap: 8px; }
.tags { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: 1px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 8px; background: var(--s2); color: var(--t2); }

.nb {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px;
  min-height: calc(54px + var(--safe-t)); margin: 0 -16px; padding: var(--safe-t) 8px 0;
  background: rgba(0, 0, 0, 0.74);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.nb-l, .nb-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nb-r { justify-content: flex-end; }
.nb-title { font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.nb-back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 2px; color: var(--chalk); font-size: 17px; white-space: nowrap; }
.nb-back svg.i { width: 26px; height: 26px; }
.type-btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px 0 14px; border-radius: 19px; background: var(--s2); font-size: 16px; font-weight: 700; }
.type-btn svg.i { width: 16px; height: 16px; color: var(--t2); }
.nb-clock { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--s1); font-size: 19px; font-variant-numeric: tabular-nums; }
.nb-clock svg.i { width: 16px; height: 16px; color: var(--ctx); }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  padding-bottom: var(--safe-b);
  background: rgba(20, 20, 22, 0.84);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  border-top: 0.5px solid rgba(255, 255, 255, 0.12);
}
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 640px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 58px; font-size: 10.5px; font-weight: 600; color: #8E8E93; }
.tab svg.i { width: 26px; height: 26px; stroke-width: 1.9; }
.tab.on { color: var(--chalk); }
.tab:active { opacity: 0.6; }

/* running-workout bar above the tab bar */
#resume { position: fixed; left: 12px; right: 12px; bottom: calc(66px + var(--safe-b)); z-index: 29; max-width: 616px; margin: 0 auto; }
.resume-in {
  display: flex; align-items: center; gap: 12px; width: 100%; height: 60px; padding: 0 8px 0 16px;
  border-radius: 20px; background: #232326; text-align: left;
  box-shadow: inset 0 0 0 1px var(--ctx-a), 0 10px 30px rgba(0, 0, 0, 0.55);
}
.resume-dot { width: 10px; height: 10px; border-radius: 5px; background: var(--ctx); box-shadow: 0 0 10px var(--ctx); animation: breathe 2s ease-in-out infinite; }
.resume-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; color: var(--t2); }
.resume-txt b { font-size: 15px; color: var(--t1); }
.resume-go { height: 44px; padding: 0 16px; border-radius: 14px; background: var(--ctx); color: #000; font-weight: 700; font-size: 15px; display: flex; align-items: center; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 56px; padding: 0 20px; border-radius: 16px;
  background: var(--s2); color: var(--t1); font-size: 17px; font-weight: 600; white-space: nowrap;
  transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.98); opacity: 0.88; }
.btn:disabled { opacity: 0.4; transform: none; }
.btn.block { display: flex; width: 100%; }
.btn.sm { height: 42px; padding: 0 14px; border-radius: 12px; font-size: 15px; }
.btn.lg { height: 62px; border-radius: 18px; font-size: 18px; }
.btn.xl { height: 70px; border-radius: 20px; font-size: 20px; margin-top: 18px; }
.btn.primary { background: var(--chalk); color: #000; }
.btn.ctx { background: var(--ctx); color: #000; font-weight: 700; box-shadow: 0 10px 32px -10px var(--ctx); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18); }
.btn.plain { background: transparent; }
.btn.danger { color: var(--down); }
.btn.danger-fill { background: var(--down); color: #fff; }
.btn svg.i { width: 22px; height: 22px; }
.btn.ctx svg.i, .btn.primary svg.i { stroke-width: 2.6; }
.btn.rec { flex: 1 0 92px; flex-direction: column; gap: 3px; height: 68px; padding: 0 10px; font-size: 14px; }
.btn.rec svg.i { color: var(--teal); }
.next-btn { justify-content: space-between; }
.next-btn span { overflow: hidden; text-overflow: ellipsis; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: var(--s2); color: var(--t1); flex: none; }
.ib.plain { background: transparent; }
.ib:active { background: var(--s3); }
.ib:disabled { opacity: 0.3; }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--chalk); font-size: 15px; font-weight: 600; }
.link svg.i { width: 17px; height: 17px; }
.row-btns { display: flex; gap: 10px; }

/* chips & segmented control */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px;
  border-radius: 20px; background: var(--s2); color: var(--t1); font-size: 15px; font-weight: 500; white-space: nowrap;
}
.chip.sm { height: 36px; padding: 0 14px; font-size: 14px; }
.chip.on { background: var(--chalk); color: #000; font-weight: 600; }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--s3); }
.chip svg.i { width: 16px; height: 16px; }
.chip em { font-style: normal; font-size: 11px; font-weight: 700; margin-left: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.14); }
.filters .chip.on svg.i { stroke-width: 2.4; }
.dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 5px; }
.dot.lg { width: 14px; height: 14px; border-radius: 7px; }
.swatch { width: 42px; height: 42px; border-radius: 21px; }
.swatch.on { box-shadow: 0 0 0 3px var(--s1), 0 0 0 5px var(--chalk); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--s1); }
.sheet .seg, .row .seg { background: var(--s2); }
.seg button { height: 36px; padding: 0 8px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--t2); white-space: nowrap; }
.seg button.on { background: var(--s3); color: var(--t1); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
.row .seg { min-width: 150px; }

/* switch */
.sw { position: relative; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--s3); transition: background 0.2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35); transition: transform 0.2s; }
.sw.on { background: var(--up); }
.sw.on::after { transform: translateX(20px); }

/* fields */
.label { display: block; margin: 16px 4px 6px; font-size: 13px; color: var(--t2); }
.field {
  display: block; width: 100%; min-width: 0; min-height: 52px; padding: 0 14px; border-radius: 12px;
  border: 1px solid transparent; background: var(--s2); color: var(--t1); font-size: 17px; outline: none;
  -webkit-appearance: none; appearance: none;
}
.field:focus { border-color: var(--chalk); }
.field::placeholder { color: #6C6C72; }
textarea.field { min-height: 84px; padding: 13px 14px; line-height: 1.4; resize: vertical; }
input[type="date"].field, input[type="time"].field { width: 100%; min-width: 0; padding: 0 10px; text-align: left; }
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
.search { position: relative; }
.search > span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; color: var(--t2); pointer-events: none; }
.search svg.i { width: 20px; height: 20px; }
.search .field { padding-left: 44px; }
.form-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.form-grid3 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 0.85fr); gap: 8px; }
.form-grid2 > label, .form-grid3 > label { min-width: 0; }
.span2 { grid-column: 1 / -1; }
.m-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.disclosure { display: flex; align-items: center; gap: 6px; height: 44px; font-size: 16px; font-weight: 600; }
.disclosure svg.i { width: 18px; height: 18px; color: var(--t2); }
.hint-btn { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; padding: 11px 12px; border-radius: 12px; background: rgba(43, 212, 193, 0.1); color: var(--teal); font-size: 14px; text-align: left; }
.hint-btn b { color: var(--t1); }

/* stepper: big +/− for sweaty thumbs */
.stepper { display: grid; grid-template-columns: 68px minmax(0, 1fr) 68px; gap: 8px; }
.stepper button { display: flex; align-items: center; justify-content: center; height: 68px; border-radius: 18px; background: var(--s2); color: var(--t1); }
.stepper button svg.i { width: 28px; height: 28px; stroke-width: 2.6; }
.stepper button:active { background: var(--s3); transform: scale(0.96); }
.stepper input {
  width: 100%; min-width: 0; height: 68px; border: 0; border-radius: 18px; background: var(--bg); color: var(--t1);
  text-align: center; font-size: 44px; outline: none; box-shadow: inset 0 0 0 1px var(--line);
}
.stepper input:focus { box-shadow: inset 0 0 0 2px var(--ctx); }
.stepper input::placeholder { color: var(--s3); }
.stepper.sm button, .stepper.sm input { height: 56px; }
.stepper.sm input { font-size: 34px; }

/* ---------- sections, panels, lists ---------- */
.sec { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 10px; }
.sec-h h2 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
.sec-a { font-size: 14px; color: var(--t2); }
.list-h { margin: 22px 16px 8px; font-size: 13px; font-weight: 600; color: var(--t2); }
.panel { background: var(--s1); border-radius: 20px; padding: 16px; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.panel-t { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.panel-s { font-size: 13px; color: var(--t2); text-align: right; }
.foot-note { margin: 8px 16px 0; font-size: 13px; color: var(--t2); line-height: 1.4; }

.group { background: var(--s1); border-radius: 16px; overflow: hidden; }
.group.flat { background: transparent; border-radius: 0; margin: 0 -16px; }
.sheet .group { background: var(--s2); }
.group > * { position: relative; }
.group > * + *::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); transform: scaleY(0.5); transform-origin: top; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 16px; text-align: left; color: var(--t1); }
button.row:active, .pk-row:active, .set-row:active { background: var(--s2); }
.sheet button.row:active, .sheet .pk-row:active { background: var(--s3); }
.row.col { flex-direction: column; align-items: stretch; gap: 0; }
.row.danger, .row.danger .row-title { color: var(--down); }
.row:disabled { opacity: 0.35; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 17px; line-height: 1.3; }
.row-sub { margin-top: 2px; font-size: 14px; line-height: 1.35; color: var(--t2); }
.row-val { flex: none; display: flex; align-items: baseline; gap: 4px; color: var(--t2); font-size: 16px; text-align: right; }
.row-val b { color: var(--t1); font-size: 20px; }
.row-val.big, .row-val b.big { font-size: 22px; color: var(--t1); }
.row-val small { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--t2); }
.row-val .delta { align-self: center; margin-left: 6px; }
.row-ic { flex: none; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--s2); color: var(--t1); }
.sheet .row-ic { background: var(--s3); }
.row-ic svg.i { width: 19px; height: 19px; }
.row-ic.gold { background: rgba(255, 197, 61, 0.14); color: var(--gold); }
.row-ic.teal { background: rgba(43, 212, 193, 0.14); color: var(--teal); }
.row-check { display: flex; color: var(--chalk); }
.chev { display: flex; color: var(--t3); }
.chev svg.i { width: 18px; height: 18px; }
.rank { width: 22px; font-size: 20px; color: var(--t2); }
.mini-step { display: flex; align-items: center; gap: 10px; }
.mini-step b { min-width: 18px; font-size: 26px; text-align: center; }

/* banners & empty states */
.banner { display: flex; align-items: flex-start; gap: 12px; margin: 0 0 12px; padding: 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
.banner p { margin: 3px 0 0; }
.banner b { font-size: 15px; }
.banner.danger { background: #2B1513; color: #FFD9D6; }
.banner.danger > svg.i { color: var(--down); }
.banner.info { background: #16202E; color: #DCE8FF; }
.banner.info > svg.i { color: #64A8FF; }
.banner .btn { background: rgba(255, 255, 255, 0.12); color: #fff; }
.banner .btn.ghost { background: transparent; }
.banner-acts { display: flex; gap: 8px; margin-top: 10px; }
.empty { padding: 48px 24px; text-align: center; color: var(--t2); }
.empty.small { padding: 28px 16px 8px; }
.empty > svg.i { width: 44px; height: 44px; color: var(--t3); stroke-width: 1.6; }
.empty h3 { margin: 14px 0 6px; font-size: 20px; color: var(--t1); }
.empty p { max-width: 34ch; margin: 0 auto; font-size: 15px; line-height: 1.45; }
.empty .btn { min-width: 220px; }
.intro p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: var(--t2); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { min-width: 0; padding: 12px 14px 13px; border-radius: 16px; background: var(--s1); }
.tile-l { overflow: hidden; font-size: 13px; color: var(--t2); white-space: nowrap; text-overflow: ellipsis; }
.tile-v { overflow: hidden; margin-top: 4px; font-family: var(--font-num); font-size: 32px; font-weight: 600; line-height: 1.05; white-space: nowrap; text-overflow: ellipsis; }
.tile-v small { margin-left: 3px; font-family: var(--font-ui); font-size: 14px; font-weight: 500; color: var(--t2); }
.tile-v.sm { margin-top: 6px; font-family: var(--font-ui); font-size: 17px; font-weight: 600; line-height: 1.3; white-space: normal; }
.tile-v .delta { font-size: 22px; font-family: var(--font-num); }
.tile-v .delta svg.i { width: 20px; height: 20px; }
.tile-d { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 5px; font-size: 12.5px; line-height: 1.3; color: var(--t2); }
.tile-d svg.i { width: 14px; height: 14px; color: var(--gold); }
.tile-d .delta svg.i { color: inherit; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; }
.delta svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--t2); }
.kv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.kv3 .num { display: block; font-size: 22px; line-height: 1.1; }
.kv3 label { font-size: 12px; color: var(--t2); }

/* ---------- Today ---------- */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  padding: 22px 20px 20px; border-radius: 28px; background: var(--s1);
  box-shadow: inset 0 0 0 1px var(--ctx-b);
}
.hero::before {
  content: ""; position: absolute; z-index: -1; top: -55%; right: -35%; width: 95%; height: 130%;
  background: radial-gradient(closest-side, var(--ctx-a), transparent); pointer-events: none;
}
.hero-k { font-size: 15px; font-weight: 600; color: var(--t2); }
.hero-day {
  margin: 4px 0 12px; font-family: var(--font-num); font-size: 80px; font-weight: 700; line-height: 0.88; letter-spacing: -0.01em;
  color: var(--ctx); text-shadow: 0 0 34px var(--ctx-a); overflow-wrap: anywhere;
}
.hero-day.sm { font-size: 56px; margin-bottom: 6px; }
.hero-meta { margin: 0; font-size: 15px; line-height: 1.4; }
.hero-ex { margin: 6px 0 0; font-size: 14px; line-height: 1.4; color: var(--t2); }
.hero .btn.lg { margin-top: 18px; }
.hero-alt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--t2); }
.hero-alt > span { margin-right: 2px; }
.hero-alt .chip { padding: 0 13px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 2px 0 4px; }
.hero-stats .num { display: block; font-size: 28px; line-height: 1.1; }
.hero-stats label { font-size: 12px; color: var(--t2); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.wd-l { font-size: 12px; font-weight: 600; color: var(--t2); }
.wd-c {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%;
  background: var(--s2); color: var(--t2); font-family: var(--font-num); font-size: 18px; font-weight: 600;
}
.wd-c.done { background: var(--dc); color: #000; font-weight: 700; box-shadow: 0 0 16px -4px var(--dc); }
.wd-c.today { color: var(--t1); box-shadow: 0 0 0 2px var(--chalk); }
.wd-c.done.today { color: #000; box-shadow: 0 0 0 2px var(--s1), 0 0 0 4px var(--chalk); }
.wd.fut .wd-c { background: transparent; color: var(--t3); box-shadow: inset 0 0 0 1px var(--s3); }
.wd-r { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 6px; background: var(--teal); box-shadow: 0 0 0 2px var(--s1); }
.wd-t { height: 14px; font-size: 11px; color: var(--t2); white-space: nowrap; }

.body-card { display: flex; align-items: center; gap: 12px; }
.bc-main { flex: 1; min-width: 0; text-align: left; }
.bc-v { margin-top: 2px; font-size: 42px; line-height: 1.05; }
.bc-v small { margin-left: 4px; font-family: var(--font-ui); font-size: 16px; font-weight: 500; color: var(--t2); }
.bc-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.rec-btns { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
.rec-btns::-webkit-scrollbar { display: none; }

/* ---------- workout ---------- */
.ctx-wrap::before {
  content: ""; position: fixed; z-index: -1; left: 0; right: 0; top: 0; height: 340px; pointer-events: none;
  background: radial-gradient(90% 100% at 50% -10%, var(--ctx-b), transparent 70%);
}
.wk-top { padding: 18px 0 8px; text-align: center; }
.wk-clock { font-size: 68px; line-height: 1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.wk-stats { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
.wk-stats div { display: flex; flex-direction: column; align-items: center; }
.wk-stats .num { font-size: 24px; line-height: 1.1; }
.wk-stats label { font-size: 12px; color: var(--t2); }
.rest-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; margin-top: 14px; padding: 0 14px; border-radius: 17px; background: var(--ctx-b); font-size: 14px; color: var(--t2); }
.rest-chip svg.i { width: 17px; height: 17px; color: var(--ctx); }
.rest-chip span:first-of-type { min-width: 34px; font-family: var(--font-num); font-size: 19px; font-weight: 600; color: var(--t1); font-variant-numeric: tabular-nums; }
.rest-chip.sm { margin: 0; flex: none; }

.ex-card { position: relative; margin-top: 10px; border-radius: 20px; background: var(--s1); }
.ex-card.has { box-shadow: inset 3px 0 0 var(--ctx); }
.ex-main { display: block; width: 100%; padding: 14px 54px 14px 16px; border-radius: 20px; text-align: left; }
.ex-main:active { background: var(--s2); }
.ex-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ex-titles { min-width: 0; }
.ex-name { font-size: 18px; font-weight: 600; line-height: 1.25; }
.ex-mus { margin-top: 2px; font-size: 13px; color: var(--t2); }
.ex-count { display: inline-flex; align-items: center; gap: 3px; flex: none; height: 26px; padding: 0 9px 0 7px; border-radius: 13px; background: var(--ctx); color: #000; font-family: var(--font-num); font-size: 17px; font-weight: 700; }
.ex-count svg.i { width: 14px; height: 14px; stroke-width: 3.2; }
.ex-go { display: flex; color: var(--t3); }
.ex-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sp { display: inline-flex; align-items: center; gap: 3px; height: 30px; padding: 0 10px; border-radius: 9px; background: var(--s2); font-family: var(--font-num); font-size: 18px; font-weight: 600; }
.sp small { font-size: 13px; color: var(--t2); }
.sp.pr { background: rgba(255, 197, 61, 0.15); color: var(--gold); }
.sp.pr small { color: var(--gold); }
.sp svg.i { width: 14px; height: 14px; }
.ex-last { margin-top: 8px; font-size: 14px; color: var(--t2); }
.ex-more { position: absolute; top: 7px; right: 5px; }
.add-ex { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 62px; margin-top: 12px; border-radius: 20px; border: 1.5px dashed var(--line-2); font-size: 17px; font-weight: 600; }
.add-ex:active { background: var(--s1); }

/* set logger */
.lg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 2px; }
.lg-title { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -0.015em; }
.lg-sub { margin-top: 3px; font-size: 14px; color: var(--t2); }
.ex-note { display: flex; align-items: flex-start; gap: 8px; width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--s1); color: var(--t2); font-size: 14px; line-height: 1.4; text-align: left; }
.ex-note svg.i { width: 17px; height: 17px; margin-top: 1px; }
.last { margin-top: 16px; }
.last-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 8px; font-size: 14px; color: var(--t2); }
.last-chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.last-chips::-webkit-scrollbar { display: none; }
.lchip { flex: none; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 86px; height: 58px; padding: 0 14px; border-radius: 14px; background: var(--s1); box-shadow: inset 0 0 0 1.5px transparent; text-align: left; }
.lchip b { font-size: 21px; line-height: 1.1; }
.lchip b small { margin: 0 1px; font-size: 14px; color: var(--t2); }
.lchip > small { font-size: 12px; color: var(--t2); }
.lchip.next { box-shadow: inset 0 0 0 1.5px var(--line-2); }
.lchip.copied { box-shadow: inset 0 0 0 2px var(--ctx); }
.editor { margin-top: 16px; padding: 16px; border-radius: 24px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--ctx-b); }
.ed-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ed-set { font-size: 30px; font-weight: 700; color: var(--ctx); }
.ed-hint { font-size: 14px; color: var(--t2); text-align: right; }
.ed-lbl { display: flex; justify-content: space-between; gap: 8px; margin: 14px 2px 7px; font-size: 13px; color: var(--t2); }
.ed-lbl span:last-child { text-align: right; }
.eff { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.eff.rir { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.eff button { height: 50px; border-radius: 13px; background: var(--s2); font-family: var(--font-num); font-size: 21px; font-weight: 600; }
.sheet .eff button { background: var(--s2); }
.eff button.on { background: var(--ctx); color: #000; }
.ed-pr { display: none; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 197, 61, 0.12); color: var(--gold); font-size: 14px; font-weight: 600; }
.ed-pr.on { display: flex; animation: rise 0.25s ease-out; }
.ed-pr svg.i { width: 18px; height: 18px; }
.plates { display: flex; align-items: center; gap: 10px; min-height: 42px; margin-top: 10px; font-size: 13px; line-height: 1.3; color: var(--t2); }
.plates svg { flex: none; }
.set-row, .wd-set { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 16px; text-align: left; }
.set-n { font-size: 18px; color: var(--t2); }
.set-v { font-size: 25px; white-space: nowrap; }
.set-v small { margin: 0 3px 0 2px; font-family: var(--font-ui); font-size: 14px; font-weight: 500; color: var(--t2); }
.set-e { font-size: 13px; color: var(--t2); white-space: nowrap; }
.set-edit { display: flex; color: var(--t3); }
.set-edit svg.i { width: 18px; height: 18px; }
.badge-pr { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 8px; background: rgba(255, 197, 61, 0.15); color: var(--gold); font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge-pr svg.i { width: 14px; height: 14px; }

/* picker */
.pk-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; text-align: left; }
.pk-check { flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--s3); color: transparent; }
.pk-check svg.i { width: 16px; height: 16px; stroke-width: 3; }
.pk-row.on .pk-check { background: var(--chalk); color: #000; box-shadow: none; }

/* finish summary */

  display: flex; align-items: center; justify-content: center; width: 78px; height: 78px; margin: 0 auto 14px;
  border-radius: 39px; background: var(--ctx); color: #000; box-shadow: 0 0 46px var(--ctx-a);

}
.sum-ic svg.i { width: 40px; height: 40px; stroke-width: 3; }
.sum-hero h1 { margin: 0; font-size: 30px; letter-spacing: -0.015em; }
.sum-hero p { margin: 6px 0 0; color: var(--t2); }
.weigh { box-shadow: inset 0 0 0 1px var(--ctx-b); }

/* ---------- history ---------- */
.hist-sum { margin: 14px 4px 0; font-size: 14px; color: var(--t2); }
.month-h { margin: 26px 4px 2px; font-size: 15px; font-weight: 600; color: var(--t2); }
.hcard { display: block; width: 100%; margin-top: 10px; padding: 14px 16px; border-radius: 20px; background: var(--s1); text-align: left; }
.hcard:active { background: #232326; }
.hc-top { display: flex; align-items: center; gap: 10px; }
.hc-date { font-size: 16px; font-weight: 600; }
.hc-time { margin-left: auto; font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums; }
.live { padding: 2px 8px; border-radius: 10px; background: var(--up); color: #000; font-size: 12px; font-weight: 700; }
.hc-meta { display: flex; gap: 22px; margin-top: 12px; }

.hc-meta .num { font-size: 22px; line-height: 1.1; }

.hc-meta .gold .num { color: var(--gold); }
.hc-ex { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }

.hc-line span { flex: 1; min-width: 0; overflow: hidden; color: var(--t2); white-space: nowrap; text-overflow: ellipsis; }
.hc-more { font-size: 13px; color: var(--t3); }
.gold-i { display: inline-flex; color: var(--gold); }
.gold-i svg.i { width: 15px; height: 15px; }
.hc-rec { margin-top: 10px; font-size: 15px; }
.hc-rec .num { font-size: 22px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--dc); color: #000; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill.rec { background: rgba(43, 212, 193, 0.16); color: var(--teal); }
.pill svg.i { width: 15px; height: 15px; }

.wd-head { padding: 6px 4px 14px; }
.wd-head p { margin: 4px 0 0; color: var(--t2); }
.wd-ex-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; text-align: left; }
.wd-ex-h svg.i { width: 16px; height: 16px; vertical-align: -3px; }
.wd-ex-h b { font-size: 18px; color: var(--t1); }
.wd-ex-h .panel-s { text-align: left; margin-top: 2px; }
.wd-ex-h > span { flex: none; white-space: nowrap; }
.wd-sets { margin-top: 6px; }
.wd-set { padding: 4px 0; min-height: 46px; border-top: 1px solid var(--hair); }
.vol-pr { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--gold); }
.vol-pr svg.i { width: 15px; height: 15px; }
.note-text { white-space: pre-wrap; line-height: 1.5; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.chart svg { display: block; overflow: visible; }
.chart .ax { fill: #8E8E93; font-family: var(--font-ui); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .ax-on { fill: var(--t1); font-weight: 600; }
.chart-empty { display: flex; align-items: center; justify-content: center; height: 100%; border: 1px dashed var(--s3); border-radius: 12px; font-size: 14px; color: var(--t2); }
.tip {
  position: absolute; z-index: 2; top: 2px; left: 0; padding: 8px 11px; border-radius: 12px;
  background: rgba(44, 44, 46, 0.96); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
  font-size: 12.5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.12s;
}
.tip.on { opacity: 1; }
.tip-t { margin-bottom: 3px; font-size: 12px; color: var(--t2); }
.tip-r { display: flex; align-items: center; gap: 7px; line-height: 1.5; color: var(--t2); }
.tip-r b { font-family: var(--font-num); font-size: 18px; font-weight: 600; color: var(--t1); }
.tip-k { width: 10px; height: 10px; border-radius: 3px; }
.tip-k.ln { width: 12px; height: 3px; border-radius: 2px; }
.str-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 14px; color: var(--t2); }
.str-legend span { display: inline-flex; align-items: center; gap: 6px; }
.str-legend i { width: 14px; height: 3px; border-radius: 2px; }
.str-legend b { color: var(--t1); font-size: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--t2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.legend i.ln { width: 14px; height: 3px; border-radius: 2px; }
.ring-key { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 5px; box-shadow: inset 0 0 0 2px var(--gold); vertical-align: -1px; }

.year-rows { margin-top: 12px; border-top: 1px solid var(--line); }
.yr { display: grid; grid-template-columns: 48px auto 1fr; align-items: baseline; gap: 12px; padding-top: 10px; }
.yr-y { font-weight: 600; }
.yr .num { font-size: 21px; }
.yr .muted { font-size: 13px; text-align: right; }
.bt-row { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.bt-row:last-child { border-bottom: 0; }
.bt-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.bt-v { font-size: 26px; }
.bt-v small { font-family: var(--font-ui); font-size: 13px; color: var(--t2); }
.bt-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; font-size: 13px; color: var(--t2); }
.bt-meta b { font-weight: 600; color: var(--t1); }
.hb { display: grid; grid-template-columns: 92px minmax(0, 1fr) 46px; align-items: center; gap: 10px; min-height: 32px; }
.hb-l { overflow: hidden; font-size: 14px; white-space: nowrap; text-overflow: ellipsis; }
.hb-track { height: 12px; overflow: hidden; border-radius: 0 6px 6px 0; background: var(--s2); }
.hb-fill { height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: #E5E5EA; }
.bt .hb-track { height: 10px; }
.hb-v { font-size: 19px; text-align: right; }
.b3 { display: flex; gap: 28px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.rr-row { display: grid; grid-template-columns: 1fr 1fr auto; align-items: baseline; gap: 8px; min-height: 38px; border-bottom: 1px solid var(--hair); }
.rr-row:last-child { border-bottom: 0; }
.rr-w, .rr-r { font-size: 21px; }
.rr small { font-family: var(--font-ui); font-size: 13px; color: var(--t2); }
.mg-head, .mg-row { display: grid; grid-template-columns: minmax(0, 1.25fr) 0.85fr 0.95fr 1.15fr; align-items: center; gap: 8px; }
.mg-head { padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--t2); }
.mg-row { min-height: 42px; border-bottom: 1px solid var(--hair); font-size: 15px; }
.mg-row .num { font-size: 19px; }
.mg-row small { font-family: var(--font-ui); font-size: 12px; color: var(--t2); }
.mg-m { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mg-last { font-size: 13px; color: var(--t2); }
.mg-last.fresh { color: var(--t1); }

.heat-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.heat-wrap::-webkit-scrollbar { display: none; }
.heat { display: grid; grid-template-rows: 16px repeat(7, 13px); grid-auto-columns: 13px; grid-auto-flow: column; gap: 3px; width: max-content; }
.hm { overflow: visible; font-size: 10.5px; line-height: 16px; color: var(--t2); white-space: nowrap; }
.hc { position: relative; width: 13px; height: 13px; border-radius: 3.5px; background: #2C2C2E; }
.hc.l1 { background: #5C430D; }
.hc.l2 { background: #8A650D; }
.hc.l3 { background: #BE8B0F; }
.hc.l4 { background: #FFBE2C; }
.hc.future { background: transparent; }
.hc.rec::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--teal); }
.hc.today { box-shadow: 0 0 0 1.5px var(--chalk); }
.heat-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--t2); }
.heat-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.heat-legend span { margin: 0 2px; }
.heat-legend .rec-key { position: relative; margin-left: 12px; background: #2C2C2E; }
.rec-key::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--teal); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; text-align: center; }
.cal-nav .panel-t { justify-content: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal-h { padding-bottom: 2px; font-size: 12px; font-weight: 600; color: var(--t2); text-align: center; }
.cal-d {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  aspect-ratio: 1 / 1.08; border-radius: 12px; background: var(--s2); color: var(--t2);
  font-family: var(--font-num); font-size: 17px; font-weight: 600;
}
.cal-d:disabled { cursor: default; }
.cal-d.blank { background: transparent; }
.cal-d.done { background: var(--dc); color: #000; }
.cal-d.today { color: var(--t1); box-shadow: inset 0 0 0 2px var(--chalk); }
.cal-d.done.today { color: #000; }
.cal-d.fut { background: transparent; color: var(--t3); }
.cal-d .ct { font-family: var(--font-ui); font-size: 9.5px; font-weight: 700; }
.cal-r { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 4px; background: var(--teal); }
.cal-d.done .cal-r { box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.35); }

/* body */
.m-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 12px; }
.m-tile { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--s2); text-align: left; }
.m-tile.on { box-shadow: inset 0 0 0 2px var(--teal); }
.m-tile .num { font-size: 23px; line-height: 1.15; }

/* settings */
.settings .group + .foot-note { margin-bottom: 4px; }
.about { margin: 30px 8px 8px; font-size: 13px; line-height: 1.5; color: var(--t2); }
.about b { color: var(--t1); }
.about p { margin: 4px 0 0; }

/* ---------- sheets, dialogs, toasts ---------- */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.58); opacity: 0; transition: opacity 0.22s; }
.backdrop.in { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  display: flex; flex-direction: column; max-width: 640px; max-height: 92vh; max-height: 92dvh; margin: 0 auto;
  border-radius: 26px 26px 0 0; background: var(--s1); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  transform: translateY(102%); transition: transform 0.3s cubic-bezier(0.2, 0.85, 0.25, 1);
}
.sheet.in { transform: none; }
.sheet.tall { height: 92vh; height: 92dvh; }
.grab { position: absolute; top: 6px; left: 50%; width: 38px; height: 5px; border-radius: 3px; background: var(--s3); transform: translateX(-50%); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 12px 6px 20px; }
.sheet-t { overflow: hidden; font-size: 20px; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
.sheet-b { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 20px 20px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet-f { display: flex; gap: 10px; padding: 12px 20px calc(12px + var(--safe-b)); border-top: 1px solid var(--hair); }
.sheet .chips:not(.wrap) { margin: 0 -20px; padding: 2px 20px; }
.sheet .stepper input { background: var(--bg); }
.dlg-bd { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.62); opacity: 0; transition: opacity 0.18s; }
.dlg-bd.in { opacity: 1; }
.dialog {
  position: fixed; left: 50%; top: 50%; z-index: 61; width: min(360px, calc(100vw - 40px)); padding: 22px 18px 16px;
  border-radius: 22px; background: #232326; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  opacity: 0; transform: translate(-50%, -47%) scale(0.97); transition: opacity 0.18s, transform 0.18s;
}
.dialog.in { opacity: 1; transform: translate(-50%, -50%); }
.dialog h3 { margin: 0 0 6px; font-size: 19px; }
.dialog p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--t2); }
.dialog .field { background: var(--bg); }
.dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.dlg-actions.stack { grid-template-columns: 1fr; gap: 8px; }
.dialog .btn { background: var(--s3); }
.dialog .btn.primary { background: var(--chalk); }
.dialog .btn.danger-fill { background: var(--down); }
.dialog .btn.plain { background: transparent; }

/* Toasts drop in from the top so they never cover the Log button, tab bar or sheet buttons.
   Taps pass through them except on their own action button. */
#toasts { position: fixed; left: 0; right: 0; top: calc(var(--safe-t) + 8px); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; min-height: 54px; padding: 8px 8px 8px 16px;
  border-radius: 16px; background: #2C2C2E; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55); font-size: 15px; line-height: 1.35;
  pointer-events: none; opacity: 0; transform: translateY(-14px); transition: opacity 0.22s, transform 0.22s;
}
.toast.in { opacity: 1; transform: none; }
.toast > svg.i { color: var(--t2); }
.toast.pr { background: #2E2710; box-shadow: inset 0 0 0 1px rgba(255, 197, 61, 0.5), 0 12px 32px rgba(0, 0, 0, 0.55); font-weight: 600; }
.toast.pr > svg.i { color: var(--gold); }
.toast.error { background: #3A1715; }
.t-msg { flex: 1; min-width: 0; }
.t-act { pointer-events: auto; height: 38px; padding: 0 14px; border-radius: 11px; background: rgba(255, 255, 255, 0.1); color: var(--chalk); font-weight: 700; }

/* ---------- motion ---------- */
@keyframes pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes flash { from { background: var(--ctx-a); } to { background: transparent; } }
@keyframes prglow { 0% { background: rgba(255, 197, 61, 0.35); } 100% { background: transparent; } }
.flash { animation: flash 1.1s ease-out; }
.prglow { animation: prglow 1.8s ease-out; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---------- larger screens ---------- */
@media (min-width: 700px) {
  .hero-day { font-size: 96px; }
  .tiles.t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 359px) {
  .hero-day { font-size: 66px; }
  .tile-v { font-size: 28px; }
  .stepper { grid-template-columns: 60px minmax(0, 1fr) 60px; }
  .hb { grid-template-columns: 78px minmax(0, 1fr) 42px; }
}

<script>
/* ==========================================================================
   01 · CORE
   Constants, small utilities, date helpers, number/date formatting, icons.
   Everything here is pure (no DOM state, no app state).
   ========================================================================== */
'use strict';

const APP = { name: 'Gym Tracker', version: '1.0.0', dataVersion: 1 };

/** localStorage keys */
const KEY = 'gymtracker:data';
const KEY_PREV = 'gymtracker:data:prev';          // once-a-day safety snapshot
const KEY_PREV_DAY = 'gymtracker:data:prev:day';
const KEY_CORRUPT = 'gymtracker:data:corrupt';    // unreadable data is parked here, never deleted

const DAY = 86400000;

/* Day-type colours. Validated as a categorical set on the dark surface
   (lightness band, chroma floor, colour-blind separation, contrast).
   Slots 1–3 pass all-pairs; 4–6 are for extra custom day types. */
const DAY_COLORS = ['#F15F12', '#3889FC', '#EA1596', '#14A932', '#9F55FC', '#AC9012'];
const GOLD = '#FFC53D';     // records + training heat
const TEAL = '#2BD4C1';     // recovery
const CHALK = '#F5F5F2';    // neutral accent
const UP = '#30D158';
const DOWN = '#FF453A';
const HEAT = ['#2C2C2E', '#5C430D', '#8A650D', '#BE8B0F', '#FFBE2C']; // sequential, dark → bright

const DEFAULT_MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms',
  'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Core'];

/* Only basic lifts are pre-filled; the library grows from what you log.
   [name, muscles (first = primary), suggested day, flags] */
const DEFAULT_EXERCISES = [
  ['Bench Press', ['Chest', 'Triceps', 'Shoulders'], 'Push', { barbell: true }],
  ['Incline Dumbbell Press', ['Chest', 'Shoulders', 'Triceps'], 'Push', {}],
  ['Overhead Press', ['Shoulders', 'Triceps'], 'Push', { barbell: true }],
  ['Lateral Raise', ['Shoulders'], 'Push', {}],
  ['Triceps Pushdown', ['Triceps'], 'Push', {}],
  ['Dips', ['Chest', 'Triceps'], 'Push', { bw: true }],
  ['Deadlift', ['Back', 'Hamstrings', 'Glutes'], 'Pull', { barbell: true }],
  ['Pull-Up', ['Back', 'Biceps'], 'Pull', { bw: true }],
  ['Barbell Row', ['Back', 'Biceps'], 'Pull', { barbell: true }],
  ['Lat Pulldown', ['Back', 'Biceps'], 'Pull', {}],
  ['Face Pull', ['Shoulders', 'Back'], 'Pull', {}],
  ['Barbell Curl', ['Biceps'], 'Pull', { barbell: true }],
  ['Squat', ['Quads', 'Glutes'], 'Legs', { barbell: true }],
  ['Romanian Deadlift', ['Hamstrings', 'Glutes'], 'Legs', { barbell: true }],
  ['Leg Press', ['Quads', 'Glutes'], 'Legs', {}],
  ['Leg Curl', ['Hamstrings'], 'Legs', {}],
  ['Calf Raise', ['Calves'], 'Legs', {}],
];

/** Body measurements (cm) */
const MEASURES = [
  ['neck', 'Neck'], ['chest', 'Chest'], ['waist', 'Waist'], ['hips', 'Hips'],
  ['arm', 'Arm'], ['thigh', 'Thigh'], ['calf', 'Calf'],
];

/** PR flags on a set (bitmask) */
const PR = { W: 1, R: 2, E: 4 };
const PR_LABEL = { 1: 'Weight PR', 2: 'Rep PR', 4: 'e1RM PR' };

/* ---------- tiny utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (v, d = 1) => { const p = 10 ** d; return Math.round(v * p) / p; };
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const avg = (arr) => (arr.length ? sum(arr) / arr.length : 0);
/** "1 workout", "3 workouts" */
const pl = (n, word, plural) => `${typeof n === 'number' ? n.toLocaleString('en-US') : n} ${n === 1 ? word : plural || word + 's'}`;
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC_MAP[c]);

/** Parse user input like "82,5" or " 80 " → number, or null when empty/invalid. */
function parseNum(v) {
  if (v == null) return null;
  const t = String(v).trim().replace(/\s/g, '').replace(',', '.');
  if (t === '' || t === '-' || t === '.') return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/** Seeded PRNG (used for demo data so it is reproducible). */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** '#RRGGBB' + alpha → 'rgba(...)' */
function hexA(hex, a) {
  const h = String(hex || '#ffffff').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ---------- dates (all local time; weeks start on Monday) ---------- */
const startOfDay = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const keyToTs = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const weekStart = (ts) => { const d = new Date(startOfDay(ts)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const monthStart = (ts) => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const monthKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const addMonths = (ts, n) => { const d = new Date(monthStart(ts)); d.setMonth(d.getMonth() + n); return d.getTime(); };
/** Whole calendar days from a to b (DST-safe). */
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);
const isToday = (ts) => dayKey(ts) === dayKey(Date.now());

/** Value for <input type="date"> / "time" */
const toDateInput = (ts) => dayKey(ts);
const toTimeInput = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function fromDateTimeInputs(dateStr, timeStr, fallback) {
  if (!dateStr) return fallback;
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mm] = (timeStr || '00:00').split(':').map(Number);
  const t = new Date(y, (m || 1) - 1, d || 1, hh || 0, mm || 0).getTime();
  return Number.isFinite(t) ? t : fallback;
}

/* ---------- formatting (English UI, kg) ---------- */
const fmt = {
  /** 82.5 → "82.5", 80 → "80", 1.25 → "1.25" */
  n(v, max = 2) {
    if (v == null || !Number.isFinite(+v)) return '–';
    return (+v).toLocaleString('en-US', { maximumFractionDigits: max, useGrouping: false });
  },
  int(v) { return v == null || !Number.isFinite(+v) ? '–' : Math.round(v).toLocaleString('en-US'); },
  /** Session volume in kg: "12,450 kg" */
  kg(v) { return `${fmt.int(v)} kg`; },
  /** Aggregate volume in tonnes: "48.2 t" / "1,204 t" */
  t(kg) {
    if (!kg) return '0 t';
    const t = kg / 1000;
    return `${t >= 100 ? Math.round(t).toLocaleString('en-US') : t.toLocaleString('en-US', { maximumFractionDigits: 1, minimumFractionDigits: t < 10 ? 1 : 0 })} t`;
  },
  /** Compact number for axes: 12400 → "12.4k" */
  compact(v) {
    const a = Math.abs(v);
    if (a >= 1e6) return `${round(v / 1e6, 1)}M`;
    if (a >= 1e4) return `${round(v / 1e3, 0)}k`;
    if (a >= 1e3) return `${round(v / 1e3, 1)}k`;
    return fmt.n(v, 1);
  },
  pct(v, d = 1) { return `${v > 0 ? '+' : ''}${round(v, d)}%`; },
  date(ts) { return new Date(ts).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); },
  dateLong(ts) { return new Date(ts).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); },
  dateY(ts) { return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); },
  dayMonth(ts) { return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); },
  month(ts) { return new Date(ts).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); },
  monthS(ts) { return new Date(ts).toLocaleDateString('en-GB', { month: 'short' }); },
  time(ts) { return new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); },
  /** 4380000 → "1h 13m" */
  dur(ms) {
    if (!(ms > 0)) return '0m';
    if (ms < 60000) return '<1m';
    const m = Math.round(ms / 60000);
    const h = Math.floor(m / 60);
    return h ? `${h}h ${pad(m % 60)}m` : `${m}m`;
  },
  /** Stopwatch: "4:05", "42:10", "1:02:10" */
  clock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  },
  rel(ts) {
    const d = daysBetween(ts, Date.now());
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d < 7) return `${d} days ago`;
    if (d < 14) return 'last week';
    if (d < 60) return `${Math.round(d / 7)} weeks ago`;
    return fmt.dateY(ts);
  },
};

/* ==========================================================================
   02 · STORAGE & STATE
   - All data lives in one JSON document in localStorage (works offline,
     no account, no backend).
   - Every read/write is wrapped in try/catch. If storage is blocked or full,
     the app keeps running from memory and shows a warning instead of crashing.
   - A once-a-day snapshot is kept as a fallback in case the main copy is ever
     unreadable.
   ========================================================================== */

const Store = {
  available: false,   // localStorage usable?
  error: null,        // last error (shown in Settings / banner)
  bytes: 0,           // size of last successful save
  failed: false,      // last write failed (quota, blocked, …)

  /** Check once whether localStorage can be used at all. */
  probe() {
    try {
      const k = '__gymtracker_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      this.available = true;
    } catch (e) {
      this.available = false;
      this.error = e;
    }
    return this.available;
  },

  /** Read the saved document. Never throws. */
  read() {
    if (!this.available) return { data: null };
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { this.error = e; return { data: null, failed: true }; }
    if (!raw) return { data: null };
    try {
      this.bytes = raw.length;
      return { data: JSON.parse(raw) };
    } catch (e) {
      // Main copy unreadable: park it (never silently overwrite) and fall back to the snapshot.
      try { localStorage.setItem(KEY_CORRUPT, raw); } catch (_) { /* ignore */ }
      try {
        const prev = localStorage.getItem(KEY_PREV);
        if (prev) return { data: JSON.parse(prev), recovered: true };
      } catch (_) { /* ignore */ }
      return { data: null, corrupt: true };
    }
  },

  /** Write the whole document. Returns true on success. Never throws. */
  write(state) {
    if (!this.available) { this.failed = true; return false; }
    let json;
    try { json = JSON.stringify(state); } catch (e) { this.error = e; this.failed = true; return false; }
    try {
      localStorage.setItem(KEY, json);
    } catch (e) {
      // Quota: drop the snapshot copy and retry once.
      try {
        localStorage.removeItem(KEY_PREV);
        localStorage.setItem(KEY, json);
      } catch (e2) {
        this.error = e2; this.failed = true;
        return false;
      }
    }
    this.bytes = json.length;
    this.failed = false;
    this.error = null;
    return true;
  },

  /** Keep yesterday's copy as a fallback (once per day, best effort). */
  snapshot() {
    if (!this.available) return;
    try {
      const today = dayKey(Date.now());
      if (localStorage.getItem(KEY_PREV_DAY) === today) return;
      const cur = localStorage.getItem(KEY);
      if (cur) {
        localStorage.setItem(KEY_PREV, cur);
        localStorage.setItem(KEY_PREV_DAY, today);
      }
    } catch (_) { /* snapshot is optional */ }
  },

  hasCorruptCopy() {
    try { return !!localStorage.getItem(KEY_CORRUPT); } catch (_) { return false; }
  },
  readCorruptCopy() {
    try { return localStorage.getItem(KEY_CORRUPT) || ''; } catch (_) { return ''; }
  },
  dropCorruptCopy() {
    try { localStorage.removeItem(KEY_CORRUPT); } catch (_) { /* ignore */ }
  },
};

/* ---------- default document ---------- */
function seedExercises() {
  const now = Date.now();
  return DEFAULT_EXERCISES.map(([name, muscles, tag, flags], i) => ({
    id: 'ex' + (i + 1).toString(36) + Math.random().toString(36).slice(2, 6),
    name, muscles: muscles.slice(), tag,
    bw: !!flags.bw, barbell: !!flags.barbell,
    notes: '', archived: false, created: now,
  }));
}

function defaultSettings() {
  return {
