    sex: 'm',                     // only used for the optional tape-measure body-fat estimate
    weightStep: 2.5,
    effort: 'rpe',                // 'rpe' | 'rir' | 'off'
    e1rmFormula: 'epley',         // 'epley' | 'brzycki' | 'avg'
    e1rmUseEffort: false,         // add reps-in-reserve to reps for e1RM
    weeklyGoal: 5,                // workouts per week for the streak
    prefillFromLast: true,        // new workout pre-loads exercises of the last same-type workout
    weighInPrompt: true,
    keepAwake: true,
    showPlates: true,
    barWeight: 20,
    plates: [25, 20, 15, 10, 5, 2.5, 1.25],
    dayTypes: [
      { name: 'Push', color: DAY_COLORS[0], rot: true },
      { name: 'Pull', color: DAY_COLORS[1], rot: true },
      { name: 'Legs', color: DAY_COLORS[2], rot: true },
    ],
    recoveryKinds: ['Sauna', 'Rehab', 'Other'],
    muscles: DEFAULT_MUSCLES.slice(),
  };
}

function defaultState() {
  return {
    v: APP.dataVersion,
    settings: defaultSettings(),
    exercises: seedExercises(),
    workouts: [],
    recovery: [],
    body: [],
    activeId: null,
    meta: { created: Date.now(), lastBackup: null, backupSnooze: null, persist: null, demoHeight: false },
  };
}

/* ---------- migration / sanitising ----------
   Accepts anything (old versions, imports, half-broken JSON) and returns a
   valid document. Unknown fields are kept. */
const numOr = (v, d = null) => { const n = typeof v === 'string' ? parseNum(v) : v; return Number.isFinite(n) ? n : d; };
/** IDs end up in HTML attributes, so only plain characters are accepted (imports are untrusted). */
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
const HEX_COLOR = /^#[0-9a-fA-F]{6}$/;

function migrate(input) {
  const base = defaultState();
  if (!input || typeof input !== 'object') return base;
  const d = input;
  const out = { ...base, ...d };
  out.settings = { ...base.settings, ...(d.settings && typeof d.settings === 'object' ? d.settings : {}) };
  out.meta = { ...base.meta, ...(d.meta && typeof d.meta === 'object' ? d.meta : {}) };

  const st = out.settings;
  if (!Array.isArray(st.dayTypes) || !st.dayTypes.length) st.dayTypes = base.settings.dayTypes;
  st.dayTypes = st.dayTypes.filter((t) => t && t.name).map((t, i) => ({
    name: String(t.name).slice(0, 40), color: HEX_COLOR.test(t.color) ? t.color : DAY_COLORS[i % DAY_COLORS.length], rot: t.rot !== false,
  }));
  st.recoveryKinds = Array.isArray(st.recoveryKinds) && st.recoveryKinds.length ? st.recoveryKinds.filter(Boolean).map((k) => String(k).slice(0, 40)) : base.settings.recoveryKinds.slice();
  st.muscles = Array.isArray(st.muscles) && st.muscles.length ? st.muscles.filter(Boolean).map((m) => String(m).slice(0, 40)) : base.settings.muscles.slice();
  st.plates = Array.isArray(st.plates) ? st.plates.map((x) => numOr(x)).filter((x) => x > 0) : base.settings.plates.slice();
  st.weightStep = numOr(st.weightStep, 2.5) || 2.5;
  st.weeklyGoal = clamp(numOr(st.weeklyGoal, 5) || 5, 1, 7);
  st.barWeight = numOr(st.barWeight, 20) ?? 20;
  st.heightCm = numOr(st.heightCm, null);
  if (!['rpe', 'rir', 'off'].includes(st.effort)) st.effort = 'rpe';
  if (!['epley', 'brzycki', 'avg'].includes(st.e1rmFormula)) st.e1rmFormula = 'epley';
  if (st.sex !== 'f') st.sex = 'm';

  // Exercises (unsafe ids are replaced and remapped)
  const exRemap = new Map();
  const fixExId = (id) => {
    if (SAFE_ID.test(id)) return id;
    if (!exRemap.has(id)) exRemap.set(id, uid());
    return exRemap.get(id);
  };
  out.exercises = (Array.isArray(d.exercises) ? d.exercises : base.exercises)
    .filter((e) => e && e.id && e.name)
    .map((e) => ({
      notes: '', archived: false, bw: false, barbell: false, tag: null, created: Date.now(), ...e,
      id: fixExId(e.id),
      name: String(e.name).slice(0, 80),
      notes: String(e.notes || ''),
      bw: !!e.bw, barbell: !!e.barbell, archived: !!e.archived,
      muscles: Array.isArray(e.muscles) ? e.muscles.filter(Boolean).map(String) : (e.muscle ? [String(e.muscle)] : []),
    }));

  out.workouts = (Array.isArray(d.workouts) ? d.workouts : [])
    .filter((w) => w && w.id && Number.isFinite(+w.start))
    .map((w) => ({
      ...w,
      id: SAFE_ID.test(w.id) ? w.id : uid(),
      note: String(w.note || ''),
      type: String(w.type || 'Workout').slice(0, 40),
      start: +w.start,
      end: w.end == null || !Number.isFinite(+w.end) ? null : +w.end,
      entries: (Array.isArray(w.entries) ? w.entries : [])
        .filter((e) => e && e.exId)
        .map((e) => ({
          id: SAFE_ID.test(e.id) ? e.id : uid(),
          exId: fixExId(e.exId),
          sets: (Array.isArray(e.sets) ? e.sets : [])
            .filter((x) => x && Number.isFinite(numOr(x.w)) && Number.isFinite(numOr(x.r)))
            .map((x) => ({ w: numOr(x.w), r: numOr(x.r), rpe: numOr(x.rpe, null), t: numOr(x.t, +w.start) })),
        })),
    }));

  out.recovery = (Array.isArray(d.recovery) ? d.recovery : [])
    .filter((r) => r && r.id && Number.isFinite(+r.date))
    .map((r) => ({ ...r, id: SAFE_ID.test(r.id) ? r.id : uid(), kind: String(r.kind || 'Other').slice(0, 40), date: +r.date, min: numOr(r.min, null), note: String(r.note || '') }));

  out.body = (Array.isArray(d.body) ? d.body : [])
    .filter((b) => b && b.id && Number.isFinite(+b.date))
    .map((b) => {
      const m = {};
      if (b.m && typeof b.m === 'object') for (const [k] of MEASURES) { const v = numOr(b.m[k]); if (v != null) m[k] = v; }
      return { ...b, id: SAFE_ID.test(b.id) ? b.id : uid(), date: +b.date, weight: numOr(b.weight, null), bf: numOr(b.bf, null), m, note: String(b.note || '') };
    });

  // Referential integrity: every logged exercise must exist in the library.
  const ids = new Set(out.exercises.map((e) => e.id));
  for (const w of out.workouts) for (const e of w.entries) {
    if (!ids.has(e.exId)) {
      out.exercises.push({ id: e.exId, name: 'Unnamed exercise', muscles: [], tag: null, bw: false, barbell: false, notes: '', archived: false, created: Date.now() });
      ids.add(e.exId);
    }
  }
  // Custom day types / muscles that appear in data but not in settings.
  for (const w of out.workouts) if (!st.dayTypes.some((t) => t.name === w.type)) st.dayTypes.push({ name: w.type, color: DAY_COLORS[st.dayTypes.length % DAY_COLORS.length], rot: false });
  for (const e of out.exercises) for (const m of e.muscles) if (!st.muscles.includes(m)) st.muscles.push(m);
  for (const r of out.recovery) if (!st.recoveryKinds.includes(r.kind)) st.recoveryKinds.push(r.kind);

  if (out.activeId && !out.workouts.some((w) => w.id === out.activeId && w.end == null)) out.activeId = null;
  for (const k of ['lastBackup', 'backupSnooze']) out.meta[k] = numOr(out.meta[k], null);
  out.v = APP.dataVersion;
  return out;
}

/* ---------- live state ---------- */
let S = defaultState();
const BOOT = { recovered: false, corrupt: false };

function loadState() {
  Store.probe();
  const res = Store.read();
  BOOT.recovered = !!res.recovered;
  BOOT.corrupt = !!res.corrupt;
  try { S = migrate(res.data); } catch (e) { console.error(e); S = defaultState(); }
  Store.snapshot();
}

/** Persist the state. Returns true on success. */
function save() {
  const ok = Store.write(S);
  if (ok) requestPersistence();
  return ok;
}

/** Ask the browser not to evict our data (best effort, once). */
function requestPersistence() {
  if (S.meta.persist != null) return;
  if (!(S.workouts.length || S.body.length)) return;
  try {
    if (navigator.storage && navigator.storage.persist) {
      S.meta.persist = 'asked';
      navigator.storage.persist().then((granted) => { S.meta.persist = !!granted; Store.write(S); }).catch(() => {});
    } else {
      S.meta.persist = false;
    }
  } catch (_) { S.meta.persist = false; }
}

/**
 * Apply a change: mutate → save → recompute → re-render.
 * opts.undo: label for an "Undo" toast (restores the previous state).
 * opts.render: false to skip re-render.
 */
function commit(mutator, opts = {}) {
  const before = opts.undo ? JSON.stringify(S) : null;
  let result;
  try {
    result = mutator(S);
  } catch (e) {
    console.error(e);
    toast('Something went wrong — nothing was changed.', { kind: 'error' });
    if (before) S = migrate(JSON.parse(before));
    return undefined;
  }
  const ok = save();
  derive();
  if (opts.render !== false) render();
  if (!ok) storageWarning();
  if (before) {
    toast(opts.undo, {
      undo: () => {
        S = migrate(JSON.parse(before));
        save(); derive(); render();
      },
    });
  }
  return result;
}

/* ---------- getters ---------- */
const exById = (id) => D.exById.get(id);
const wById = (id) => S.workouts.find((w) => w.id === id);
const activeWorkout = () => (S.activeId ? wById(S.activeId) : null);
function dayType(name) {
  return S.settings.dayTypes.find((t) => t.name === name) || { name: name || 'Workout', color: '#8E8E93', rot: false };
}
const typeColor = (name) => dayType(name).color;
const primaryMuscle = (ex) => (ex && ex.muscles && ex.muscles[0]) || 'Unassigned';
const isRealData = () => S.workouts.some((w) => !w.demo) || S.body.some((b) => !b.demo) || S.recovery.some((r) => !r.demo);
const hasDemo = () => S.workouts.some((w) => w.demo) || S.body.some((b) => b.demo) || S.recovery.some((r) => r.demo);

/* ==========================================================================
   03 · ANALYTICS
   derive() rebuilds every derived structure from the raw state after each
   change (a year of 6×/week training is only a few thousand sets, so a full
   recompute takes a few milliseconds and keeps everything consistent).
   ========================================================================== */

let D = {
  exById: new Map(), workouts: [], trained: [], sets: new Map(), sessions: new Map(),
  pr: new Map(), best: new Map(), wAgg: new Map(), days: new Map(), bodyW: [], bwAt: () => 0,
};

/** Estimated one-rep max for a set (formula chosen in Settings). */
function e1rm(load, reps, rpe) {
  if (!(load > 0) || !(reps > 0)) return 0;
  let r = reps;
  if (S.settings.e1rmUseEffort && rpe != null && S.settings.effort !== 'off') r += clamp(10 - rpe, 0, 5);
  if (r <= 1) return load;
  const epley = load * (1 + r / 30);
  const brzycki = r < 36 ? (load * 36) / (37 - r) : epley;
  if (S.settings.e1rmFormula === 'brzycki') return brzycki;
  if (S.settings.e1rmFormula === 'avg') return (epley + brzycki) / 2;
  return epley;
}

function derive() {
  const exMap = new Map(S.exercises.map((e) => [e.id, e]));
  const workouts = S.workouts.slice().sort((a, b) => a.start - b.start);

  // Body-weight timeline (for body-weight exercises and BMI)
  const bodyW = S.body.filter((b) => b.weight != null).sort((a, b) => a.date - b.date);
  const bwAt = (ts) => {
    if (!bodyW.length) return 0;
    const limit = startOfDay(ts) + DAY;
    let lo = 0, hi = bodyW.length - 1, ans = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (bodyW[mid].date < limit) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return (ans >= 0 ? bodyW[ans] : bodyW[0]).weight;
  };

  const sets = new Map(), sessions = new Map(), pr = new Map(), best = new Map(), wAgg = new Map(), days = new Map();

  for (const w of workouts) {
    const agg = { vol: 0, sets: 0, reps: 0, prs: 0, rpeSum: 0, rpeN: 0, ex: 0, primary: new Set(), all: new Set(), lastT: w.start, prList: [], volPRs: [] };
    const touched = new Set();
    for (const e of w.entries) {
      if (!e.sets.length) continue;
      const ex = exMap.get(e.exId);
      if (!ex) continue;
      let st = best.get(e.exId);
      if (!st) {
        st = { maxW: -Infinity, maxE1: 0, maxVol: 0, hist: [], firstWid: w.id, sessions: 0, bestSet: null, maxWDate: 0, maxE1Date: 0, maxVolDate: 0 };
        best.set(e.exId, st);
      }
      // No records in the very first session of an exercise — it sets the baseline.
      const allowPR = st.firstWid !== w.id;
      const recs = [];
      e.sets.forEach((s, i) => {
        const t = s.t || w.start;
        const load = s.w + (ex.bw ? bwAt(t) : 0);
        const est = e1rm(load, s.r, s.rpe);
        const vol = Math.max(0, load) * s.r;
        let flags = 0;
        if (allowPR) {
          if (s.w > st.maxW + 1e-9) flags |= PR.W;
          else {
            // Rep PR: more reps than ever at this weight or heavier
            let bestR = -1;
            for (const h of st.hist) if (h.w >= s.w - 1e-9 && h.r > bestR) bestR = h.r;
            if (bestR >= 0 && s.r > bestR) flags |= PR.R;
          }
          if (est > st.maxE1 + 0.05) flags |= PR.E;
        }
        if (s.w > st.maxW) { st.maxW = s.w; st.maxWDate = w.start; }
        if (est > st.maxE1) { st.maxE1 = est; st.maxE1Date = w.start; st.bestSet = { w: s.w, r: s.r, wid: w.id }; }
        st.hist.push({ w: s.w, r: s.r, t: w.start });
        const rec = { wid: w.id, eid: e.id, exId: e.exId, i, t, ws: w.start, type: w.type, w: s.w, r: s.r, rpe: s.rpe, load, e1: est, vol, flags };
        recs.push(rec);
        if (flags) { pr.set(`${w.id}|${e.id}|${i}`, flags); agg.prs++; agg.prList.push(rec); }
        agg.sets++; agg.reps += s.r; agg.vol += vol;
        if (s.rpe != null) { agg.rpeSum += s.rpe; agg.rpeN++; }
        if (t > agg.lastT) agg.lastT = t;
      });

      // One session per exercise per workout (an exercise may appear twice → merged)
      let list = sessions.get(e.exId);
      if (!list) { list = []; sessions.set(e.exId, list); }
      let sess = list.length && list[list.length - 1].wid === w.id ? list[list.length - 1] : null;
      if (!sess) { sess = { wid: w.id, exId: e.exId, date: w.start, type: w.type, recs: [], vol: 0, topW: -Infinity, e1: 0, volPR: false }; list.push(sess); st.sessions++; }
      for (const r of recs) { sess.recs.push(r); sess.vol += r.vol; if (r.w > sess.topW) sess.topW = r.w; if (r.e1 > sess.e1) sess.e1 = r.e1; }

      if (!sets.has(e.exId)) sets.set(e.exId, []);
      sets.get(e.exId).push(...recs);
      if (!touched.has(e.exId)) agg.ex++;
      touched.add(e.exId);
      agg.primary.add(primaryMuscle(ex));
      ex.muscles.forEach((m) => agg.all.add(m));
    }
    // Session-volume records (after all entries of this workout)
    for (const exId of touched) {
      const st = best.get(exId);
      const list = sessions.get(exId);
      const sess = list[list.length - 1];
      if (st.firstWid !== w.id && sess.vol > st.maxVol + 1e-9) { sess.volPR = true; agg.volPRs.push(sess); }
      if (sess.vol > st.maxVol) { st.maxVol = sess.vol; st.maxVolDate = w.start; }
    }
    agg.dur = w.end ? Math.max(0, w.end - w.start) : Math.max(0, Date.now() - w.start);
    agg.avgRpe = agg.rpeN ? agg.rpeSum / agg.rpeN : null;
    wAgg.set(w.id, agg);
    if (agg.sets > 0) {
      const k = dayKey(w.start);
      let dd = days.get(k);
      if (!dd) { dd = { vol: 0, sets: 0, wids: [], types: [], rec: [] }; days.set(k, dd); }
      dd.vol += agg.vol; dd.sets += agg.sets; dd.wids.push(w.id); dd.types.push(w.type);
    }
  }
  for (const r of S.recovery) {
    const k = dayKey(r.date);
    let dd = days.get(k);
    if (!dd) { dd = { vol: 0, sets: 0, wids: [], types: [], rec: [] }; days.set(k, dd); }
    dd.rec.push(r);
  }

  const bodyAll = S.body.slice().sort((a, b) => a.date - b.date);
  D = {
    exById: exMap, workouts, sets, sessions, pr, best, wAgg, days, bodyW, bwAt, bodyAll,
    trained: workouts.filter((w) => wAgg.get(w.id).sets > 0),
    lastWeight: bodyW.length ? bodyW[bodyW.length - 1] : null,
    lastBF: [...bodyAll].reverse().find((b) => b.bf != null) || null,
  };
}

/* ---------- per-exercise helpers ---------- */

/** The most recent session of an exercise before workout `w` (or overall). */
function lastSession(exId, w) {
  const list = D.sessions.get(exId);
  if (!list) return null;
  for (let i = list.length - 1; i >= 0; i--) {
    const s = list[i];
    if (w && (s.wid === w.id || s.date >= w.start)) continue;
    return s;
  }
  return null;
}

/** Weight label; body-weight exercises show "BW+10". */
function wLabel(w, ex) {
  if (ex && ex.bw) return w === 0 ? 'BW' : w > 0 ? `BW+${fmt.n(w)}` : `BW−${fmt.n(-w)}`;
  return fmt.n(w);
}
const kgUnit = (ex) => (ex && ex.bw ? '' : ' kg');

/** "3×8 @ 80 kg" · "80 kg × 8, 8, 7" · "80×8, 85×6" */
function setSummary(sets, ex) {
  if (!sets || !sets.length) return '';
  const w0 = sets[0].w, r0 = sets[0].r;
  const sameW = sets.every((s) => s.w === w0), sameR = sets.every((s) => s.r === r0);
  if (sameW && sameR) return `${sets.length}×${r0} @ ${wLabel(w0, ex)}${kgUnit(ex)}`;
  if (sameW) return `${wLabel(w0, ex)}${kgUnit(ex)} × ${sets.map((s) => s.r).join(', ')}`;
  return sets.map((s) => `${wLabel(s.w, ex)}×${s.r}`).join(', ');
}

/** Most significant label for PR flags. */
function prName(flags) {
  if (flags & PR.W) return 'Weight PR';
  if (flags & PR.R) return 'Rep PR';
  if (flags & PR.E) return 'e1RM PR';
  return '';
}
const prNames = (flags) => [PR.W, PR.R, PR.E].filter((f) => flags & f).map((f) => PR_LABEL[f]);

/** Would this draft set be a record? (only for the running workout) */
function wouldBePR(exId, w, r, rpe, wo) {
  const st = D.best.get(exId);
  if (!st || !wo || wo.end != null || st.firstWid === wo.id || w == null || !(r > 0)) return 0;
  const ex = exById(exId);
  const est = e1rm(w + (ex && ex.bw ? D.bwAt(Date.now()) : 0), r, rpe);
  let f = 0;
  if (w > st.maxW + 1e-9) f |= PR.W;
  else {
    let b = -1;
    for (const h of st.hist) if (h.w >= w - 1e-9 && h.r > b) b = h.r;
    if (b >= 0 && r > b) f |= PR.R;
  }
  if (est > st.maxE1 + 0.05) f |= PR.E;
  return f;
}

function lastWorkoutOfType(type, excludeId) {
  for (let i = D.trained.length - 1; i >= 0; i--) {
    const w = D.trained[i];
    if (w.type === type && w.id !== excludeId) return w;
  }
  return null;
}

/** Suggested next day in the rotation (Push → Pull → Legs → …). */
function nextType() {
  const rot = S.settings.dayTypes.filter((t) => t.rot).map((t) => t.name);
  const list = rot.length ? rot : S.settings.dayTypes.map((t) => t.name);
  if (!list.length) return 'Workout';
  for (let i = D.trained.length - 1; i >= 0; i--) {
    const idx = list.indexOf(D.trained[i].type);
    if (idx >= 0) return list[(idx + 1) % list.length];
  }
  return list[0];
}

/** Plates per side for a barbell weight. */
function platesFor(total) {
  const bar = S.settings.barWeight || 0;
  if (!(total > 0) || total < bar) return null;
  let side = (total - bar) / 2;
  const out = [];
  const avail = (S.settings.plates || []).slice().sort((a, b) => b - a);
  for (const p of avail) {
    while (side >= p - 1e-9) { out.push(p); side -= p; }
  }
  return { side: out, rest: round(side * 2, 2) };
}

function bmi(weight) {
  const h = S.settings.heightCm;
  if (!h || !weight) return null;
  return weight / ((h / 100) ** 2);
}

/** US-Navy tape-measure estimate (cm). Returns null when inputs are missing. */
function navyBF(m) {
  const h = S.settings.heightCm;
  if (!h || !m) return null;
  const waist = +m.waist, neck = +m.neck, hips = +m.hips;
  try {
    if (S.settings.sex === 'f') {
      if (!(waist && neck && hips) || waist + hips - neck <= 0) return null;
      return 495 / (1.29579 - 0.35004 * Math.log10(waist + hips - neck) + 0.221 * Math.log10(h)) - 450;
    }
    if (!(waist && neck) || waist - neck <= 0) return null;
    return 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(h)) - 450;
  } catch (_) { return null; }
}

/* ---------- time-series & statistics ---------- */

function inRange(ts, days) { return days == null || ts >= startOfDay(Date.now()) - (days - 1) * DAY; }

/** Weekly volume, stacked by day type (last n weeks incl. current). */
function weeklySeries(n = 12) {
  const cur = weekStart(Date.now());
  const weeks = [];
  for (let i = n - 1; i >= 0; i--) weeks.push(addDays(cur, -7 * i));
  const map = new Map(weeks.map((ws) => [ws, { vol: 0, n: 0, sets: 0, byType: {}, days: new Set() }]));
  for (const w of D.trained) {
    const b = map.get(weekStart(w.start));
    if (!b) continue;
    const a = D.wAgg.get(w.id);
    b.vol += a.vol; b.n++; b.sets += a.sets; b.days.add(dayKey(w.start));
    b.byType[w.type] = (b.byType[w.type] || 0) + a.vol;
  }
  return { weeks, data: weeks.map((ws) => map.get(ws)) };
}

/** Monthly totals (last n months incl. current). */
function monthlySeries(n = 12) {
  const cur = monthStart(Date.now());
  const months = [];
  for (let i = n - 1; i >= 0; i--) months.push(addMonths(cur, -i));
  const map = new Map(months.map((m) => [m, { vol: 0, n: 0, days: new Set(), byType: {} }]));
  for (const w of D.trained) {
    const b = map.get(monthStart(w.start));
    if (!b) continue;
    const a = D.wAgg.get(w.id);
    b.vol += a.vol; b.n++; b.days.add(dayKey(w.start));
    b.byType[w.type] = (b.byType[w.type] || 0) + a.vol;
  }
  return { months, data: months.map((m) => map.get(m)) };
}

function yearlyTotals() {
  const map = new Map();
  for (const w of D.trained) {
    const y = new Date(w.start).getFullYear();
    if (!map.has(y)) map.set(y, { vol: 0, n: 0, days: new Set(), sets: 0 });
    const b = map.get(y), a = D.wAgg.get(w.id);
    b.vol += a.vol; b.n++; b.sets += a.sets; b.days.add(dayKey(w.start));
  }
  return [...map.entries()].sort((a, b) => b[0] - a[0]);
}

/** Average session by day type (Push / Pull / Legs …). */
function byDayType(days = 90) {
  const out = new Map();
  for (const w of D.trained) {
    if (!inRange(w.start, days)) continue;
    const a = D.wAgg.get(w.id);
    if (!out.has(w.type)) out.set(w.type, { type: w.type, n: 0, vol: 0, sets: 0, dur: 0, durN: 0, rpe: 0, rpeN: 0, ex: 0 });
    const b = out.get(w.type);
    b.n++; b.vol += a.vol; b.sets += a.sets; b.ex += a.ex;
    if (w.end) { b.dur += a.dur; b.durN++; }
    if (a.rpeN) { b.rpe += a.rpeSum; b.rpeN += a.rpeN; }
  }
  const order = S.settings.dayTypes.map((t) => t.name);
  return [...out.values()]
    .map((b) => ({ ...b, avgVol: b.vol / b.n, avgSets: b.sets / b.n, avgDur: b.durN ? b.dur / b.durN : null, avgRpe: b.rpeN ? b.rpe / b.rpeN : null, avgEx: b.ex / b.n }))
    .sort((a, b) => (order.indexOf(a.type) + 99 * (order.indexOf(a.type) < 0)) - (order.indexOf(b.type) + 99 * (order.indexOf(b.type) < 0)));
}

/** Hard sets per muscle per week, rolling 28 days (primary = 1 set, secondary = ½). */
function setsPerMuscle() {
  const from = startOfDay(Date.now()) - 27 * DAY;
  const map = new Map();
  for (const w of D.trained) {
    if (w.start < from) continue;
    for (const e of w.entries) {
      const ex = exById(e.exId);
      if (!ex || !e.sets.length) continue;
      const ms = ex.muscles.length ? ex.muscles : ['Unassigned'];
      ms.forEach((m, i) => map.set(m, (map.get(m) || 0) + e.sets.length * (i === 0 ? 1 : 0.5)));
    }
  }
  return [...map.entries()].map(([m, n]) => ({ m, perWeek: n / 4 })).sort((a, b) => b.perWeek - a.perWeek);
}

/**
 * Strength change per training day (Push / Pull / Legs …) over time.
 * Every exercise is compared with its own first session in the range (its e1RM),
 * so different lifts can be averaged: a session's value is the mean % change of
 * the exercises done in it. 0 % = starting level.
 */
function strengthByType(days) {
  const from = days ? startOfDay(Date.now()) - (days - 1) * DAY : -Infinity;
  const base = new Map();
  const byType = new Map();
  for (const w of D.trained) {
    if (w.start < from || w.end == null && w.id !== S.activeId) continue;
    const changes = [];
    const seen = new Set();
    for (const e of w.entries) {
      if (!e.sets.length || seen.has(e.exId)) continue;
      seen.add(e.exId);
      const sess = (D.sessions.get(e.exId) || []).find((s) => s.wid === w.id);
      if (!sess || !(sess.e1 > 0)) continue;
      if (!base.has(e.exId)) base.set(e.exId, sess.e1);
      changes.push((sess.e1 / base.get(e.exId) - 1) * 100);
    }
    if (!changes.length) continue;
    if (!byType.has(w.type)) byType.set(w.type, []);
    byType.get(w.type).push({ x: w.start, y: avg(changes), n: changes.length });
  }
  const order = S.settings.dayTypes.map((t) => t.name);
  return [...byType.entries()]
    .filter(([, pts]) => pts.length >= 2)
    .sort((a, b) => (order.indexOf(a[0]) < 0 ? 99 : order.indexOf(a[0])) - (order.indexOf(b[0]) < 0 ? 99 : order.indexOf(b[0])))
    .map(([type, pts]) => ({ type, pts, last: pts[pts.length - 1].y }));
}

/** Rest days per complete week (excludes the current week). */
function restDays(nWeeks = 12) {
  if (!D.trained.length) return { weeks: [], avg4: null, avg12: null };
  const first = weekStart(D.trained[0].start);
  const cur = weekStart(Date.now());
  const weeks = [];
  for (let i = nWeeks; i >= 1; i--) {
    const ws = addDays(cur, -7 * i);
    if (ws < first) continue;
    const set = new Set();
    for (let d = 0; d < 7; d++) { const k = dayKey(addDays(ws, d)); const dd = D.days.get(k); if (dd && dd.sets > 0) set.add(k); }
    weeks.push({ ws, train: set.size, rest: 7 - set.size });
  }
  const last = (n) => { const arr = weeks.slice(-n); return arr.length ? avg(arr.map((w) => w.rest)) : null; };
  return { weeks, avg4: last(4), avg12: last(12) };
}

/** Days between sessions for each muscle (primary target) in the last `days` days. */
function muscleGaps(days = 14) {
  const from = startOfDay(Date.now()) - (days - 1) * DAY;
  const inWin = new Map(), last = new Map();
  for (const w of D.trained) {
    const k = dayKey(w.start);
    for (const e of w.entries) {
      const ex = exById(e.exId);
      if (!ex || !e.sets.length) continue;
      const m = primaryMuscle(ex);
      last.set(m, Math.max(last.get(m) || 0, w.start));
      if (w.start >= from) { if (!inWin.has(m)) inWin.set(m, new Set()); inWin.get(m).add(k); }
    }
  }
  const order = S.settings.muscles;
  const rows = [];
  for (const [m, lastTs] of last) {
    const ks = [...(inWin.get(m) || [])].sort();
    const gaps = [];
    for (let i = 1; i < ks.length; i++) gaps.push(daysBetween(keyToTs(ks[i - 1]), keyToTs(ks[i])));
    rows.push({ m, sessions: ks.length, avgGap: gaps.length ? avg(gaps) : null, avgRest: gaps.length ? avg(gaps) - 1 : null, last: lastTs, since: daysBetween(lastTs, Date.now()) });
  }
  return rows.sort((a, b) => (order.indexOf(a.m) < 0 ? 99 : order.indexOf(a.m)) - (order.indexOf(b.m) < 0 ? 99 : order.indexOf(b.m)));
}

/** Recovery sessions: totals per kind (last `days`) + weekly minutes. */
function recoveryStats(days = 30, nWeeks = 12) {
  const kinds = new Map();
  let count = 0, minutes = 0;
  for (const r of S.recovery) {
    if (!inRange(r.date, days)) continue;
    count++; minutes += r.min || 0;
    if (!kinds.has(r.kind)) kinds.set(r.kind, { kind: r.kind, n: 0, min: 0 });
    const k = kinds.get(r.kind); k.n++; k.min += r.min || 0;
  }
  const cur = weekStart(Date.now());
  const weeks = [];
  for (let i = nWeeks - 1; i >= 0; i--) weeks.push(addDays(cur, -7 * i));
  const wmap = new Map(weeks.map((ws) => [ws, { n: 0, min: 0 }]));
  for (const r of S.recovery) { const b = wmap.get(weekStart(r.date)); if (b) { b.n++; b.min += r.min || 0; } }
  return { count, minutes, kinds: [...kinds.values()].sort((a, b) => b.n - a.n), weeks, wdata: weeks.map((ws) => wmap.get(ws)) };
}

/** Training days per week → week streak (weeks that hit the weekly goal). */
function streakInfo() {
  const goal = S.settings.weeklyGoal;
  const cur = weekStart(Date.now());
  const counts = new Map();
  for (const k of D.days.keys()) {
    const dd = D.days.get(k);
    if (!dd.sets) continue;
    const ws = weekStart(keyToTs(k));
    counts.set(ws, (counts.get(ws) || 0) + 1);
  }
  const thisWeek = counts.get(cur) || 0;
  if (!counts.size) return { current: 0, longest: 0, thisWeek, goal, hitRate: null };
  const first = Math.min(...counts.keys());
  let current = 0;
  let ws = thisWeek >= goal ? cur : addDays(cur, -7);   // an unfinished week never breaks the streak
  while (ws >= first && (counts.get(ws) || 0) >= goal) { current++; ws = addDays(ws, -7); }
  let longest = 0, run = 0;
  for (let w = first; w <= cur; w = addDays(w, 7)) {
    if ((counts.get(w) || 0) >= goal) { run++; longest = Math.max(longest, run); } else if (w !== cur) run = 0;
  }
  // share of the last 12 complete weeks that hit the goal
  let hit = 0, n = 0;
  for (let i = 1; i <= 12; i++) { const w = addDays(cur, -7 * i); if (w < first) break; n++; if ((counts.get(w) || 0) >= goal) hit++; }
  return { current, longest, thisWeek, goal, hitRate: n ? hit / n : null };
}

/** Best weeks / months by volume. */
function bestPeriods() {
  const weeks = new Map(), months = new Map();
  for (const w of D.trained) {
    const a = D.wAgg.get(w.id);
    const ws = weekStart(w.start), ms = monthStart(w.start);
    if (!weeks.has(ws)) weeks.set(ws, { ts: ws, vol: 0, n: 0, sets: 0 });
    if (!months.has(ms)) months.set(ms, { ts: ms, vol: 0, n: 0, sets: 0, days: new Set() });
    const W = weeks.get(ws), M = months.get(ms);
    W.vol += a.vol; W.n++; W.sets += a.sets;
    M.vol += a.vol; M.n++; M.sets += a.sets; M.days.add(dayKey(w.start));
  }
  const top = (m) => [...m.values()].sort((a, b) => b.vol - a.vol).slice(0, 3);
  return { weeks: top(weeks), months: top(months) };
}

function allTime() {
  const t = { workouts: D.trained.length, days: 0, vol: 0, sets: 0, reps: 0, time: 0, timeN: 0, rpe: 0, rpeN: 0 };
  const exCount = new Map(), wd = new Array(7).fill(0);
  const dayset = new Set();
  for (const w of D.trained) {
    const a = D.wAgg.get(w.id);
    t.vol += a.vol; t.sets += a.sets; t.reps += a.reps; t.rpe += a.rpeSum; t.rpeN += a.rpeN;
    if (w.end) { t.time += a.dur; t.timeN++; }
    dayset.add(dayKey(w.start));
    wd[(new Date(w.start).getDay() + 6) % 7]++;
  }
  for (const [exId, list] of D.sessions) exCount.set(exId, list.length);
  t.days = dayset.size;
  const fav = [...exCount.entries()].sort((a, b) => b[1] - a[1])[0];
  t.favEx = fav ? { ex: exById(fav[0]), n: fav[1] } : null;
  const maxWd = Math.max(...wd);
  t.favDay = maxWd > 0 ? ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][wd.indexOf(maxWd)] : null;
  t.avgDur = t.timeN ? t.time / t.timeN : null;
  t.avgSets = t.workouts ? t.sets / t.workouts : null;
  t.avgRpe = t.rpeN ? t.rpe / t.rpeN : null;
  t.first = D.trained.length ? D.trained[0].start : null;
  return t;
}

/** Linear-regression trend of session e1RM → % change over `days`. */
function e1Trend(exId, days = 56) {
  const list = (D.sessions.get(exId) || []).filter((s) => s.date >= Date.now() - days * DAY && s.e1 > 0);
  if (list.length < 3) return null;
  const xs = list.map((s) => (s.date - list[0].date) / DAY), ys = list.map((s) => s.e1);
  const mx = avg(xs), my = avg(ys);
  let num = 0, den = 0;
  for (let i = 0; i < xs.length; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  if (!den) return null;
  const slope = num / den;
  return (slope * days / my) * 100;
}

/** Strongest lifts by best e1RM. */
function topLifts(n = 5) {
  const bw = D.lastWeight ? D.lastWeight.weight : null;
  return [...D.best.entries()]
    .map(([exId, st]) => ({ ex: exById(exId), e1: st.maxE1, date: st.maxE1Date, trend: e1Trend(exId), bw }))
    .filter((x) => x.ex && x.e1 > 0)
    .sort((a, b) => b.e1 - a.e1)
    .slice(0, n);
}

/** Squat + bench + deadlift total (best e1RMs) when all three are logged. */
function big3() {
  const find = (re) => S.exercises.find((e) => re.test(e.name) && D.best.has(e.id));
  const sq = find(/^(back )?squat$/i), bp = find(/^bench press$/i), dl = find(/^deadlift$/i);
  if (!sq || !bp || !dl) return null;
  const v = [sq, bp, dl].map((e) => D.best.get(e.id).maxE1);
  return { total: sum(v), parts: v, bw: D.lastWeight ? D.lastWeight.weight : null };
}

/** Points for the exercise progress chart. */
function exerciseSeries(exId, days) {
  const list = (D.sessions.get(exId) || []).filter((s) => inRange(s.date, days));
  return list.map((s) => ({ x: s.date, e1: s.e1, top: s.topW, vol: s.vol, s }));
}
function exerciseWeekly(exId, nWeeks) {
  const cur = weekStart(Date.now());
  const weeks = [];
  for (let i = nWeeks - 1; i >= 0; i--) weeks.push(addDays(cur, -7 * i));
  const map = new Map(weeks.map((w) => [w, 0]));
  for (const s of D.sessions.get(exId) || []) { const k = weekStart(s.date); if (map.has(k)) map.set(k, map.get(k) + s.vol); }
  return { weeks, vals: weeks.map((w) => map.get(w)) };
}

/** Best reps at each weight used. */
function repRecords(exId, limit = 10) {
  const map = new Map();
  for (const r of D.sets.get(exId) || []) {
    const cur = map.get(r.w);
    if (!cur || r.r > cur.r) map.set(r.w, { w: r.w, r: r.r, date: r.ws, e1: r.e1 });
  }
  return [...map.values()].sort((a, b) => b.w - a.w).slice(0, limit);
}

/** Records set in the last `days` days, one per exercise (most significant). */
function recentPRs(days = 14, limit = 4) {
  const from = startOfDay(Date.now()) - (days - 1) * DAY;
  const rank = (f) => (f & PR.W ? 3 : f & PR.E ? 2 : 1);
  const byEx = new Map();
  for (const w of D.trained) {
    if (w.start < from) continue;
    for (const rec of D.wAgg.get(w.id).prList) {
      const cur = byEx.get(rec.exId);
      if (!cur || rec.ws > cur.ws || (rec.ws === cur.ws && (rank(rec.flags) > rank(cur.flags) || (rank(rec.flags) === rank(cur.flags) && rec.e1 > cur.e1)))) byEx.set(rec.exId, rec);
    }
  }
  return [...byEx.values()].sort((a, b) => b.ws - a.ws || b.e1 - a.e1).slice(0, limit);
}

/** Mon–Sun of the current week for the home strip. */
function weekStrip() {
  const ws = weekStart(Date.now());
  const today = dayKey(Date.now());
  const out = [];
  for (let i = 0; i < 7; i++) {
    const ts = addDays(ws, i), k = dayKey(ts), dd = D.days.get(k);
    out.push({ ts, k, types: dd && dd.sets ? dd.types : [], rec: !!(dd && dd.rec.length), today: k === today, future: k > today });
  }
  return out;
}

/* ==========================================================================
   04 · CHARTS (dependency-free SVG — works fully offline)
   Screens call chart(spec) which returns a placeholder; after the HTML is in
   the DOM, mountCharts() measures the width and draws the SVG. Every chart
   has a tap/hover read-out (crosshair for lines, per-bar for bars).
   Marks follow fixed specs: 2px lines, ≤24px bars with 4px rounded ends,
   2px surface gaps between stacked segments, hairline recessive grid.
   ========================================================================== */

const Charts = { specs: new Map(), seq: 0 };
const SURFACE = '#1C1C1E';
const GRID = '#2C2C2E';
const AXIS_INK = '#8E8E93';

/** Register a chart and return its placeholder. */
function chart(spec) {
  const id = 'c' + ++Charts.seq;
  Charts.specs.set(id, spec);
  const h = spec.height + (spec.type === 'bar' || spec.xAxis !== false ? 22 : 0);
  return `<div class="chart" data-chart="${id}" style="height:${h}px" role="img" aria-label="${esc(spec.label || 'Chart')}"></div>`;
}

function mountCharts(root = document) {
  for (const el of $$('[data-chart]', root)) {
    const spec = Charts.specs.get(el.dataset.chart);
    if (!spec) continue;
    try {
      if (spec.type === 'bar') drawBars(el, spec);
      else drawLine(el, spec);
    } catch (e) {
      console.error('chart', e);
      el.innerHTML = '<div class="chart-empty">Chart unavailable</div>';
    }
  }
}

/* ---------- scales ---------- */
function niceNum(range, roundIt) {
  if (!(range > 0)) return 1;
  const exp = Math.floor(Math.log10(range));
  const f = range / 10 ** exp;
  let nf;
  if (roundIt) nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
  else nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
  return nf * 10 ** exp;
}
function niceTicks(min, max, count = 4) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) { min = 0; max = 1; }
  if (min === max) { const p = Math.abs(min) * 0.05 || 1; min -= p; max += p; }
  const step = niceNum(niceNum(max - min, false) / (count - 1), true);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(round(v, 6));
  return { lo, hi, ticks };
}
function timeLabel(ts, span) {
  if (span <= 150 * DAY) return fmt.dayMonth(ts);
  if (span <= 400 * DAY) return fmt.monthS(ts);
  return new Date(ts).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
}

/* ---------- tooltip ---------- */
function tipEl(el) {
  let t = el.querySelector('.tip');
  if (!t) { t = document.createElement('div'); t.className = 'tip'; el.appendChild(t); }
  return t;
}
/** rows: [{ value, label, color, line:true|false }] — built with textContent (labels are user data). */
function showTip(el, x, title, rows) {
  const t = tipEl(el);
  t.textContent = '';
  const h = document.createElement('div'); h.className = 'tip-t'; h.textContent = title; t.appendChild(h);
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'tip-r';
    if (r.color) { const k = document.createElement('i'); k.className = r.line ? 'tip-k ln' : 'tip-k'; k.style.background = r.color; row.appendChild(k); }
    const b = document.createElement('b'); b.textContent = r.value; row.appendChild(b);
    if (r.label) { const s = document.createElement('span'); s.textContent = r.label; row.appendChild(s); }
    t.appendChild(row);
  }
  t.classList.add('on');
  const w = t.offsetWidth, W = el.clientWidth;
  t.style.left = clamp(x - w / 2, 0, Math.max(0, W - w)) + 'px';
}
function hideTip(el) { const t = el.querySelector('.tip'); if (t) t.classList.remove('on'); }

/* ---------- line chart ----------
   spec: { type:'line', height, series:[{ name, color, pts:[{x,y,mark?}], area?, dots?, glow?, width? }],
           yFmt, yZero?, xFmt?, tipTitle?(x), empty? } */
function drawLine(el, spec) {
  const W = Math.max(200, el.clientWidth || 320);
  const H = spec.height;
  const series = spec.series.filter((s) => s.pts && s.pts.length);
  const all = series.flatMap((s) => s.pts);
  if (!all.length) { el.innerHTML = `<div class="chart-empty">${esc(spec.empty || 'No data yet')}</div>`; return; }
  const yFmt = spec.yFmt || ((v) => fmt.n(v, 1));

  let x0 = Math.min(...all.map((p) => p.x)), x1 = Math.max(...all.map((p) => p.x));
  if (x0 === x1) { x0 -= 3 * DAY; x1 += 3 * DAY; }
  let y0 = Math.min(...all.map((p) => p.y)), y1 = Math.max(...all.map((p) => p.y));
  if (spec.yZero) y0 = Math.min(0, y0);
  if (spec.yIncludeZero) { y0 = Math.min(0, y0); y1 = Math.max(0, y1); }
  const padY = (y1 - y0) * 0.08 || Math.abs(y1) * 0.05 || 1;
  const nt = niceTicks(spec.yZero ? y0 : y0 - padY, y1 + padY, 4);
  const tickW = Math.max(...nt.ticks.map((t) => yFmt(t).length)) * 6.6 + 10;
  const pl = 2, pr = tickW, pt = 8, pb = 4;
  const iw = W - pl - pr, ih = H - pt - pb;
  const sx = (x) => pl + ((x - x0) / (x1 - x0)) * iw;
  const sy = (y) => pt + ih - ((y - nt.lo) / (nt.hi - nt.lo || 1)) * ih;

  let g = '';
  for (const t of nt.ticks) {
    const y = sy(t);
    g += `<line x1="${pl}" x2="${pl + iw}" y1="${y}" y2="${y}" stroke="${GRID}" stroke-width="1"/>`;
    g += `<text x="${W - 2}" y="${y + 4}" text-anchor="end" class="ax">${esc(yFmt(t))}</text>`;
  }
  // x labels
  if (spec.xAxis !== false) {
    const n = W < 340 ? 3 : 4;
    for (let i = 0; i < n; i++) {
      const xv = x0 + ((x1 - x0) * i) / (n - 1);
      const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      g += `<text x="${sx(xv)}" y="${H + 16}" text-anchor="${anchor}" class="ax">${esc((spec.xFmt || ((v) => timeLabel(v, x1 - x0)))(xv))}</text>`;
    }
  }
  // series
  let paths = '', dots = '';
  series.forEach((s, si) => {
    const pts = s.pts.slice().sort((a, b) => a.x - b.x);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
    if (s.area && pts.length > 1) {
      const base = sy(nt.lo);
      paths += `<path d="${d}L${sx(pts[pts.length - 1].x).toFixed(1)},${base}L${sx(pts[0].x).toFixed(1)},${base}Z" fill="${s.color}" fill-opacity="0.1" stroke="none"/>`;
    }
    const glow = s.glow ? ` style="filter:drop-shadow(0 0 5px ${hexA(s.color, 0.55)})"` : '';
    if (pts.length > 1) paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="1 5"' : ''}${s.opacity ? ` stroke-opacity="${s.opacity}"` : ''}${glow}/>`;
    if (s.dots === 'all' || pts.length === 1) for (const p of pts) dots += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3.5" fill="${s.color}" stroke="${SURFACE}" stroke-width="2"/>`;
    for (const p of pts) if (p.mark) dots += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="5" fill="${SURFACE}" stroke="${GOLD}" stroke-width="2"/>`;
    if (s.dots !== 'none' && pts.length) { const p = pts[pts.length - 1]; dots += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="4.5" fill="${s.color}" stroke="${SURFACE}" stroke-width="2"/>`; }
  });

  el.innerHTML = `<svg width="${W}" height="${H + (spec.xAxis === false ? 0 : 22)}" viewBox="0 0 ${W} ${H + (spec.xAxis === false ? 0 : 22)}">${g}${paths}${dots}<line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" stroke="${AXIS_INK}" stroke-width="1" opacity="0"/><g class="hl"></g><rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;

  // interaction: crosshair snaps to the nearest x, read-out lists every series at that x
  const xsAll = [...new Set(all.map((p) => p.x))].sort((a, b) => a - b);
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), hl = svg.querySelector('.hl');
  const pick = (clientX) => {
    const r = svg.getBoundingClientRect();
    const px = clientX - r.left;
    let best = xsAll[0], bd = Infinity;
    for (const xv of xsAll) { const d = Math.abs(sx(xv) - px); if (d < bd) { bd = d; best = xv; } }
    const X = sx(best);
    xh.setAttribute('x1', X); xh.setAttribute('x2', X); xh.setAttribute('opacity', '0.6');
    let hc = '';
    const rows = [];
    for (const s of series) {
      // carry: series logged on different days show their latest value up to this date
      const p = spec.carry ? [...s.pts].filter((q) => q.x <= best).pop() : s.pts.find((q) => q.x === best);
      if (!p) continue;
      hc += `<circle cx="${X}" cy="${sy(p.y)}" r="5" fill="${s.color}" stroke="${SURFACE}" stroke-width="2"/>`;
      rows.push({ value: (s.fmt || yFmt)(p.y), label: series.length > 1 ? s.name : (p.note || ''), color: series.length > 1 ? s.color : null, line: true });
      if (series.length === 1 && p.mark) rows.push({ value: '', label: 'Record', color: GOLD });
    }
    hl.innerHTML = hc;
    showTip(el, X, spec.tipTitle ? spec.tipTitle(best) : fmt.dateY(best), rows);
  };
  const off = () => { xh.setAttribute('opacity', '0'); hl.innerHTML = ''; hideTip(el); };
  svg.addEventListener('pointerdown', (e) => pick(e.clientX));
  svg.addEventListener('pointermove', (e) => pick(e.clientX));
  svg.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') off(); });
}

/* ---------- bar chart (optionally stacked) ----------
   spec: { type:'bar', height, labels:[], stacks:[{ name, color, vals:[] }], yFmt, tipTitle(i), totalFmt } */
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  if (h <= 0) return '';
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function drawBars(el, spec) {
  const W = Math.max(200, el.clientWidth || 320);
  const H = spec.height;
  const n = spec.labels.length;
  const totals = spec.labels.map((_, i) => sum(spec.stacks.map((s) => s.vals[i] || 0)));
  const yFmt = spec.yFmt || ((v) => fmt.compact(v));
  if (!totals.some((v) => v > 0)) { el.innerHTML = `<div class="chart-empty">${esc(spec.empty || 'No data yet')}</div>`; return; }
  const nt = niceTicks(0, Math.max(...totals), 3);
  const tickW = Math.max(...nt.ticks.map((t) => yFmt(t).length)) * 6.6 + 10;
  const pl = 2, pr = tickW, pt = 8;
  const iw = W - pl - pr, ih = H - pt;
  const band = iw / n;
  const bw = Math.min(24, band * 0.64);
  const sy = (v) => pt + ih - (v / (nt.hi || 1)) * ih;

  let g = '';
  for (const t of nt.ticks) {
    const y = sy(t);
    g += `<line x1="${pl}" x2="${pl + iw}" y1="${y}" y2="${y}" stroke="${GRID}" stroke-width="1"/>`;
    g += `<text x="${W - 2}" y="${y + 4}" text-anchor="end" class="ax">${esc(yFmt(t))}</text>`;
  }
  const every = Math.max(1, Math.ceil(n / Math.floor(iw / 38)));
  let bars = '';
  for (let i = 0; i < n; i++) {
    const cx = pl + band * i + band / 2;
    const x = cx - bw / 2;
    let acc = 0;
    const segs = spec.stacks.map((s) => ({ v: s.vals[i] || 0, c: s.color })).filter((s) => s.v > 0);
    let col = '';
    segs.forEach((s, si) => {
      const yTop = sy(acc + s.v), yBot = sy(acc);
      const gap = si > 0 ? 2 : 0;                       // 2px surface gap between stacked segments
      const h = Math.max(0, yBot - yTop - gap);
      const top = si === segs.length - 1;
      col += top ? `<path d="${barPath(x, yTop, bw, h, 4)}" fill="${s.c}"/>` : `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${s.c}"/>`;
      acc += s.v;
    });
    bars += `<g class="bar" data-i="${i}">${col}</g>`;
    if (i % every === (n - 1) % every) bars += `<text x="${cx}" y="${H + 16}" text-anchor="middle" class="ax${i === n - 1 && spec.markLast ? ' ax-on' : ''}">${esc(spec.labels[i])}</text>`;
  }
  el.innerHTML = `<svg width="${W}" height="${H + 22}" viewBox="0 0 ${W} ${H + 22}">${g}${bars}<rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;

  const svg = el.querySelector('svg');
  const groups = $$('.bar', svg);
  const pick = (clientX) => {
    const r = svg.getBoundingClientRect();
    const i = clamp(Math.floor((clientX - r.left - pl) / band), 0, n - 1);
    groups.forEach((gEl, gi) => gEl.setAttribute('opacity', gi === i ? '1' : '0.45'));
    const rows = [];
    if (spec.stacks.length > 1) {
      rows.push({ value: (spec.totalFmt || yFmt)(totals[i]), label: 'total' });
      for (const s of spec.stacks) if (s.vals[i]) rows.push({ value: (spec.totalFmt || yFmt)(s.vals[i]), label: s.name, color: s.color });
    } else rows.push({ value: (spec.totalFmt || yFmt)(totals[i]), label: spec.unitLabel || '' });
    showTip(el, pl + band * i + band / 2, spec.tipTitle ? spec.tipTitle(i) : spec.labels[i], rows);
  };
  const off = () => { groups.forEach((gEl) => gEl.setAttribute('opacity', '1')); hideTip(el); };
  svg.addEventListener('pointerdown', (e) => pick(e.clientX));
  svg.addEventListener('pointermove', (e) => pick(e.clientX));
  svg.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') off(); });
}

/** Legend row (≥ 2 series). kind: 'bar' → swatch, 'line' → line key. */
function legend(items, kind = 'bar') {
  return `<div class="legend">${items.map((it) => `<span><i class="${kind === 'line' ? 'ln' : ''}" style="background:${it.color}"></i>${esc(it.name)}</span>`).join('')}</div>`;
}

/** Tiny trend line (no axes). */
function sparkline(vals, color = CHALK, w = 96, h = 34) {
  const v = vals.filter((x) => x != null && Number.isFinite(x));
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y, i) => [2 + (i / (v.length - 1)) * (w - 6), 3 + (h - 6) - ((y - lo) / span) * (h - 6)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/></svg>`;
}

/** Visual barbell: plates on one side, competition colours, height by size. */
const PLATE_STYLE = {
  25: ['#D2352C', 40], 20: ['#2F64D0', 40], 15: ['#E3B21F', 36], 10: ['#2B9A52', 32], 5: ['#E9E9E6', 26],
  2.5: ['#B9302A', 22], 2: ['#2A5BBE', 21], 1.5: ['#CFA21D', 20], 1.25: ['#B5B5BA', 19], 1: ['#279048', 18], 0.5: ['#DADAD6', 16],
};
function plateSVG(side) {
  const h = 42, mid = h / 2;
  let x = 0, out = `<rect x="0" y="${mid - 3}" width="16" height="6" rx="2" fill="#6B6B70"/><rect x="14" y="${mid - 9}" width="5" height="18" rx="1.5" fill="#8E8E93"/>`;
  x = 21;
  for (const p of side) {
    const [c, ph] = PLATE_STYLE[p] || ['#9A9AA0', 20];
    const pw = p >= 10 ? 7 : p >= 2.5 ? 6 : 5;
    out += `<rect x="${x}" y="${mid - ph / 2}" width="${pw}" height="${ph}" rx="1.6" fill="${c}"/>`;
    x += pw + 1.5;
  }
  out += `<rect x="${x}" y="${mid - 3}" width="${Math.max(10, 26 - side.length)}" height="6" rx="2" fill="#6B6B70"/>`;
  const W = x + Math.max(10, 26 - side.length) + 2;
  return `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-hidden="true">${out}</svg>`;
}

   05 · UI FRAMEWORK
   Hash router (works from file:// and with the phone's back gesture),
   render loop, tab bar, bottom sheets, dialogs, toasts, wake lock, timers.

/** Ephemeral UI state (never saved). */
const UI = {
  scroll: {},
  lastKey: null,
  draft: null,          // set editor in the logger: { key, w, r, rpe }
  hist: { kind: 'all', range: null, type: null, exId: null, muscle: null, limit: 40 },
  prog: 'overview',
  progEx: null,
  exRange: 180,
  exMetric: 'e1',
  typeRange: 90,
  strRange: 90,
  calMonth: monthStart(Date.now()),
  bodyRange: 90,
  bodyMetric: 'weight',
  measure: 'waist',
  lib: { q: '', muscle: null, archived: false },
  picker: null,
  dialog: null,
  pendingTab: null,
  warnedStorage: false,
};

const TABS = [
  ['home', 'Today', 'home'],
  ['history', 'History', 'history'],
  ['progress', 'Progress', 'progress'],
  ['body', 'Body', 'body'],
  ['library', 'Exercises', 'library'],
];

/** Route table — tab: which tab is highlighted; full: hides the tab bar (workout flow). */
const SCREENS = {
  home: { tab: 'home', render: renderHome },
  history: { tab: 'history', render: renderHistory },
  progress: { tab: 'progress', render: renderProgress },
  body: { tab: 'body', render: renderBody },
  library: { tab: 'library', render: renderLibrary },
  workout: { full: true, render: renderWorkout },
  log: { full: true, render: renderLogger },
  summary: { full: true, render: renderSummary },
  w: { tab: 'history', render: renderWorkoutDetail },
  ex: { tab: 'library', render: renderExercise },
  settings: { tab: 'home', render: renderSettings },
};

/* ---------- router ---------- */
function route() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean).map((p) => { try { return decodeURIComponent(p); } catch (_) { return p; } });
  const name = SCREENS[parts[0]] ? parts[0] : 'home';
  const params = SCREENS[parts[0]] ? parts.slice(1) : [];
  return { name, params, key: [name, ...params].join('/') };
}
function histOp(method, url, state) {
  try { history[method](state, '', url); return true; } catch (_) { return false; }
}
const depthNow = () => (history.state && history.state.depth) || 0;

/** Navigate to "name/param/…". opts.replace replaces the current history entry. */
function go(path, opts = {}) {
  UI.scroll[route().key] = window.scrollY;
  const url = '#/' + path.split('/').map(encodeURIComponent).join('/');
  if (opts.replace) histOp('replaceState', url, { depth: depthNow() });
  else if (!histOp('pushState', url, { depth: depthNow() + 1 })) { location.hash = url; return; }
  render();
}
/** Navigation from inside render(): defer to avoid nested renders. */
function redirect(path) { setTimeout(() => go(path, { replace: true }), 0); return ''; }
function back(fallback = 'home') {
  if (depthNow() > 0 && !(history.state && history.state.sheet)) history.back();
  else go(fallback, { replace: true });
}
function goTab(name) {
  const d = depthNow();
  if (d > 0) { UI.pendingTab = name; history.go(-d); } else go(name, { replace: true });
}

window.addEventListener('popstate', () => {
  if (Sheets.popped()) return;
  closeDialog(null);
  if (UI.pendingTab) {
    const t = UI.pendingTab; UI.pendingTab = null;
    histOp('replaceState', '#/' + t, { depth: 0 });
  }
  render();
});

/* ---------- render loop ---------- */
/** Drop finished workouts (or exercises) that ended up without any sets — except the one being edited. */
function cleanupEmpty(r) {
  const keep = r.name === 'workout' || r.name === 'log' ? r.params[0] : null;
  let changed = false;
  for (const w of S.workouts) {
    if (w.end == null || w.id === keep) continue;
    if (w.entries.some((e) => !e.sets.length)) { w.entries = w.entries.filter((e) => e.sets.length); changed = true; }
  }
  const before = S.workouts.length;
  S.workouts = S.workouts.filter((w) => w.end == null || w.id === keep || w.entries.length);
  if (changed || S.workouts.length !== before) { save(); derive(); }
}

function render() {
  const r = route();
  const scr = SCREENS[r.name];
  cleanupEmpty(r);
  const same = r.key === UI.lastKey;
  const y = window.scrollY;
  Charts.specs.clear();
  let html;
  try {
    html = scr.render(...r.params);
  } catch (e) {
    console.error(e);
    html = `<div class="empty">${ic('warn')}<h3>This screen couldn't be shown</h3><p>Your data is safe. ${esc(e.message || '')}</p><button class="btn primary mt16" data-act="tab" data-tab="home">Go to Today</button></div>`;
  }
  if (html == null || html === '') return;
  const view = $('#view');
  view.innerHTML = storageBanner() + html;
  view.className = 'view' + (scr.full ? ' full' : '');
  document.body.classList.toggle('no-tabs', !!scr.full);
  renderChrome(scr);
  mountCharts(view);
  if (r.name === 'log') updateEditorExtras();
  const hw = $('#heat-wrap');
  if (hw) hw.scrollLeft = hw.scrollWidth;
  window.scrollTo(0, same ? y : UI.scroll[r.key] || 0);
  UI.lastKey = r.key;
  tick();
  Wake.sync(r.name);
}

function renderChrome(scr) {
  const tb = $('#tabbar');
  if (scr.full) tb.hidden = true;
  else {
    tb.hidden = false;
    tb.innerHTML = `<div class="tabbar-in">${TABS.map(([id, label, icon]) => `<button class="tab${scr.tab === id ? ' on' : ''}" data-act="tab" data-tab="${id}"${scr.tab === id ? ' aria-current="page"' : ''}>${ic(icon)}<span>${label}</span></button>`).join('')}</div>`;
  }
  const rb = $('#resume');
  const aw = activeWorkout();
  if (aw && !scr.full && route().name !== 'home') {   // Today shows it in the hero already
    const c = typeColor(aw.type);
    rb.hidden = false;
    rb.style.setProperty('--ctx', c);
    rb.style.setProperty('--ctx-a', hexA(c, 0.45));
    const a = D.wAgg.get(aw.id) || { sets: 0 };
    rb.innerHTML = `<button class="resume-in" data-act="resume"><span class="resume-dot"></span><span class="resume-txt"><b>${esc(aw.type)} in progress</b><span>${pl(a.sets, 'set')} logged</span></span><span class="resume-go">Resume</span></button>`;
    document.body.classList.add('has-resume');
  } else {
    rb.hidden = true;
    rb.innerHTML = '';
    document.body.classList.remove('has-resume');
  }
}

function storageBanner() {
  if (Store.available && !Store.failed) return '';
  const msg = !Store.available
    ? 'This browser blocks storage here, so nothing is saved after you close the page. Open the app from a normal (non-private) browser tab or export a backup before leaving.'
    : 'The last change could not be saved (storage full or blocked). Export a backup in Settings to keep your data safe.';
  return `<div class="banner danger" role="alert">${ic('warn')}<div><b>${!Store.available ? 'Not saving' : 'Save failed'}</b><p>${msg}</p><button class="btn sm mt8" data-act="export-json">Export backup</button></div></div>`;
}
function storageWarning() {
  if (UI.warnedStorage) return;
  UI.warnedStorage = true;
  toast('Couldn’t save — storage is full or blocked. Export a backup.', { kind: 'error', ms: 6000 });
}

/* ---------- bottom sheets ---------- */
const Sheets = {
  stack: [],
  _resolve: null,
  open(def) {
    const s = { ...def };
    s.bd = document.createElement('div');
    s.bd.className = 'backdrop';
    s.bd.dataset.act = 'sheet-close';
    s.el = document.createElement('div');
    s.el.className = 'sheet ' + (def.cls || '');
    s.el.setAttribute('role', 'dialog');
    s.el.setAttribute('aria-modal', 'true');
    s.el.setAttribute('aria-label', def.title || 'Sheet');
    document.body.append(s.bd, s.el);
    this.stack.push(s);
    this.paint(s);
    s.pushed = histOp('pushState', location.hash, { depth: depthNow() + 1, sheet: true });
    requestAnimationFrame(() => requestAnimationFrame(() => { s.bd.classList.add('in'); s.el.classList.add('in'); }));
    document.body.classList.add('sheet-open');
    return s;
  },
  /** (Re)paint a sheet from its body()/foot() functions, keeping scroll position. */
  paint(s = this.top()) {
    if (!s) return;
    const old = s.el.querySelector('.sheet-b');
    const sc = old ? old.scrollTop : 0;
    s.el.innerHTML = `<div class="grab" aria-hidden="true"></div>
      <div class="sheet-h"><div class="sheet-t">${esc(s.title || '')}</div><button class="ib" data-act="sheet-close" aria-label="Close">${ic('x')}</button></div>
      <div class="sheet-b">${s.body()}</div>${s.foot ? `<div class="sheet-f">${s.foot()}</div>` : ''}`;
    const nb = s.el.querySelector('.sheet-b');
    if (nb) nb.scrollTop = sc;
    if (s.afterPaint) s.afterPaint(s);
  },
  top() { return this.stack[this.stack.length - 1]; },
  /** Close the top sheet (via history so the back gesture stays in sync). */
  _skip: 0,
  _waiters: [],
  /** Close the top sheet right away; its history entry is removed in the background. */
  close() {
    return new Promise((res) => {
      const s = this.top();
      if (!s) return res();
      this.remove();
      if (s.pushed && history.state && history.state.sheet) {
        let done = false;
        const fin = () => { if (!done) { done = true; res(); } };
        this._skip++;
        this._waiters.push(fin);
        history.back();
        setTimeout(fin, 400);                     // never wait forever for popstate
      } else res();
    });
  },
  /** Called from popstate. Returns true when the event belonged to a sheet. */
  popped() {
    if (this._skip > 0) { this._skip--; const w = this._waiters.shift(); if (w) w(); return true; }
    if (this.stack.length) { this.remove(); return true; }   // back gesture closed a sheet
    return false;
  },
  remove() {
    const s = this.stack.pop();
    if (!s) return;
    s.el.classList.remove('in'); s.bd.classList.remove('in');
    setTimeout(() => { s.el.remove(); s.bd.remove(); }, 280);
    if (!this.stack.length) document.body.classList.remove('sheet-open');
    if (s.onClose) s.onClose();
  },
  async closeAll() { while (this.stack.length) await this.close(); },
};
const openSheet = (def) => Sheets.open(def);
const closeSheet = () => Sheets.close();
const repaintSheet = () => Sheets.paint();

/* ---------- dialogs (confirm / choose / prompt) ---------- */
function choose({ title, text = '', options, input = null }) {
  return new Promise((resolve) => {
    closeDialog(null);
    const bd = document.createElement('div');
    bd.className = 'dlg-bd';
    const dl = document.createElement('div');
    dl.className = 'dialog';
    dl.setAttribute('role', 'alertdialog');
    dl.setAttribute('aria-modal', 'true');
    const btns = options.map((o, i) => `<button class="btn block ${o.cls || ''}" data-dlg="${i}">${esc(o.label)}</button>`).join('');
    dl.innerHTML = `<h3></h3>${text ? '<p></p>' : ''}${input ? `<input class="field mt12" id="dlg-in" autocomplete="off" ${input.numeric ? 'inputmode="decimal"' : ''}>` : ''}<div class="dlg-actions${options.length > 2 ? ' stack' : ''}">${btns}</div>`;
    dl.querySelector('h3').textContent = title;
    if (text) dl.querySelector('p').textContent = text;
    document.body.append(bd, dl);
    if (input) { const f = dl.querySelector('#dlg-in'); f.value = input.value || ''; f.placeholder = input.placeholder || ''; setTimeout(() => f.focus(), 50); }
    UI.dialog = { bd, dl, resolve };
    requestAnimationFrame(() => { bd.classList.add('in'); dl.classList.add('in'); });
    dl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-dlg]');
      if (!b) return;
      const o = options[+b.dataset.dlg];
      closeDialog(input && o.value !== null ? { value: o.value, text: dl.querySelector('#dlg-in').value } : o.value);
    });
    bd.addEventListener('click', () => closeDialog(null));
  });
}
/** Text prompt → string, or null when cancelled. */
async function promptText({ title, text = '', value = '', placeholder = '', ok = 'Save', numeric = false }) {
  const res = await choose({ title, text, input: { value, placeholder, numeric }, options: [{ label: 'Cancel', value: false }, { label: ok, value: true, cls: 'primary' }] });
  return res && res.value === true ? res.text : null;
}
function ask({ title, text, ok = 'OK', cancel = 'Cancel', danger = false }) {
  return choose({ title, text, options: [{ label: cancel, value: false }, { label: ok, value: true, cls: danger ? 'danger-fill' : 'primary' }] }).then((v) => v === true);
}
function closeDialog(val) {
  const d = UI.dialog;
  if (!d) return;
  UI.dialog = null;
  d.bd.remove(); d.dl.remove();
  d.resolve(val);
}

/* ---------- toasts ---------- */
function toast(text, { undo, kind = '', ms = 3200, icon } = {}) {
  const root = $('#toasts');
  if (!root) return;
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.setAttribute('role', 'status');
  t.innerHTML = `${icon ? ic(icon) : ''}<span class="t-msg"></span>${undo ? '<button class="t-act">Undo</button>' : ''}`;
  t.querySelector('.t-msg').textContent = text;
  const dismiss = () => { t.classList.remove('in'); setTimeout(() => t.remove(), 260); };
  if (undo) t.querySelector('.t-act').addEventListener('click', () => { dismiss(); undo(); toast('Undone'); });
  root.appendChild(t);
  while (root.children.length > 2) root.firstChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  setTimeout(dismiss, undo ? 6000 : ms);
}

/* ---------- live timers (workout clock, time since last set) ---------- */
function tick() {
  const now = Date.now();
  for (const el of document.querySelectorAll('[data-tick]')) {
    const from = +el.dataset.from;
    if (from) el.textContent = fmt.clock(now - from);
  }
}

/* ---------- keep the screen on during a workout ---------- */
const Wake = {
  lock: null,
  async sync(routeName) {
    const want = !!(S.settings.keepAwake && activeWorkout() && (routeName === 'workout' || routeName === 'log') && document.visibilityState === 'visible');
    try {
      if (want && !this.lock && 'wakeLock' in navigator) {
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => { this.lock = null; });
      } else if (!want && this.lock) {
        const l = this.lock; this.lock = null; await l.release();
      }
    } catch (_) { this.lock = null; }
  },
};

/** Short vibration on supported phones (Android). */
function buzz(p = 12) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) { /* ignore */ } }

/* ---------- small shared view helpers ---------- */
function navBar({ title = '', backTo = null, backLabel = 'Back', right = '' }) {
  return `<header class="nb"><div class="nb-l">${backTo !== false ? `<button class="nb-back" data-act="back" data-fallback="${esc(backTo || 'home')}">${ic('left')}<span>${esc(backLabel)}</span></button>` : ''}</div><div class="nb-title">${esc(title)}</div><div class="nb-r">${right}</div></header>`;
}
function largeTitle(title, sub = '', actions = '') {
  return `<header class="lt"><div><h1>${esc(title)}</h1>${sub ? `<p class="lt-sub">${sub}</p>` : ''}</div><div class="lt-actions">${actions}</div></header>`;
}
function emptyState(icon, title, text, action = '') {
  return `<div class="empty">${ic(icon)}<h3>${esc(title)}</h3><p>${text}</p>${action}</div>`;
}
function typePill(type) {
  return `<span class="pill" style="--dc:${typeColor(type)}">${esc(type)}</span>`;
}
function seg(name, options, current) {
  return `<div class="seg" role="tablist">${options.map(([v, l]) => `<button role="tab" aria-selected="${String(v) === String(current)}" class="${String(v) === String(current) ? 'on' : ''}" data-act="seg" data-seg="${name}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;
}
function toggleRow(label, key, on, sub = '') {
  return `<button class="row" data-act="toggle-setting" data-key="${key}" role="switch" aria-checked="${!!on}"><div class="row-main"><div class="row-title">${esc(label)}</div>${sub ? `<div class="row-sub">${sub}</div>` : ''}</div><span class="sw${on ? ' on' : ''}"></span></button>`;
}
function deltaHTML(pct, { goodUp = true, suffix = '' } = {}) {
  if (pct == null || !Number.isFinite(pct)) return '';
  if (Math.abs(pct) < 0.5) return `<span class="delta flat">${ic('right')}flat${suffix}</span>`;
  const good = goodUp ? pct > 0 : pct < 0;
  return `<span class="delta ${good ? 'up' : 'down'}">${ic(pct > 0 ? 'arrowUp' : 'arrowDown')}${fmt.pct(pct)}${suffix}</span>`;
}

const EFFORT_RPE = [6, 7, 7.5, 8, 8.5, 9, 9.5, 10];
